<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<title>Login - Self Agent Orchestrator</title>
<style>
  :root {
    /* Light Theme (Default) */
    --bg: #f8f8f8;
    --card-bg: rgba(255, 255, 255, 0.65);
    --border: rgba(0, 0, 0, 0.08);
    --border-focus: #0f62fe;
    --text: #1a1a1a;
    --text-strong: #000000;
    --accent: #0f62fe;
    --accent-hover: #0353e9;
    --error: #da1e28;
    --error-bg: rgba(218, 30, 40, 0.05);
    --input-bg: rgba(255, 255, 255, 0.85);
    --glow-1: rgba(15, 98, 254, 0.05);
    --glow-2: rgba(168, 68, 0, 0.03);
    --card-shadow: 0 16px 36px rgba(0, 0, 0, 0.06);
    --logo-gradient: linear-gradient(135deg, #000 0%, #6f6f6f 100%);
    --toggle-color: #767676;
    --toggle-hover: #1a1a1a;
  }
  :root[data-theme="dark"] {
    /* Dark Theme */
    --bg: #0a0a0a;
    --card-bg: rgba(26, 26, 26, 0.45);
    --border: rgba(255, 255, 255, 0.08);
    --border-focus: #0f62fe;
    --text: #d4d4d4;
    --text-strong: #ffffff;
    --accent: #0f62fe;
    --accent-hover: #0353e9;
    --error: #ff8389;
    --error-bg: rgba(255, 131, 137, 0.08);
    --input-bg: rgba(10, 10, 10, 0.6);
    --glow-1: rgba(15, 98, 254, 0.08);
    --glow-2: rgba(168, 68, 0, 0.05);
    --card-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    --logo-gradient: linear-gradient(135deg, #fff 0%, #a8a8a8 100%);
    --toggle-color: #6f6f6f;
    --toggle-hover: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: background 0.15s, color 0.15s;
  }

  /* Animated background radial gradients */
  .bg-glow {
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, var(--glow-1) 0%, rgba(0,0,0,0) 70%);
    top: -100px; left: -100px;
    z-index: 1;
    pointer-events: none;
    animation: pulse 12s infinite alternate;
  }
  .bg-glow-2 {
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, var(--glow-2) 0%, rgba(0,0,0,0) 70%);
    bottom: -100px; right: -100px;
    z-index: 1;
    pointer-events: none;
    animation: pulse 10s infinite alternate-reverse;
  }

  @keyframes pulse {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 30px) scale(1.15); }
  }

  /* Card Glassmorphism */
  .login-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 36px 32px;
    width: 100%; max-width: 360px;
    box-shadow: var(--card-shadow);
    z-index: 2;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.15s, border-color 0.15s;
  }

  .logo-area {
    text-align: center; margin-bottom: 24px;
  }
  .logo-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-strong); margin: 0;
    background: var(--logo-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo-subtitle {
    font-size: 11px; color: var(--toggle-color); margin-top: 4px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* Form controls */
  .form-group {
    margin-bottom: 18px; position: relative;
  }
  .form-label {
    display: block; font-size: 11px; font-weight: 500;
    color: var(--toggle-color); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .input-wrapper {
    position: relative; width: 100%;
  }
  .form-input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 12px;
    color: var(--text-strong);
    font-family: inherit; font-size: 13.5px;
    outline: none; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s, color 0.15s;
  }
  .form-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.15);
  }
  .password-toggle {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; color: var(--toggle-color);
    cursor: pointer; padding: 4px; display: flex; align-items: center;
    border-radius: 2px; transition: color 0.12s;
  }
  .password-toggle:hover { color: var(--text-strong); }

  /* Error box */
  .error-box {
    background: var(--error-bg);
    border: 1px solid rgba(255, 131, 137, 0.2);
    border-left: 3px solid var(--error);
    border-radius: 3px;
    padding: 8px 12px; margin-bottom: 18px;
    color: var(--error); font-size: 12px;
    display: none; align-items: center; gap: 8px;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* Sign in Button */
  .btn-submit {
    width: 100%;
    background: var(--accent); color: #ffffff;
    border: none; border-radius: 3px;
    padding: 11px; font-size: 13.5px; font-weight: 500;
    font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.12s, transform 0.1s;
  }
  .btn-submit:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-submit:active:not(:disabled) { transform: scale(0.985); }
  .btn-submit:disabled {
    background: var(--border); color: var(--toggle-color);
    cursor: not-allowed;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: #ffffff;
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Theme toggle button in top right */
  .theme-toggle {
    position: fixed; top: 16px; right: 16px;
    background: var(--card-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 3px;
    width: 36px; height: 36px;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    color: var(--text);
    transition: background 0.12s, color 0.12s;
    z-index: 10;
  }
  .theme-toggle:hover {
    background: var(--border);
    color: var(--text-strong);
  }
  .theme-toggle svg { display: block; }
</style>
</head>
<body>
<button class="theme-toggle" type="button" id="theme-toggle-btn" title="Ganti Tema">
  <span id="theme-toggle-icon"></span>
</button>
<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="login-card">
  <div class="logo-area">
    <h1 class="logo-title">Self Agent Orchestrator</h1>
    <div class="logo-subtitle">Access Panel</div>
  </div>

  <div class="error-box" id="error-box">
    <span>⚠</span> <span id="error-msg"></span>
  </div>

  <form id="login-form">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input class="form-input" type="text" id="username" name="username" autocomplete="username" required placeholder="Masukkan username" />
    </div>

    <div class="form-group">
      <label class="form-label" for="current-password">Password</label>
      <div class="input-wrapper">
        <input class="form-input" type="password" id="current-password" name="password" autocomplete="current-password" required placeholder="Masukkan password" style="padding-right: 36px;" />
        <button class="password-toggle" type="button" id="btn-toggle-pass" title="Tampilkan Password">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eye-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-submit" type="submit" id="btn-submit">
      <span id="btn-text">Sign In</span>
    </button>
  </form>
</div>

<script>
(() => {
  const form = document.getElementById('login-form');
  const userEl = document.getElementById('username');
  const passEl = document.getElementById('current-password');
  const btnTogglePass = document.getElementById('btn-toggle-pass');
  const eyeIcon = document.getElementById('eye-icon');
  const errBox = document.getElementById('error-box');
  const errMsg = document.getElementById('error-msg');
  const btnSubmit = document.getElementById('btn-submit');
  const btnText = document.getElementById('btn-text');

  // Toggle password visibility
  btnTogglePass.addEventListener('click', () => {
    const isPass = passEl.type === 'password';
    passEl.type = isPass ? 'text' : 'password';
    eyeIcon.innerHTML = isPass 
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    btnTogglePass.title = isPass ? 'Sembunyikan Password' : 'Tampilkan Password';
  });

  // Handle Form Submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    btnSubmit.disabled = true;
    btnText.innerHTML = '<span class="spinner"></span> Connecting...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: userEl.value.trim(),
          password: passEl.value
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Server error');

      // Success -> redirect to panel
      window.location.href = '/';
    } catch (err) {
      errMsg.textContent = err.message;
      errBox.style.display = 'flex';
      btnSubmit.disabled = false;
      btnText.textContent = 'Sign In';
    }
  });

  // Check auth state on page load
  fetch('/api/auth/check')
    .then(r => r.json())
    .then(d => {
      if (d.authenticated) window.location.href = '/';
    })
    .catch(() => {});

  // ---------- Theme Controller ----------
  const toggleBtn = document.getElementById('theme-toggle-btn');
  const toggleIcon = document.getElementById('theme-toggle-icon');
  
  const SUN_SVG = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  const MOON_SVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  
  function setTheme(theme) {
    const t = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('theme', t); } catch {}
    
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f8f8f8' : '#0a0a0a');

    if (toggleIcon) {
      toggleIcon.innerHTML = t === 'light' 
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + MOON_SVG + '</svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + SUN_SVG + '</svg>';
    }
  }
  
  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem('theme') || 'light'; } catch {}
  setTheme(savedTheme);
  
  toggleBtn.addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || 'light';
    setTheme(cur === 'light' ? 'dark' : 'light');
  });

  // ─── Obfuscated Copyright Footer & Anti-Tamper ────────────
  function protectLicense() {
    const b = "YnkgYW5kaWFiZHVyLg==";
    const currentYear = new Date().getFullYear();
    const txt = "Copyright © " + currentYear + " " + atob(b);
    
    const footer = document.createElement('div');
    footer.id = 'app-license-footer';
    footer.style.cssText = 'position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:var(--toggle-color);opacity:0.75;font-family:monospace;pointer-events:none;z-index:9999;user-select:none;-webkit-user-select:none;font-weight:500;';
    footer.textContent = txt;
    document.body.appendChild(footer);

    const lock = () => {
      document.documentElement.innerHTML = '<div style="background:#0a0a0a;color:#ff8389;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;text-align:center;padding:20px;z-index:100000;position:fixed;inset:0;"><h1 style="font-size:20px;letter-spacing:0.05em;margin:0;">LICENSE VIOLATION</h1><p style="font-size:12px;color:#a8a8a8;margin:0;">Copyright notice has been altered or deleted. Application locked.</p></div>';
      throw new Error("License tampered");
    };

    const checker = () => {
      const el = document.getElementById('app-license-footer');
      if (!el || el.textContent !== txt || !document.body.contains(el)) {
        lock();
        return;
      }
      const s = window.getComputedStyle(el);
      if (s.display === 'none' || s.visibility === 'hidden' || parseFloat(s.opacity) < 0.05 || parseInt(s.fontSize) < 5) {
        lock();
      }
    };

    const obs = new MutationObserver((mutations) => {
      for (const m of mutations) {
        if (m.type === 'childList' || m.type === 'attributes' || m.type === 'characterData') {
          checker();
        }
      }
    });

    obs.observe(footer, { attributes: true, childList: true, characterData: true, subtree: true });
    obs.observe(document.body, { childList: true });

    setInterval(checker, 1000);
  }

  // Load footer protection after DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', protectLicense);
  } else {
    protectLicense();
  }
})();
</script>
</body>
</html>
