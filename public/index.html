  // ---------- File viewer ----------
  const VIEWABLE_EXTS = new Set([
    '.md', '.txt', '.csv', '.json', '.yaml', '.yml', '.toml',
    '.sh', '.bash', '.zsh', '.env', '.ini', '.cfg', '.conf',
    '.js', '.ts', '.jsx', '.tsx', '.mjs', '.cjs',
    '.py', '.rb', '.go', '.rs', '.java', '.kt', '.scala',
    '.css', '.scss', '.less', '.html', '.xml', '.svg',
    '.tf', '.hcl', '.dockerfile', '.dbignore', '.gitignore',
    '.properties', '.plist', '.gradle', '.makefile', '.lock', '.log',
    '.sql', '.graphql', '.proto', '.pl', '.pm', '.lua',
    '.ps1', '.bat', '.cmd',
    '.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg',
  ]);
  const IMAGE_EXTS = new Set(['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg']);
  function isImageFile(fp) {
    const m = String(fp || '').match(/\.[^./\\]+$/);
    return m ? IMAGE_EXTS.has(m[0].toLowerCase()) : false;
  }
  function isViewableFile(fp) {
    const m = String(fp || '').match(/\.[^./\\]+$/);
    return m ? VIEWABLE_EXTS.has(m[0].toLowerCase()) : false;
  }
  function fileExt(fp) {
    const m = String(fp || '').match(/\.[^./\\]+$/);
    return m ? m[0].toLowerCase() : '';
  }

  let viewerRaw = false;
  let viewerFile = { path: '', content: '', ext: '' };
  const viewerEl = document.getElementById('viewer');
  const viewerBody = document.getElementById('viewer-body');
  const viewerFilename = document.getElementById('viewer-filename');
  const viewerRawBtn = document.getElementById('viewer-raw-btn');

  async function openFileViewer(filePath, cachedContent) {
    const ext = fileExt(filePath);
    // Images: render directly, no API call needed
    if (isImageFile(filePath)) {
      viewerFile = { path: filePath, content: '', ext };
      viewerRaw = false;
      viewerRawBtn.style.display = 'none';
      viewerFilename.textContent = filePath.split(/[/\\]/).pop();
      viewerFilename.title = filePath;
    } else {
      let content = cachedContent;
      if (content == null) {
        try {
          const res = await fetch('/api/file?path=' + encodeURIComponent(filePath));
          const data = await res.json();
          if (!res.ok) { renderError(data.error || 'Cannot open file'); return; }
          content = data.content;
        } catch (e) { renderError('Cannot read file: ' + e.message); return; }
      }
      viewerFile = { path: filePath, content, ext };
      viewerRaw = false;
      viewerRawBtn.textContent = 'Raw';
      viewerRawBtn.style.display = (ext === '.md' || ext === '.csv') ? '' : 'none';
    }
    viewerFilename.textContent = filePath.split(/[/\\]/).pop();
    viewerFilename.title = filePath;
    renderViewerBody();
    viewerEl.classList.add('open');
    document.getElementById('app').classList.add('viewer-open');
    const vw = (viewerEl.offsetWidth || parseInt(viewerEl.style.width) || 520);
    document.documentElement.style.setProperty('--viewer-w', vw + 'px');
  }

  function renderViewerBody() {
    const { content, ext, path: fp } = viewerFile;
    viewerBody.className = '';
    if (isImageFile(fp)) {
      viewerBody.className = 'img' + (ext === '.svg' ? ' svg' : '');
      const imgUrl = '/api/download?path=' + encodeURIComponent(fp) + '&inline=1';
      viewerBody.innerHTML = `<img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(fp.split(/[/\\]/).pop())}" />`;
      return;
    }
    if (viewerRaw || (ext !== '.md' && ext !== '.csv')) {
      viewerBody.className = 'raw';
      viewerBody.textContent = content;
      return;
    }
    if (ext === '.md') {
      viewerBody.className = 'md';
      const html = window.marked ? marked.parse(content || '') : escapeHtml(content);
      viewerBody.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
    } else if (ext === '.csv') {
      viewerBody.className = 'csv';
      viewerBody.innerHTML = renderCsvTable(content);
    }
  }

  function renderCsvTable(csv) {
    const lines = csv.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim());
    if (!lines.length) return '<p style="color:var(--muted);font-size:13px;">Empty file</p>';
    function parseRow(line) {
      const cells = []; let cur = ''; let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { cells.push(cur); cur = ''; }
        else cur += c;
      }
      cells.push(cur);
      return cells;
    }
    const rows = lines.map(parseRow);
    const header = rows[0];
    let html = '<div class="csv-wrap"><table><thead><tr>';
    for (const h of header) html += `<th>${escapeHtml(h)}</th>`;
    html += '</tr></thead><tbody>';
    for (const row of rows.slice(1)) {
      html += '<tr>';
      for (let i = 0; i < Math.max(row.length, header.length); i++) {
        html += `<td>${escapeHtml(row[i] ?? '')}</td>`;
      }
      html += '</tr>';
    }
    return html + '</tbody></table></div>';
  }

  function closeViewer() {
    viewerEl.classList.remove('open');
    document.getElementById('app').classList.remove('viewer-open');
    document.documentElement.style.removeProperty('--viewer-w');
  }
  document.getElementById('viewer-close').addEventListener('click', closeViewer);

  // ── Viewer pin toggle (default: pinned) ─────────────────
  let viewerPinned = true;
  const btnPin = document.getElementById('btn-pin');
  const PIN_ON_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>';
  const PIN_OFF_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v2.34M9.22 14.59l-1.78.9A2 2 0 0 0 5 18h8"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  btnPin.classList.add('pinned');
  btnPin.innerHTML = PIN_ON_SVG;
  btnPin.title = 'Unpin viewer';
  btnPin.addEventListener('click', () => {
    viewerPinned = !viewerPinned;
    btnPin.classList.toggle('pinned', viewerPinned);
    btnPin.innerHTML = viewerPinned ? PIN_ON_SVG : PIN_OFF_SVG;
    btnPin.title = viewerPinned ? 'Unpin viewer' : 'Pin viewer (auto-close on click outside)';
  });
  // Click outside to close (only when not pinned)
  document.addEventListener('click', (e) => {
    if (!viewerEl.classList.contains('open') || viewerPinned) return;
    if (e.target.closest('#viewer') || e.target.closest('.tool-view-btn') || e.target.closest('.file-link') || e.target.closest('#file-list')) return;
    closeViewer();
  });

  // ── Viewer resize (desktop only) ────────────────────────
  const resizeHandle = document.getElementById('viewer-resize');
  let savedWidth = null;
  try { savedWidth = localStorage.getItem('viewer-width'); } catch {}
  if (savedWidth) {
    const w = parseInt(savedWidth);
    if (w >= 260 && w <= 900) setViewerWidth(w);
  }

  function setViewerWidth(w) {
    viewerEl.style.width = w + 'px';
    viewerEl.style.setProperty('--vw', w + 'px');
    document.documentElement.style.setProperty('--viewer-w', w + 'px');
  }
  let resizing = false, resizeStartX = 0, resizeStartW = 0;
  resizeHandle.addEventListener('mousedown', (e) => {
    resizing = true; resizeStartX = e.clientX; resizeStartW = viewerEl.offsetWidth;
    resizeHandle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const dx = resizeStartX - e.clientX;
    const w = Math.min(900, Math.max(260, resizeStartW + dx));
    setViewerWidth(w);
  });
  document.addEventListener('mouseup', () => {
    if (!resizing) return;
    resizing = false;
    resizeHandle.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    try { localStorage.setItem('viewer-width', w + 'px'); } catch {}
  });
  // Touch support for resize
  resizeHandle.addEventListener('touchstart', (e) => {
    resizing = true; resizeStartX = e.touches[0].clientX; resizeStartW = viewerEl.offsetWidth;
    resizeHandle.classList.add('dragging');
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', (e) => {
    if (!resizing) return;
    const dx = resizeStartX - e.touches[0].clientX;
    const w = Math.min(900, Math.max(260, resizeStartW + dx));
    setViewerWidth(w);
  }, { passive: false });
  document.addEventListener('touchend', () => {
    if (!resizing) return;
    resizing = false;
    resizeHandle.classList.remove('dragging');
    try { localStorage.setItem('viewer-width', viewerEl.style.width); } catch {}
  });

  viewerRawBtn.addEventListener('click', () => {
    viewerRaw = !viewerRaw;
    viewerRawBtn.textContent = viewerRaw ? 'Rendered' : 'Raw';
    renderViewerBody();
  });

  // ---------- File browser ----------
  const ICON_FOLDER_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>';
  const ICON_FILE_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  const ICON_DL_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

  let fileListPath = state.cwd || '';
  const fileListEl = document.getElementById('file-list');
  const filePathText = document.getElementById('file-path-text');

  // Tab switching
  document.querySelectorAll('.sidebar-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sidebar-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.sidebar-view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      const view = document.getElementById(btn.dataset.tab + '-view');
      if (view) {
        view.classList.add('active');
        // Load files when switching to files tab
        if (btn.dataset.tab === 'file') {
          const path = fileListPath || els.cwdInput.value || state.cwd;
          if (path) {
            fileListPath = path;
            loadFileList(path);
          }
        }
      }
    });
  });

  function formatSize(bytes) {
    if (bytes === 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1048576).toFixed(1) + ' MB';
  }

  async function loadFileList(dirPath) {
    if (!dirPath) return;
    fileListPath = dirPath;
    filePathText.textContent = dirPath;
    fileListEl.innerHTML = '<div class="file-loading"><span class="spinner"></span>Loading files…</div>';
    try {
      const res = await fetch('/api/files?path=' + encodeURIComponent(dirPath));
      const data = await res.json();
      if (!res.ok) { fileListEl.innerHTML = '<div class="file-empty">Error: ' + escapeHtml(data.error || 'failed') + '</div>'; return; }
      renderFileEntries(data);
    } catch (err) {
      fileListEl.innerHTML = '<div class="file-empty">Error: ' + escapeHtml(err.message) + '</div>';
    }
  }

  function renderFileEntries(data) {
    fileListEl.innerHTML = '';
    // Parent directory
    if (data.parent) {
      const up = document.createElement('div');
      up.className = 'file-item';
      up.innerHTML = ICON_FOLDER_SVG + '<span class="fi-name" style="color:var(--muted)">..</span>';
      up.addEventListener('click', () => loadFileList(data.parent));
      fileListEl.appendChild(up);
    }
    for (const e of data.entries) {
      const item = document.createElement('div');
      if (e.type === 'dir') {
        item.className = 'file-item dir';
        item.innerHTML = '<span class="fi-icon">' + ICON_FOLDER_SVG + '</span><span class="fi-name">' + escapeHtml(e.name) + '</span>';
        item.addEventListener('click', () => {
          const next = data.path.endsWith('/') ? data.path + e.name : data.path + '/' + e.name;
          loadFileList(next);
        });
      } else {
        const fullPath = data.path + '/' + e.name;
        item.className = 'file-item';
        const isViewable = isViewableFile(e.name);
        const sizeStr = formatSize(e.size);
        item.innerHTML = '<span class="fi-icon">' + ICON_FILE_SVG + '</span><span class="fi-name">' + escapeHtml(e.name) + '</span><span class="fi-size">' + sizeStr + '</span><button class="fi-dl" title="Download">' + ICON_DL_SVG + '</button>';
        // Click file → view or download
        item.addEventListener('click', (ev) => {
          if (ev.target.closest('.fi-dl')) return;
          if (isViewable) {
            openFileViewer(fullPath, null);
          } else {
            downloadFile(fullPath);
          }
        });
        // Download button
        const dlBtn = item.querySelector('.fi-dl');
        dlBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          downloadFile(fullPath);
        });
      }
      fileListEl.appendChild(item);
    }
    if (!fileListEl.children.length) {
      fileListEl.innerHTML = '<div class="file-empty">(empty directory)</div>';
    }
  }

  function downloadFile(filePath) {
    const a = document.createElement('a');
    a.href = '/api/download?path=' + encodeURIComponent(filePath);
    a.target = '_blank';
    a.rel = 'noopener';
    a.click();
  }

  // Refresh file list when CWD changes
  function refreshFileList(newPath) {
    fileListPath = newPath || els.cwdInput.value || state.cwd || fileListPath;
    if (!fileListPath) return;
    const activeTab = document.querySelector('.sidebar-tab.active');
    if (activeTab && activeTab.dataset.tab === 'file') {
      loadFileList(fileListPath);
    }
  }

  // ---------- Node selector ----------
  function renderNodeList() {
    if (!els.nodeRow || !els.nodeList) return;
    if (!state.nodes || state.nodes.length <= 1) {
      els.nodeRow.style.display = 'none';
      return;
    }
    // Use explicit 'block' (not '') so we override the `#node-row { display: none }`
    // CSS rule. Setting style.display = '' would clear the inline and fall back to CSS.
    els.nodeRow.style.display = 'block';
    els.nodeList.innerHTML = '';
    for (const node of state.nodes) {
      const isActive = node.id === state.currentNodeId;
      const isConnecting = state.nodeConnecting && node.id === state.currentNodeId;
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'node-chip' + (isActive ? ' active' : '') + (isConnecting ? ' connecting' : '');
      if (isConnecting) {
        chip.innerHTML = '<span class="spinner" style="width:8px;height:8px;border-width:1.5px;border-top-color:#fff;border-color:rgba(255,255,255,.3);"></span>' + escapeHtml(node.name);
      } else {
        chip.innerHTML = '<span class="ndot"></span>' + escapeHtml(node.name);
      }
      if (!isActive && !isConnecting) {
        chip.addEventListener('click', () => {
          send({ type: 'set_node', nodeId: node.id });
          closeSidebar();
        });
      }
      els.nodeList.appendChild(chip);
    }
  }

  function updateNodeBadge() {
    if (!els.nodeBadge) return;
    if (!state.currentNodeId || state.currentNodeId === 'local') {
      els.nodeBadge.style.display = 'none';
    } else {
      els.nodeBadge.style.display = '';
      els.nodeBadge.textContent = state.currentNodeName;
    }
  }

  // ---------- Sessions ----------
  function loadSession(id, cwd, events, permissionMode, model, active, engine) {
    state.sessionId = id;
    setStoredSessionId(state.currentNodeId, id);
    state.cwd = cwd || state.cwd;
    if (permissionMode) state.permissionMode = permissionMode;
    if (model) state.model = model;
    if (engine) state.engine = engine;
    els.cwdInput.value = state.cwd;
    els.permSelect.value = state.permissionMode;
    els.modelSelect.value = state.model;
    if (els.engineSelect) els.engineSelect.value = state.engine;
    updatePermWarn();
    els.headerCwd.textContent = shortCwd(state.cwd);
    clearMessages();
    if (!events || !events.length) {
      const e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = id ? 'Belum ada pesan di session ini.' : 'Mulai chat baru — ketik pesan di bawah.';
      els.messages.appendChild(e);
    } else {
      // replay normalized events
      for (const evt of events) handle(evt);
      // After replay, linkify all text bubbles — tool_start events that register
      // writtenFiles may come AFTER the assistant_text that mentions them.
      linkifyAllTextBubbles();
    }
    // Historical events have turn_start without matching turn_end (server-only).
    // Default: assume idle. But if server says the session has an active run,
    // keep inTurn=true so the composer shows the Stop button + live events update the bubble.
    state.aborting = false;
    state.lastAssistantBubble = null;
    state.inTurn = !!active;
    updateSendButton();
    updateHeaderTitle();
    renderSessions();
    closeSidebar();
  }

  function renderSessions() {
    els.sessionList.innerHTML = '';

      const e = document.createElement('div');
      e.style.cssText = 'padding:20px;color:var(--muted);font-size:12px;text-align:center;';
      e.textContent = 'No sessions yet';
      els.sessionList.appendChild(e);
      return;
    }
    for (const s of state.sessions) {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.id === state.sessionId ? ' active' : '');
      const text = document.createElement('div');
      text.className = 'session-text';
      // Build "weight" badge: $cost + token-heaviness color hint
      const tk = s.tokensEstimate || 0;
      const heavy = tk > 100_000 ? 'heavy' : (tk > 50_000 ? 'medium' : '');
      const tkLabel = tk > 0 ? (tk >= 1000 ? `~${Math.round(tk/1000)}k` : `~${tk}`) + ' tokens' : '';
      const costLabel = (typeof s.totalCostUsd === 'number' && s.totalCostUsd > 0)
        ? '$' + s.totalCostUsd.toFixed(s.totalCostUsd < 0.1 ? 4 : 2)
        : '';
      const weight = [costLabel, tkLabel].filter(Boolean).join(' · ');
      text.innerHTML = `
        <div class="session-title-row">${escapeHtml(s.title || 'Untitled')}</div>
        <div class="session-meta">${timeAgo(s.last_used_at)} · ${shortCwd(s.cwd)}</div>
        ${weight ? `<div class="session-weight ${heavy}">${weight}</div>` : ''}
      `;
      text.addEventListener('click', () => {
        send({ type: 'load_session', sessionId: s.id });
      });
      const rename = document.createElement('button');
      rename.className = 'session-action rename';
      rename.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
      rename.setAttribute('aria-label', 'Rename');
      rename.title = 'Rename';
      rename.addEventListener('click', async (e) => {
        e.stopPropagation();
        const newTitle = prompt('New title:', s.title || '');
        if (!newTitle || newTitle.trim() === s.title) return;
        const res = await fetch('/api/sessions/' + s.id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle.trim() }),
        });
        if (res.ok) {
          const data = await res.json();
          state.sessions = data.sessions || state.sessions;
          renderSessions();
          updateHeaderTitle();
        }
      });
      const del = document.createElement('button');
      del.className = 'session-action delete';
      del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
      del.setAttribute('aria-label', 'Delete');
      del.title = 'Delete';
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('Delete this session?')) return;
        await fetch('/api/sessions/' + s.id, { method: 'DELETE' });
        state.sessions = state.sessions.filter(x => x.id !== s.id);
        if (state.sessionId === s.id) {
          state.sessionId = null;
          clearMessages();
          updateHeaderTitle();
        }
        renderSessions();
      });
      item.appendChild(text);
      item.appendChild(rename);
      item.appendChild(del);
      els.sessionList.appendChild(item);
    }

  // ---------- Image attachments ----------
  const MAX_IMAGES = 4;
  // Was 2048 — lowered to 1280 to cut ~60% of vision tokens per image.
  // Claude still reads small UI text reliably at this resolution.
  const MAX_FULL_DIM = 1280;
  const MAX_THUMB_DIM = 512;
  const pendingImages = [];

  function resizeToDataURL(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read failed'));
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => reject(new Error('decode failed'));
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else { width = Math.round(width * (maxDim / height)); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function addImageFile(file) {
    if (pendingImages.length >= MAX_IMAGES) return;
    if (!file.type.startsWith('image/')) return;
    try {
      const [fullData, thumbData] = await Promise.all([
        resizeToDataURL(file, MAX_FULL_DIM, 0.85),
        resizeToDataURL(file, MAX_THUMB_DIM, 0.70),
      ]);
      pendingImages.push({ name: file.name, mime: 'image/jpeg', fullData, thumbData });
      renderImagePreviews();
      updateSendButton();
    } catch (err) {
      console.error('image error:', err);
      alert('Gagal memproses gambar: ' + err.message);
    }
  }

  function renderImagePreviews() {
    if (!els.imagePreviews) return;
    els.imagePreviews.innerHTML = '';
    pendingImages.forEach((img, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'image-preview';
      const i = document.createElement('img');
      i.src = img.thumbData;
      i.alt = img.name;
      const rm = document.createElement('button');
      rm.className = 'remove';
      rm.type = 'button';
      rm.textContent = '×';
      rm.title = 'Remove';
      rm.addEventListener('click', () => {
        pendingImages.splice(idx, 1);
        renderImagePreviews();
        updateSendButton();
      });
      wrap.appendChild(i);
      wrap.appendChild(rm);
      els.imagePreviews.appendChild(wrap);
    });
  }

    if (state.inTurn) {

      setTimeout(() => {
        if (state.aborting) {
          state.aborting = false;
          state.inTurn = false;
          updateSendButton();
        }
      }, 5000);
      return;
    }
    const text = els.input.value;
    if (!text.trim() && pendingImages.length === 0) return;
    const payload = { type: 'prompt', text };
    if (pendingImages.length > 0) {
      payload.images = pendingImages.map(img => ({
        name: img.name,
        mime: img.mime,
        fullData: img.fullData,
        thumbData: img.thumbData,
      }));
    }
    send(payload);
    els.input.value = '';
    pendingImages.length = 0;
    renderImagePreviews();
    autoGrow();
    updateSendButton();
  }

  const ICON_CHEVRON = '<svg class="picker-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

  async function pickerLoad(p) {
    picker.list.innerHTML = '<div class="picker-empty">Loading…</div>';
    try {
      const res = await fetch('/api/dirs?path=' + encodeURIComponent(p || ''));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');
      picker.currentPath = data.path;
      picker.path.textContent = data.path;
      picker.list.innerHTML = '';
      if (data.parent) {
        const up = document.createElement('div');
        up.className = 'picker-item up';
        up.innerHTML = ICON_UP + '<span class="picker-label">Parent directory</span>';
        up.addEventListener('click', () => pickerLoad(data.parent));
        picker.list.appendChild(up);
      }
      if (!data.entries.length) {
        const e = document.createElement('div');
        e.className = 'picker-empty';
        e.textContent = '(no subfolders)';
        picker.list.appendChild(e);
      }
      for (const name of data.entries) {
        const it = document.createElement('div');
        it.className = 'picker-item';
        const label = document.createElement('span');
        label.className = 'picker-label';
        label.textContent = name;
        it.innerHTML = ICON_FOLDER;
        it.appendChild(label);
        it.insertAdjacentHTML('beforeend', ICON_CHEVRON);
        it.addEventListener('click', () => {
          const next = data.path.endsWith('/') ? data.path + name : data.path + '/' + name;
          pickerLoad(next);
        });
        picker.list.appendChild(it);
      }
    } catch (err) {
      picker.list.innerHTML = '<div class="picker-empty" style="color:var(--error);">' + escapeHtml(err.message) + '</div>';
    }
  }

    footer.textContent = txt;
    
    const container = document.getElementById('sidebar-footer-row') || document.body;
    container.appendChild(footer);

    const lock = () => {
      document.documentElement.innerHTML = '<div style="background:#0a0a0a;color:#ff8389;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;text-align:center;padding:20px;z-index:100000;position:fixed;inset:0;"><h1 style="font-size:20px;letter-spacing:0.05em;margin:0;">LICENSE VIOLATION</h1><p style="font-size:12px;color:#a8a8a8;margin:0;">Copyright notice has been altered or deleted. Application locked.</p></div>';
      throw new Error("License tampered");
    };

    const checker = () => {
      const el = document.getElementById('app-license-footer');
      if (!el || el.textContent !== txt || !container.contains(el)) {
        lock();
        return;
      }
      const s = window.getComputedStyle(el);
      if (s.display === 'none' || s.visibility === 'hidden' || parseFloat(s.opacity) < 0.05 || parseInt(s.fontSize) < 5) {
        lock();
      }
    };

    const obs = new MutationObserver((mutations) => {
      for (const m of mutations) {
        if (m.type === 'childList' || m.type === 'attributes' || m.type === 'characterData') {
          checker();
        }
      }
    });

    obs.observe(footer, { attributes: true, childList: true, characterData: true, subtree: true });
    obs.observe(container, { childList: true });

    setInterval(checker, 1000);
  }

  // ---------- Start ----------
  checkAuth();
  protectLicense();
  connect();
})();
</script>
