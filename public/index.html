            <span class="settings-row-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/><circle cx="18" cy="6" r="3"/></svg>
            </span>
            <span class="settings-row-label">Model</span>
          </span>
          <select id="model-select" class="settings-select">
            <option value="opus">Claude Opus 4.8</option>
            <option value="sonnet">Claude Sonnet 4.6</option>
            <option value="haiku">Claude Haiku 4.5</option>
          </select>
        </div>
        <div class="settings-row col">
          <span class="settings-row-head">
            <span class="settings-row-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
            <span class="settings-row-label">Permission</span>
          </span>
          <select id="perm-select" class="settings-select">
            <option value="bypassPermissions">Bypass all</option>
            <option value="acceptEdits">Accept edits</option>
            <option value="plan">Plan only</option>
          </select>
        </div>
        <div id="perm-warn" style="display:none"></div>
        <div id="perm-warn-card"></div>
      </div>
    </div>

    <!-- Session -->
    <div class="settings-section">
      <div class="settings-section-title">Session</div>
      <div class="settings-card">
        <button id="btn-compact" class="settings-action-btn" type="button" title="Summarize history to reclaim context (/compact)">
          <span class="settings-row-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </span>
          Compact history
        </button>
      </div>
    </div>

    <!-- Account -->
    <div class="settings-section">
      <div class="settings-section-title">Account</div>
      <div class="settings-card">
        <button id="btn-logout" class="settings-action-btn danger" type="button">
          <span class="settings-row-icon" style="color:inherit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </span>
          Logout
        </button>
      </div>
    </div>
  </div>
  <div id="sidebar-footer-row" style="margin-top:auto;padding:8px 12px 4px;flex-shrink:0;"></div>
</aside>

<aside id="git-panel" aria-hidden="true">
  <div id="git-resize" title="Drag to resize"></div>
  <div class="git-panel-header">
    <div class="git-panel-row-top">
      <div class="git-panel-title" id="git-panel-title">Review</div>
      <div class="git-panel-header-actions">
        <button id="btn-git-card" class="git-panel-btn" type="button" title="Insert changed files card in chat">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
        </button>
        <button id="btn-git-refresh" class="git-panel-btn" type="button" title="Refresh">

<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
(() => {
  if (window.marked) {
    marked.setOptions({ breaks: true, gfm: true });
  }
  function renderMarkdown(text) {
    if (!window.marked) return escapeHtml(text);
    const html = marked.parse(text || '');
    if (window.DOMPurify) return DOMPurify.sanitize(html);
    return html;
  }
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  const els = {
    messages: $('#messages'),
    input: $('#input'),
    btnSend: $('#btn-send'),
    btnAttach: $('#btn-attach'),
    fileInput: $('#file-input'),
    imagePreviews: $('#image-previews'),
    lightbox: $('#lightbox'),
    lightboxImg: $('#lightbox img'),
    btnMenu: $('#btn-menu'),
    btnNew: $('#btn-new'),
    btnCompact: $('#btn-compact'),
    btnCloseSidebar: $('#btn-close-sidebar'),
    sidebar: $('#sidebar'),
    sidebarBg: $('#sidebar-bg'),
    btnGit: $('#btn-git'),
    gitPanel: $('#git-panel'),
    gitResize: $('#git-resize'),
    gitPanelTitle: $('#git-panel-title'),
    gitModeSelect: $('#git-mode-select'),
    btnGitExpand: $('#btn-git-expand'),
    btnCloseGit: $('#btn-close-git'),
    btnGitRefresh: $('#btn-git-refresh'),
    btnGitCard: $('#btn-git-card'),
    gitBranchRow: $('#git-branch-row'),
    gitBranchName: $('#git-branch-name'),
    gitBranchCwd: $('#git-branch-cwd'),
    gitBody: $('#git-body'),
    gitCommitArea: $('#git-commit-area'),
    gitCommitInput: $('#git-commit-input'),
    btnGitCommit: $('#btn-git-commit'),
    btnGitPush: $('#btn-git-push'),
    gitCommitStatus: $('#git-commit-status'),
    sessionList: $('#session-list'),
    cwdInput: $('#cwd-input'),
    modelSelect: $('#model-select'),
    themeToggle: $('#theme-toggle'),
    themeIcon: $('#theme-icon'),
    permSelect: $('#perm-select'),
    permWarn: $('#perm-warn'),
    engineSelect: $('#engine-select'),
    headerTitle: $('#header-title'),
    headerCwd: $('#header-cwd'),
    connDot: $('#conn-dot'),
    btnLogout: $('#btn-logout'),
    nodeBadge: $('#node-badge'),
    nodeRow: $('#node-row'),
    nodeList: $('#node-list'),
    sessionSearch: $('#session-search'),
    btnSearchMode: $('#btn-search-mode'),
    engineBadge: $('#engine-badge'),
    enginePopover: $('#engine-popover'),
    popoverModelSection: $('#popover-model-section'),
    settingsCwdDisplay: $('#settings-cwd-display'),
    btnCwdPick: $('#btn-cwd-pick'),
    viewerCopyBtn: $('#viewer-copy-btn'),
    viewerHtmlBtn: $('#viewer-html-btn'),
    viewerEditBtn: $('#viewer-edit-btn'),
    viewerSaveBtn: $('#viewer-save-btn'),
    viewerCancelBtn: $('#viewer-cancel-btn'),
    viewerEditor: $('#viewer-editor'),
    viewerIframe: $('#viewer-iframe'),
    btnShowHidden: $('#btn-show-hidden'),
  };

  const state = {
    sessionId: null,
    sessions: [],
    sessionSearch: '',
    contentSearchMode: false,
    contentSearchResults: null,
    contentSearchLoading: false,
    cwd: '',
    git: { open: false, loading: false, cwd: '', branch: '', files: [], isRepo: false, error: '', expanded: new Set(), mode: 'git' },
    permissionMode: 'bypassPermissions',
    model: 'sonnet',
    engine: 'claude',
    claudeModels: [
      { id: 'opus',   label: 'Claude Opus 4.8' },
      { id: 'sonnet', label: 'Claude Sonnet 4.6' },
      { id: 'haiku',  label: 'Claude Haiku 4.5' },
    ],
    inTurn: false,
    aborting: false,
    toolsById: new Map(),
    toolContentCache: new Map(),
    writtenFiles: new Map(),
    lastAssistantBubble: null,
    streamingTextEl: null,
    streamingTextBuf: '',
    ws: null,
    nodes: [],
    currentNodeId: 'local',
    currentNodeName: 'This machine',
    nodeConnecting: false,
    activeSessions: new Set(),
    showHiddenFiles: true,
  };

  const PERM_WARNINGS = {
    bypassPermissions: '⚠ Auto-jalanin SEMUA tool tanpa approval. Hanya pakai di project trusted.',
    acceptEdits: 'Edit/Write auto-approved. Bash perlu approval — bakal error di mode ini headless.',
    plan: 'Read-only mode. Agen bisa explore tapi gak bisa modif file / jalanin command.',
  };
  function updatePermWarn() {
    const msg = PERM_WARNINGS[state.permissionMode] || '';
    const cardEl = document.getElementById('perm-warn-card');
    if (cardEl) { cardEl.textContent = msg; cardEl.classList.toggle('visible', !!msg); }
  }
  function updateSettingsCwd(cwd) {
    if (els.settingsCwdDisplay) els.settingsCwdDisplay.textContent = shortCwd(cwd) || '—';
    els.headerCwd.textContent = shortCwd(cwd);
  }

  // ---------- WS ----------
  let reconnectTimer = null;
  let replayingHistory = false;  // true while replaying stored session events
  function scheduleReconnect(ms) {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, ms);
  }
  // ── Per-node storage helpers ─────────────────────────────
  // Each node has its own session list; sessionId is meaningless across nodes.
  function storedSessionId(nodeId) {
    try { return localStorage.getItem('sessionId:' + (nodeId || 'local')); } catch { return null; }
  }
  function setStoredSessionId(nodeId, sid) {
    const key = 'sessionId:' + (nodeId || 'local');
    try {
      if (sid) localStorage.setItem(key, sid);
      else localStorage.removeItem(key);
    } catch {}
  }
  function storedTempSessionId(nodeId) {
    try { return localStorage.getItem('tempSessionId:' + (nodeId || 'local')); } catch { return null; }
  }
  function setStoredTempSessionId(nodeId, sid) {
    const key = 'tempSessionId:' + (nodeId || 'local');
    try {
      if (sid) localStorage.setItem(key, sid);
      else localStorage.removeItem(key);
    } catch {}
  }
  function storedNodeId() {
    try { return localStorage.getItem('currentNodeId') || 'local'; } catch { return 'local'; }
  }
  function setStoredNodeId(nodeId) {
    try {
      if (nodeId && nodeId !== 'local') localStorage.setItem('currentNodeId', nodeId);
      else localStorage.removeItem('currentNodeId');
    } catch {}
  }

  // Set true while we're awaiting a remote node to connect, so the local hello
  // handler doesn't auto-load a session for 'local' before we switch over.
  let pendingNodeSwitch = null;

  function connect() {
    if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws');
    state.ws = ws;
    ws.onopen = () => {
      els.connDot.className = 'connected';
      updateSendButton();
      // If user was last on a remote node, ask the server to proxy us there.
      // The hello handler will auto-load the session for whichever node we land on.
      const lastNode = storedNodeId();
      if (lastNode && lastNode !== 'local') {
        pendingNodeSwitch = lastNode;
        send({ type: 'set_node', nodeId: lastNode });
      }
      // else: server already sent hello on connect; hello handler will auto-load.
    };
    ws.onclose = () => {
      els.connDot.className = 'disconnected';
      els.btnSend.disabled = true;
      scheduleReconnect(1500);
    };
    ws.onerror = () => { els.connDot.className = 'disconnected'; };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      handle(m);
    };
  }

  // Page Visibility — re-check WS when tab becomes visible (after phone unlock)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (!state.ws || state.ws.readyState === WebSocket.CLOSED || state.ws.readyState === WebSocket.CLOSING) {
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        connect();
      }
    }
  });

  function send(obj) {
    if (state.ws && state.ws.readyState === WebSocket.OPEN) {
      state.ws.send(JSON.stringify(obj));
    }
  }

  // ---------- Event handler ----------
  function handle(m) {
    switch (m.kind) {
      case 'hello':
        state.cwd = m.defaultCwd;
        state.permissionMode = m.defaultPerm || 'bypassPermissions';
        state.model = m.defaultModel || 'sonnet';
        state.engine = m.defaultEngine || 'claude';
        if (Array.isArray(m.claudeModels) && m.claudeModels.length) state.claudeModels = m.claudeModels;
        state.sessions = m.sessions || [];
        els.cwdInput.value = state.cwd;
        els.permSelect.value = state.permissionMode;
        if (state.engine === 'codex') els.modelSelect.innerHTML = codexModelOptionsHtml(state.model || 'gpt-5-codex');
        else if (state.engine === 'kilo') els.modelSelect.innerHTML = kiloModelOptionsHtml(state.model || 'kilo/kilo-auto/free');
        else if (state.engine === 'qwen') els.modelSelect.innerHTML = '<option value="default">Default Model (use config)</option><option value="qwen2.5-coder:32b">Qwen 2.5 Coder 32B</option><option value="qwen2.5-coder:14b">Qwen 2.5 Coder 14B</option><option value="qwen2.5-coder:7b">Qwen 2.5 Coder 7B</option><option value="qwen2.5-coder:1.5b">Qwen 2.5 Coder 1.5B</option>';
        else els.modelSelect.innerHTML = claudeModelOptionsHtml(state.model);
        els.modelSelect.value = state.model;
        if (els.engineSelect) els.engineSelect.value = state.engine;
        updateSettingsCwd(state.cwd);
        updatePermWarn();
        renderSessions();
        if (m.nodes) {
          state.nodes = m.nodes;
          state.currentNodeId = m.nodeId || 'local';
          state.currentNodeName = (m.nodes.find(n => n.id === (m.nodeId || 'local')) || {}).name || 'This machine';
          state.nodeConnecting = false;
          // Remove the "Connecting to X…" indicator if present.
          const ncm = document.getElementById('node-connecting-msg');
          if (ncm) ncm.remove();
        }
        renderNodeList();
        updateNodeBadge();
        updateEngineBadge(state.engine, state.model);
        // Auto-load the last-used session for whichever node we just landed on,
        // UNLESS we're still in the middle of switching to a remote node
        // (in which case the local hello is just a transient — we'll get the
        // remote's hello next and load there).
        if (!pendingNodeSwitch || pendingNodeSwitch === state.currentNodeId) {
          pendingNodeSwitch = null;
          const sid = storedSessionId(state.currentNodeId);
          const tempSid = storedTempSessionId(state.currentNodeId);
          if (sid) {
            send({ type: 'load_session', sessionId: sid });
          } else if (tempSid) {
            send({ type: 'load_session', sessionId: tempSid });
          } else {
            // No saved session for this node — show clean empty state.
            state.sessionId = null;
            clearMessages();
            const e = document.createElement('div');
            e.className = 'empty-state';
            e.textContent = 'Mulai chat baru — ketik pesan di bawah.';
            els.messages.appendChild(e);
            updateHeaderTitle();
          }
        }
        refreshFileList(state.cwd);
        refreshGit(state.cwd);
        break;
      case 'node_connecting':
        state.currentNodeId = m.nodeId;
        state.currentNodeName = m.name;
        state.nodeConnecting = true;
        renderNodeList();
        clearMessages();
        { const ce = document.createElement('div'); ce.className = 'empty-state'; ce.id = 'node-connecting-msg'; ce.innerHTML = '<div style="display:flex;align-items:center;gap:8px;justify-content:center;"><span class="spinner"></span>Connecting to ' + escapeHtml(m.name) + '…</div>'; els.messages.appendChild(ce); }
        break;
      case 'node_set':
        state.currentNodeId = m.nodeId;
        state.currentNodeName = m.name;
        state.nodeConnecting = false;
        setStoredNodeId(m.nodeId);
        renderNodeList();
        updateNodeBadge();
        break;
      case 'session_loaded':
        if (m.sessionId && m.sessionId.startsWith('temp_')) {
          // If it loaded a temp session, make sure state is updated but don't overwrite the stored real session ID yet.
          state.sessionId = m.sessionId;
          updateGitHeaderTitle();
        } else if (m.sessionId) {
          // If a real session loaded, clear any stored tempSessionId
          setStoredTempSessionId(state.currentNodeId, null);
        }
        loadSession(m.sessionId, m.cwd, m.events, m.permissionMode, m.model, m.active, m.engine);
        refreshFileList(m.cwd);
        refreshGit(m.cwd);
        break;
      case 'session_persisted':
        state.sessionId = m.sessionId;
        updateGitHeaderTitle();
        setStoredSessionId(state.currentNodeId, m.sessionId);
        setStoredTempSessionId(state.currentNodeId, null); // Clear temp ID once persisted
        state.sessions = m.sessions || state.sessions;
        renderSessions();
        updateHeaderTitle();
        break;
      case 'session_cleared':
        clearMessages();
        state.sessionId = null;
        updateGitHeaderTitle();
        setStoredSessionId(state.currentNodeId, null);
        setStoredTempSessionId(state.currentNodeId, null); // Clear temp ID
        state.inTurn = false;
        state.aborting = false;
        state.lastAssistantBubble = null;
        updateSendButton();
        updateHeaderTitle();
        renderSessions();
        renderInfoBubble(m.message);
        break;
      case 'cwd_set':
        state.cwd = m.cwd; els.cwdInput.value = m.cwd;
        updateSettingsCwd(m.cwd);
        refreshFileList(m.cwd);
        refreshGit(m.cwd);
        break;
      case 'permission_set':
        state.permissionMode = m.permissionMode;
        els.permSelect.value = m.permissionMode;
        updatePermWarn();
        break;
      case 'model_set':
        state.model = m.model;
        els.modelSelect.value = m.model;
        updateEngineBadge(state.engine, m.model);
        break;

      case 'engine_set':
        state.engine = m.engine;
        els.engineSelect.value = m.engine;
        if (m.engine === 'claude') {
          els.modelSelect.innerHTML = claudeModelOptionsHtml(state.model || 'sonnet');
          if (state.model && els.modelSelect.querySelector(`option[value="${CSS.escape(state.model)}"]`)) {
            els.modelSelect.value = state.model;
          } else {
            els.modelSelect.value = 'sonnet';
          }
          state.model = els.modelSelect.value;
          send({ type: 'set_model', model: state.model });
        } else if (m.engine === 'codex') {
          els.modelSelect.innerHTML = codexModelOptionsHtml(state.model || 'gpt-5-codex');
          if (state.model && els.modelSelect.querySelector(`option[value="${CSS.escape(state.model)}"]`)) {
            els.modelSelect.value = state.model;
          } else {
            els.modelSelect.value = 'gpt-5-codex';
          }
          state.model = els.modelSelect.value;
          send({ type: 'set_model', model: state.model });
        } else if (m.engine === 'kilo') {
          els.modelSelect.innerHTML = kiloModelOptionsHtml(state.model || 'kilo/kilo-auto/free');
          if (state.model && els.modelSelect.querySelector(`option[value="${CSS.escape(state.model)}"]`)) {
            els.modelSelect.value = state.model;
          } else {
            els.modelSelect.value = 'kilo/kilo-auto/free';
          }
          state.model = els.modelSelect.value;
          send({ type: 'set_model', model: state.model });
        } else if (m.engine === 'qwen') {
          els.modelSelect.innerHTML = '<option value="default">Default Model (use config)</option><option value="qwen2.5-coder:32b">Qwen 2.5 Coder 32B</option><option value="qwen2.5-coder:14b">Qwen 2.5 Coder 14B</option><option value="qwen2.5-coder:7b">Qwen 2.5 Coder 7B</option><option value="qwen2.5-coder:1.5b">Qwen 2.5 Coder 1.5B</option>';
          if (state.model && els.modelSelect.querySelector(`option[value="${CSS.escape(state.model)}"]`)) {
            els.modelSelect.value = state.model;
          } else {
            els.modelSelect.value = 'default';
          }
          state.model = els.modelSelect.value;
          send({ type: 'set_model', model: state.model });
        }
        updateEngineBadge(m.engine, state.model);
        break;

      case 'user_message':
        hideAndCancelThinking();
        finalizeStreamingText();
        renderUserMessage(m.text, m.images);
        // Show indicator INSTANTLY for live messages (initial wait is the
        // most painful to leave unindicated). Skip during session replay.
        if (state.inTurn || (m.timestamp && Date.now() - m.timestamp < 5000)) {
          showThinkingIndicator();
        }
        break;
      case 'turn_start':
        state.inTurn = true; updateSendButton();
        if (state.sessionId) { state.activeSessions.add(state.sessionId); renderSessions(); }
        ensureAssistantBubble();
        break;
      case 'assistant_text':
        hideAndCancelThinking();
        finalizeStreamingText();      // flush any pending delta buffer before full-block render
        renderAssistantText(m.text);
        scheduleThinkingIndicator();  // claude may pause then continue (next tool / text)
        break;
      case 'assistant_delta':
        hideAndCancelThinking();
        appendStreamingDelta(m.text);
        break;
      case 'tool_start':
        hideAndCancelThinking();      // tool card has its own spinner — no overlap
        renderToolStart(m);
        break;
      case 'tool_result':
        hideAndCancelThinking();
        renderToolResult(m);
        scheduleThinkingIndicator();  // claude reads result, decides next step
        break;
      case 'thinking':
        hideAndCancelThinking();
        renderThinking(m.text);
        scheduleThinkingIndicator();
        break;
      case 'turn_complete':
        hideAndCancelThinking();
        finalizeStreamingText();
        renderTurnSummary(m);
        if (!replayingHistory) renderChangedFilesCard('last-turn');
        break;
      case 'aborting':
        hideAndCancelThinking();
        state.aborting = true;
        updateSendButton();
        break;
      case 'turn_end':
        hideAndCancelThinking();
        state.inTurn = false;
        state.aborting = false;
        state.lastAssistantBubble = null;
        if (state.sessionId) { state.activeSessions.delete(state.sessionId); renderSessions(); }
        updateSendButton();
        break;
      case 'error':
        hideAndCancelThinking();
        renderError(m.message);
        break;
    }
    scrollToBottom();
  }

  // ---------- Renderers ----------
  function clearMessages() {
    els.messages.innerHTML = '';
    state.toolsById.clear();
    state.toolContentCache.clear();
    state.writtenFiles.clear();
    state.lastAssistantBubble = null;
    hideAndCancelThinking();
  }

  // Thinking indicator: shown when claude is processing with no visible output.
  // - Instant after user_message (initial wait)
  // - Delayed (400ms) after assistant_text / tool_result / thinking so quick
  //   gaps between events don't cause flicker, but real pauses are visible.
  // Tool execution itself is NOT covered here — the tool card has its own spinner.
  const THINKING_DELAY_MS = 400;
  let thinkingTimer = null;

  function showThinkingIndicator() {
    cancelThinkingTimer();
    hideThinkingIndicator();
    const el = document.createElement('div');
    el.className = 'thinking-indicator';
    el.id = 'thinking-indicator';
    el.innerHTML =
      '<span class="thinking-dots"><span></span><span></span><span></span></span>' +
      '<span class="thinking-label">Claude lagi mikir…</span>';
    els.messages.appendChild(el);
    scrollToBottom();
  }
  function hideThinkingIndicator() {
    const el = document.getElementById('thinking-indicator');
    if (el) el.remove();
  }
  function scheduleThinkingIndicator() {
    cancelThinkingTimer();
    if (!state.inTurn) return;
    thinkingTimer = setTimeout(() => {
      thinkingTimer = null;
      if (state.inTurn) showThinkingIndicator();
    }, THINKING_DELAY_MS);
  }
  function cancelThinkingTimer() {
    if (thinkingTimer) { clearTimeout(thinkingTimer); thinkingTimer = null; }
  }
  function hideAndCancelThinking() {
    cancelThinkingTimer();
    hideThinkingIndicator();
  }

  function renderUserMessage(text, images) {
    removeEmptyState();
    const el = document.createElement('div');
    el.className = 'msg-user';
    if (images && images.length) {
      const wrap = document.createElement('div');
      wrap.className = 'msg-user-images';
      for (const img of images) {
        const i = document.createElement('img');
        // Prefer embedded thumb (multi-node safe); fall back to /api/uploads endpoint
        i.src = img.thumbData || ('/api/uploads/' + encodeURIComponent(img.filename || ''));
        i.alt = img.name || '';
        i.loading = 'lazy';
        i.addEventListener('click', () => {
          // Full-res: try /api/uploads first (works locally), fall back to thumb
          const full = img.filename ? '/api/uploads/' + encodeURIComponent(img.filename) : i.src;
          openLightbox(full);
        });
        wrap.appendChild(i);
      }
      el.appendChild(wrap);
    }
    if (text && text.trim()) {
      const t = document.createElement('div');
      t.className = 'msg-user-text';
      t.textContent = text;
      el.appendChild(t);
    }
    els.messages.appendChild(el);
    state.lastAssistantBubble = null;
  }

  function ensureAssistantBubble() {
    if (state.lastAssistantBubble) return state.lastAssistantBubble;
    const el = document.createElement('div');
    el.className = 'msg-assistant';
    els.messages.appendChild(el);
    state.lastAssistantBubble = el;
    return el;
  }

  function renderAssistantText(text) {
    if (!text || !text.trim()) return;
    const bubble = ensureAssistantBubble();
    const el = document.createElement('div');
    el.className = 'msg-text';
    el.innerHTML = renderMarkdown(text);
    linkifyFileRefs(el);
    bubble.appendChild(el);
  }

  function appendStreamingDelta(text) {
    if (!text) return;
    const bubble = ensureAssistantBubble();
    if (!state.streamingTextEl) {
      state.streamingTextEl = document.createElement('div');
      state.streamingTextEl.className = 'msg-text';
      bubble.appendChild(state.streamingTextEl);
    }
    state.streamingTextBuf += text;
    state.streamingTextEl.innerHTML = renderMarkdown(state.streamingTextBuf);
    // Auto-scroll while streaming
    els.messages.scrollTop = els.messages.scrollHeight;
  }

  function finalizeStreamingText() {
    if (state.streamingTextEl) {
      linkifyFileRefs(state.streamingTextEl);
    }
    state.streamingTextEl = null;
    state.streamingTextBuf = '';
  }

  function linkifyFileRefs(container) {
    const codes = container.querySelectorAll('code');
    for (const code of codes) {
      const raw = code.textContent.trim();
      if (!raw || raw.includes('\n')) continue;
      const base = raw.split(/[/\\]/).pop();
      if (!base || !isViewableFile(base)) continue;
      const fullPath = state.writtenFiles.get(base) || state.writtenFiles.get(raw);
      if (!fullPath) continue;
      code.classList.add('file-link');
      code.title = fullPath;
      code.addEventListener('click', (e) => {
        e.stopPropagation();
        openFileViewer(fullPath, null);
      });
    }
  }

  function linkifyAllTextBubbles() {
    const texts = els.messages.querySelectorAll('.msg-text');
    for (const t of texts) linkifyFileRefs(t);
  }

  function renderThinking(text) {
    if (!text || !text.trim()) return;
    const bubble = ensureAssistantBubble();
    const el = document.createElement('div');
    el.className = 'msg-thinking';
    el.innerHTML = '<span class="thinking-icon">' + ICON_SPARKLE + '</span><span class="thinking-text"></span>';

  function toolIcon(name) {
    return TOOL_ICONS[name] || ICON_TOOL_DEFAULT;
  }

  function toolSummary(name, input) {
    if (!input) return '';
    if (name === 'Bash') return input.command || '';
    if (name === 'Read') return input.file_path || '';
    if (name === 'Edit') return input.file_path || '';
    if (name === 'Write') return input.file_path || '';
    if (name === 'Glob') return input.pattern || '';
    if (name === 'Grep') return input.pattern || '';
    if (name === 'WebFetch') return input.url || '';
    if (name === 'WebSearch') return input.query || '';
    if (typeof input === 'object') {
      const k = Object.keys(input)[0];
      const v = input[k];
      return typeof v === 'string' ? v.slice(0, 100) : JSON.stringify(input).slice(0, 100);
    }
    return String(input).slice(0, 100);
  }

  function renderToolStart(m) {
    const bubble = ensureAssistantBubble();
    const el = document.createElement('div');
    el.className = 'tool';
    el.dataset.toolId = m.id;
    const summary = toolSummary(m.name, m.input);
    el.innerHTML = `
      <div class="tool-header">
        <span class="tool-chevron">▶</span>
        <span class="tool-icon">${toolIcon(m.name)}</span>
        <span class="tool-name">${escapeHtml(m.name)}</span>
        <span class="tool-summary"></span>
        <span class="tool-status running"><span class="spinner"></span></span>
      </div>
      <div class="tool-body"></div>
    `;
    el.querySelector('.tool-summary').textContent = summary;
    el.querySelector('.tool-header').addEventListener('click', () => el.classList.toggle('expanded'));

    const body = el.querySelector('.tool-body');
    body.appendChild(renderToolInput(m.name, m.input));

    bubble.appendChild(el);
    state.toolsById.set(m.id, el);
    // Store file path for View button; cache Write content so viewer works instantly
    const fp = m.input?.file_path || '';
    if (fp) el.dataset.toolFile = fp;
    if (m.name === 'Write' && fp && isViewableFile(fp) && m.input?.content != null) {
      state.toolContentCache.set(m.id, m.input.content);
    }
    // Register written/edited files so assistant text can link to them
    if ((m.name === 'Write' || m.name === 'Edit') && fp) {
      const base = fp.split(/[/\\]/).pop();
      if (base) state.writtenFiles.set(base, fp);
    }
  }

  function renderToolInput(name, input) {
    const wrap = document.createElement('div');
    wrap.className = 'tool-section';

    if (name === 'Edit' && input && input.old_string != null && input.new_string != null) {
      const label = document.createElement('div');
      label.className = 'tool-section-label';
      label.textContent = 'Edit · ' + (input.file_path || '');
      wrap.appendChild(label);
      const pre = document.createElement('pre');
      pre.className = 'wrap';
      const oldLines = String(input.old_string).split('\n').map(l => `<span class="diff-del">- ${escapeHtml(l)}</span>`).join('\n');
      const newLines = String(input.new_string).split('\n').map(l => `<span class="diff-add">+ ${escapeHtml(l)}</span>`).join('\n');
      pre.innerHTML = oldLines + '\n' + newLines;
      wrap.appendChild(pre);
      return wrap;
    }

    if (name === 'Write' && input && input.content != null) {
      const label = document.createElement('div');
      label.className = 'tool-section-label';
      label.textContent = 'Write · ' + (input.file_path || '');
      wrap.appendChild(label);
      const pre = document.createElement('pre');
      pre.textContent = input.content;
      wrap.appendChild(pre);
      return wrap;
    }

    if (name === 'Bash' && input && input.command) {
      const label = document.createElement('div');
      label.className = 'tool-section-label';
      label.textContent = input.description ? ('Bash · ' + input.description) : 'Bash';
      wrap.appendChild(label);
      const pre = document.createElement('pre');
      pre.className = 'wrap';
      pre.textContent = '$ ' + input.command;
      wrap.appendChild(pre);
      return wrap;
    }

    const label = document.createElement('div');
    label.className = 'tool-section-label';
    label.textContent = 'Input';
    wrap.appendChild(label);
    const pre = document.createElement('pre');
    pre.className = 'wrap';
    pre.textContent = typeof input === 'string' ? input : JSON.stringify(input, null, 2);
    wrap.appendChild(pre);
    return wrap;
  }

  function renderToolResult(m) {
    const el = state.toolsById.get(m.tool_use_id);
    if (!el) return;
    const statusEl = el.querySelector('.tool-status');
    statusEl.innerHTML = '';
    statusEl.classList.remove('running');
    if (m.is_error) {
      statusEl.classList.add('error');
      statusEl.innerHTML = SVG('<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>', 13, 13);
    } else {
      statusEl.classList.add('done');
      statusEl.innerHTML = SVG('<polyline points="20 6 9 17 4 12"/>', 13, 13);
    }
    // Add View button for supported file types on success
    if (!m.is_error) {
      const fp = el.dataset.toolFile;
      if (fp && isViewableFile(fp)) {
        const viewBtn = document.createElement('button');
        viewBtn.className = 'tool-view-btn';
        viewBtn.textContent = '↗ View';
        viewBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openFileViewer(fp, state.toolContentCache.get(m.tool_use_id) ?? null);
        });
        el.querySelector('.tool-header').appendChild(viewBtn);
      }
    }
    const body = el.querySelector('.tool-body');
    const wrap = document.createElement('div');
    wrap.className = 'tool-section';
    const label = document.createElement('div');
    label.className = 'tool-section-label';
    label.textContent = m.is_error ? 'Error' : 'Output';
    wrap.appendChild(label);
    const pre = document.createElement('pre');
    pre.className = 'wrap';
    pre.textContent = m.content || '(no output)';
    wrap.appendChild(pre);
    body.appendChild(wrap);

  function fmtTokens(n) {
    if (!n || n < 0) return null;
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(n >= 10_000_000 ? 0 : 1) + 'M';
    if (n >= 1_000) return (n / 1_000).toFixed(n >= 10_000 ? 0 : 1) + 'k';
    return String(n);
  }

  function renderTurnSummary(m) {
    const el = document.createElement('div');
    el.className = 'turn-summary';

    const addItem = (icon, value, title, cls) => {
      if (value == null) return;
      const s = document.createElement('span');
      s.className = 'ts-item' + (cls ? ' ' + cls : '');
      if (title) s.title = title;
      const b = document.createElement('b');
      b.textContent = value;
      if (icon) s.append(icon + ' ', b); else s.append(b);
      el.appendChild(s);
    };

    if (m.duration_ms) addItem('⏱', `${(m.duration_ms / 1000).toFixed(1)}s`, 'Durasi turn ini');
    if (m.num_turns) addItem('⇄', `${m.num_turns}`, 'Jumlah langkah agent (tool calls + balasan)');

    const tokIn = (m.input_tokens || 0) + (m.cache_read_tokens || 0) + (m.cache_creation_tokens || 0);
    addItem('↑', fmtTokens(tokIn), `Token masuk / konteks: ${tokIn.toLocaleString()}`);
    addItem('↓', fmtTokens(m.output_tokens), `Token keluar / jawaban: ${(m.output_tokens || 0).toLocaleString()}`);
    if (m.cache_read_tokens) {
      addItem('⚡', fmtTokens(m.cache_read_tokens),
        `Dari cache (jauh lebih murah): ${m.cache_read_tokens.toLocaleString()} token`);
    }

    if (typeof m.cost_usd === 'number' && m.cost_usd > 0) {
      addItem('', '$' + (m.cost_usd < 0.1 ? m.cost_usd.toFixed(4) : m.cost_usd.toFixed(2)),
        'Estimasi biaya turn ini', 'ts-cost');
    }

    if (!el.childNodes.length) return;
    els.messages.appendChild(el);
  }

  // After a turn completes, show a "Changed files" card summarizing the repo's
  // current uncommitted changes (same data as the git panel). Skipped on
  // non-repo cwd or when there are no changes. Also refreshes the git panel.
  async function renderChangedFilesCard(mode) {
    const dir = state.cwd;
    if (!dir) return;
    // Keep the side panel in sync with what just happened.
    if (state.git.open) refreshGit(dir);
    let data;
    try {
      const activeMode = mode || state.git.mode;
      let url = '/api/git/status?cwd=' + encodeURIComponent(dir);
      if (activeMode === 'last-turn') {
        url = `/api/git/last-turn?cwd=${encodeURIComponent(dir)}&sessionId=${state.sessionId || ''}`;
      }
      const res = await fetch(url);
      data = await res.json();
      if (!res.ok || !data.isRepo || !Array.isArray(data.files) || !data.files.length) return;
    } catch { return; }

    let totalAdd = 0, totalDel = 0;
    for (const f of data.files) { totalAdd += f.insertions || 0; totalDel += f.deletions || 0; }

    const card = document.createElement('div');
    card.className = 'changes-card';
    const n = data.files.length;
    const head = document.createElement('div');
    head.className = 'changes-card-head';
    head.innerHTML =
      '<span class="cc-count">' + n + ' Changed file' + (n === 1 ? '' : 's') + '</span>' +
      '<span class="cc-add">+' + totalAdd + '</span>' +
      '<span class="cc-del">−' + totalDel + '</span>';
    card.appendChild(head);

    const list = document.createElement('div');
    list.className = 'changes-card-list';
    for (const f of data.files) {
      const row = document.createElement('div');
      row.className = 'cc-row';
      // Split path into dir prefix (muted) + basename (bold), like the screenshot.
      const slash = f.path.lastIndexOf('/');
      const dirPart = slash >= 0 ? f.path.slice(0, slash + 1) : '';
      const base = slash >= 0 ? f.path.slice(slash + 1) : f.path;
      const stat = (f.insertions == null && f.deletions == null)
        ? '<span class="cc-stat" style="color:var(--muted)">bin</span>'
        : '<span class="cc-stat"><span class="cc-add">+' + (f.insertions || 0) + '</span> <span class="cc-del">−' + (f.deletions || 0) + '</span></span>';
      row.innerHTML =
        '<span class="cc-name" title="' + escapeHtml(f.path) + '"><bdi>' + escapeHtml(dirPart) + '<b>' + escapeHtml(base) + '</b></bdi></span>' +
        stat +
        '<span class="cc-chevron"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>';

      const diffEl = document.createElement('div');
      diffEl.className = 'cc-diff';
      diffEl.dataset.loaded = '0';
      diffEl.dataset.cwd = dir;

      row.addEventListener('click', () => {
        const open = row.classList.toggle('expanded');
        const chev = row.querySelector('.cc-chevron svg');
        if (chev) chev.style.transform = open ? 'rotate(90deg)' : '';
        if (open && diffEl.dataset.loaded === '0') loadChangedFileDiff(f, diffEl);
      });
      list.appendChild(row);
      list.appendChild(diffEl);
    }
    card.appendChild(list);
    els.messages.appendChild(card);
    scrollToBottom();
  }

  async function loadChangedFileDiff(f, diffEl) {
    diffEl.dataset.loaded = '1';
    diffEl.innerHTML = '<div class="cc-diff-note">Loading diff…</div>';
    try {
      const params = new URLSearchParams({ cwd: diffEl.dataset.cwd || state.cwd, path: f.path });
      if (f.staged && !f.unstaged) params.set('staged', '1');
      if (f.untracked) params.set('untracked', '1');
      const res = await fetch('/api/git/diff?' + params.toString());
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');
      diffEl.innerHTML = data.diff ? renderDiffHtml(data.diff) : '<div class="cc-diff-note">No textual diff.</div>';
      if (data.truncated) diffEl.innerHTML += '<div class="cc-diff-note">⚠ diff truncated (too large)</div>';
    } catch (err) {
      diffEl.dataset.loaded = '0';
      diffEl.innerHTML = '<div class="cc-diff-note">Error: ' + escapeHtml(err.message) + '</div>';
    }
  }

  // ---------- File viewer ----------
  const VIEWABLE_EXTS = new Set([
    '.md', '.txt', '.csv', '.json', '.yaml', '.yml', '.toml',
    '.sh', '.bash', '.zsh', '.env', '.ini', '.cfg', '.conf',
    '.js', '.ts', '.jsx', '.tsx', '.mjs', '.cjs',
    '.py', '.rb', '.go', '.rs', '.java', '.kt', '.scala',
    '.css', '.scss', '.less', '.html', '.xml', '.svg',
    '.tf', '.hcl', '.dockerfile', '.dbignore', '.gitignore',
    '.properties', '.plist', '.gradle', '.makefile', '.lock', '.log',
    '.sql', '.graphql', '.proto', '.pl', '.pm', '.lua',
    '.ps1', '.bat', '.cmd',
    '.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg',
  ]);
  const IMAGE_EXTS = new Set(['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg']);
  function isImageFile(fp) {
    const m = String(fp || '').match(/\.[^./\\]+$/);
    return m ? IMAGE_EXTS.has(m[0].toLowerCase()) : false;
  }
  function isViewableFile(fp) {
    const m = String(fp || '').match(/\.[^./\\]+$/);
    return m ? VIEWABLE_EXTS.has(m[0].toLowerCase()) : false;
  }
  function fileExt(fp) {
    const m = String(fp || '').match(/\.[^./\\]+$/);
    return m ? m[0].toLowerCase() : '';
  }

  let viewerRaw = false;
  let viewerHtmlPreview = false;
  let viewerEditMode = false;
  let viewerFile = { path: '', content: '', ext: '' };
  const viewerEl = document.getElementById('viewer');
  const viewerBody = document.getElementById('viewer-body');
  const viewerFilename = document.getElementById('viewer-filename');
  const viewerRawBtn = document.getElementById('viewer-raw-btn');

  function updateViewerToolbar() {
    const { ext, path: fp } = viewerFile;
    const isImg = isImageFile(fp);
    const isHtml = ext === '.html';
    const isText = !isImg;
    // Copy: only for text
    els.viewerCopyBtn.style.display = isText ? '' : 'none';
    // HTML preview toggle
    els.viewerHtmlBtn.style.display = isHtml ? '' : 'none';
    els.viewerHtmlBtn.textContent = viewerHtmlPreview ? 'Source' : 'Preview';
    els.viewerHtmlBtn.classList.toggle('active', viewerHtmlPreview);
    // Raw toggle: only for md/csv (and not while editing or html preview)
    const showRaw = (ext === '.md' || ext === '.csv') && !viewerEditMode && !viewerHtmlPreview;
    viewerRawBtn.style.display = showRaw ? '' : 'none';
    viewerRawBtn.textContent = viewerRaw ? 'Rendered' : 'Raw';
    viewerRawBtn.classList.toggle('active', viewerRaw);
    // Edit / Save / Cancel
    const canEdit = isText && !viewerHtmlPreview;
    els.viewerEditBtn.style.display = canEdit && !viewerEditMode ? '' : 'none';
    els.viewerSaveBtn.style.display = viewerEditMode ? '' : 'none';
    els.viewerCancelBtn.style.display = viewerEditMode ? '' : 'none';
  }

  function showViewerPanels() {
    const { path: fp } = viewerFile;
    const isImg = isImageFile(fp);
    const showIframe = viewerHtmlPreview;
    const showEditor = viewerEditMode && !isImg;
    viewerBody.style.display = showEditor ? 'none' : '';
    els.viewerEditor.style.display = showEditor ? '' : 'none';

  async function openFileViewer(filePath, cachedContent) {
    const ext = fileExt(filePath);
    viewerEditMode = false;
    viewerRaw = false;
    viewerHtmlPreview = false;
    if (isImageFile(filePath)) {
      viewerFile = { path: filePath, content: '', ext };
    } else {
      let content = cachedContent;
      if (content == null) {
        try {
          const res = await fetch('/api/file?path=' + encodeURIComponent(filePath));
          const data = await res.json();
          if (!res.ok) { renderError(data.error || 'Cannot open file'); return; }
          content = data.content;
        } catch (e) { renderError('Cannot read file: ' + e.message); return; }
      }
      viewerFile = { path: filePath, content, ext };
    }
    viewerFilename.textContent = filePath.split(/[/\\]/).pop();
    viewerFilename.title = filePath;
    updateViewerToolbar();
    renderViewerBody();
    showViewerPanels();
    viewerEl.classList.add('open');
    document.getElementById('app').classList.add('viewer-open');
    const vw = (viewerEl.offsetWidth || parseInt(viewerEl.style.width) || 520);
    document.documentElement.style.setProperty('--viewer-w', vw + 'px');
  }

  function renderViewerBody() {
    const { content, ext, path: fp } = viewerFile;
    viewerBody.className = '';
    if (isImageFile(fp)) {
      viewerBody.className = 'img' + (ext === '.svg' ? ' svg' : '');
      const imgUrl = '/api/download?path=' + encodeURIComponent(fp) + '&inline=1';
      viewerBody.innerHTML = `<img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(fp.split(/[/\\]/).pop())}" />`;
      return;
    }
    if (viewerHtmlPreview) {
      els.viewerIframe.srcdoc = content || '';
      return;
    }
    if (viewerRaw || (ext !== '.md' && ext !== '.csv' && ext !== '.html')) {
      viewerBody.className = 'raw';
      viewerBody.textContent = content;
      return;
    }
    if (ext === '.md') {
      viewerBody.className = 'md';
      const html = window.marked ? marked.parse(content || '') : escapeHtml(content);
      viewerBody.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
    } else if (ext === '.csv') {
      viewerBody.className = 'csv';
      viewerBody.innerHTML = renderCsvTable(content);
    } else if (ext === '.html') {
      viewerBody.className = 'raw';
      viewerBody.textContent = content;
    }
  }

  function renderCsvTable(csv) {
    const lines = csv.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim());
    if (!lines.length) return '<p style="color:var(--muted);font-size:13px;">Empty file</p>';
    function parseRow(line) {
      const cells = []; let cur = ''; let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { cells.push(cur); cur = ''; }
        else cur += c;
      }
      cells.push(cur);
      return cells;
    }
    const rows = lines.map(parseRow);
    const header = rows[0];
    let html = '<div class="csv-wrap"><table><thead><tr>';
    for (const h of header) html += `<th>${escapeHtml(h)}</th>`;
    html += '</tr></thead><tbody>';
    for (const row of rows.slice(1)) {
      html += '<tr>';
      for (let i = 0; i < Math.max(row.length, header.length); i++) {
        html += `<td>${escapeHtml(row[i] ?? '')}</td>`;
      }
      html += '</tr>';
    }
    return html + '</tbody></table></div>';
  }

  function formatSize(bytes) {
    if (bytes === 0) return '';
    if (bytes < 1024) return bytes + ' B';

  async function loadFileList(dirPath) {
    if (!dirPath) return;
    fileListPath = dirPath;

      renderFileEntries(data);

      fileListEl.innerHTML = '<div class="file-empty">Error: ' + escapeHtml(err.message) + '</div>';
    }
  }

  function renderFileEntries(data) {
    fileListEl.innerHTML = '';
    // Parent directory
    if (data.parent) {
      const up = document.createElement('div');
      up.className = 'file-item';
      up.innerHTML = ICON_FOLDER_SVG + '<span class="fi-name" style="color:var(--muted)">..</span>';
      up.addEventListener('click', () => loadFileList(data.parent));
      fileListEl.appendChild(up);
    }
    for (const e of data.entries) {
      const isDir = e.type === 'dir';
      const fullPath = (data.path.endsWith('/') ? data.path.slice(0, -1) : data.path) + '/' + e.name;
      const item = document.createElement('div');
      item.className = 'file-item' + (isDir ? ' dir' : '');
      const icon = isDir ? ICON_FOLDER_SVG : ICON_FILE_SVG;
      const sizeStr = isDir ? '' : formatSize(e.size);
      let extraButtons = '';
      if (!isDir) extraButtons += `<button class="fi-dl" title="Download">${ICON_DL_SVG}</button>`;
      extraButtons += `<button class="fi-rename" title="Rename">${ICON_RENAME_SVG}</button>`;
      item.innerHTML = `<span class="fi-icon">${icon}</span><span class="fi-name">${escapeHtml(e.name)}</span>${sizeStr ? '<span class="fi-size">' + sizeStr + '</span>' : ''}${extraButtons}`;

      // Main click (open dir or file)
      item.addEventListener('click', (ev) => {
        if (ev.target.closest('.fi-dl')) return;
        if (ev.target.closest('.fi-rename')) return;
        if (isDir) {
          loadFileList(fullPath);
        } else {
          const isViewable = isViewableFile(e.name);
          if (isViewable) openFileViewer(fullPath, null);
          else downloadFile(fullPath);
        }
      });

      // Download button (only for files)
      if (!isDir) {
        const dlBtn = item.querySelector('.fi-dl');
        dlBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          downloadFile(fullPath);
        });
      }

      // Rename button (both files and dirs)
      const renameBtn = item.querySelector('.fi-rename');
      renameBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        item.style.display = 'none';
        renameRow.style.display = 'flex';
        renameInput.focus();
        renameInput.select();
      });

      fileListEl.appendChild(item);

      // Create rename row (hidden) for this entry
      const renameRow = document.createElement('div');
      renameRow.className = 'file-rename-row';
      renameRow.style.display = 'none';
      renameRow.innerHTML = `
        <input type="text" class="rename-input" value="${escapeHtml(e.name)}" />
        <button type="button" class="rename-confirm primary">Rename</button>
        <button type="button" class="rename-cancel">Cancel</button>
      `;
      renameRow.dataset.fullPath = fullPath;
      renameRow.dataset.originalName = e.name;

      const renameInput = renameRow.querySelector('.rename-input');
      renameInput.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          renameRow.querySelector('.rename-confirm').click();
        }
        if (ev.key === 'Escape') {
          ev.preventDefault();
          renameRow.querySelector('.rename-cancel').click();
        }
      });
      renameRow.querySelector('.rename-cancel').addEventListener('click', () => {
        renameRow.style.display = 'none';
        item.style.display = 'flex';
      });
      renameRow.querySelector('.rename-confirm').addEventListener('click', async () => {
        const newName = renameInput.value.trim();
        if (!newName) {
          alert('Name cannot be empty');

        if (newName === renameRow.dataset.originalName) {
          renameRow.style.display = 'none';
          item.style.display = 'flex';
          return;

        const fromPath = renameRow.dataset.fullPath;
        const toPath = fileListPath.replace(/\/?$/, '/') + newName;
        try {
          const res = await fetch('/api/rename', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

          if (!res.ok) {

          // Success: update UI and reload
          loadFileList(fileListPath);
        } catch (err) {
          alert('Rename error: ' + err.message);
        }
      });

      fileListEl.appendChild(renameRow);
    }
    if (!fileListEl.children.length) {
      fileListEl.innerHTML = '<div class="file-empty">(empty directory)</div>';
    }
  }

  async function refreshGit(cwd) {
    const dir = cwd || state.cwd;
    if (!dir) return;
    state.git.cwd = dir;
    state.git.loading = true;
    els.btnGitRefresh.classList.add('spinning');
    // Only paint a loading state when the panel is actually visible.
    if (state.git.open && !state.git.files.length) {
      els.gitBody.innerHTML = '<div class="git-empty"><span class="spinner"></span><div style="margin-top:8px">Loading…</div></div>';
    }
    try {
      let url = '/api/git/status?cwd=' + encodeURIComponent(dir);
      if (state.git.mode === 'last-turn') {
        url = `/api/git/last-turn?cwd=${encodeURIComponent(dir)}&sessionId=${state.sessionId || ''}`;
      }
      const res = await fetch(url);
      const data = await res.json();
      // Ignore stale responses if cwd changed while in flight.
      if (state.git.cwd !== dir) return;
      if (!res.ok) throw new Error(data.error || 'failed');

      state.git.isRepo = !!data.isRepo;
      if (data.branch !== undefined) {
        state.git.branch = data.branch || '';
      }
      state.git.files = data.files || [];
      state.git.error = '';
      state.git.expanded = new Set();
    } catch (err) {
      if (state.git.cwd !== dir) return;
      state.git.isRepo = false;
      state.git.files = [];
      state.git.error = err.message;
    } finally {
      state.git.loading = false;
      els.btnGitRefresh.classList.remove('spinning');
      renderGit();
    }
  }

  function renderGit() {
    const g = state.git;
    if (g.isRepo && g.branch) {
      els.gitBranchRow.style.display = 'flex';
      els.gitBranchName.textContent = g.branch || '—';
      els.gitBranchCwd.textContent = shortCwd(g.cwd);
    } else {
      els.gitBranchRow.style.display = 'none';
    }
    const showCommitArea = g.isRepo && g.files.length > 0 && g.mode === 'git';
    els.gitCommitArea.style.display = showCommitArea ? '' : 'none';
    if (g.error) {
      els.gitBody.innerHTML = '<div class="git-empty">Error: ' + escapeHtml(g.error) + '</div>';
      return;
    }
    if (!g.isRepo) {
      els.gitBody.innerHTML = '<div class="git-empty">Not a git repository.<br><span style="font-size:11px">' + escapeHtml(shortCwd(g.cwd)) + '</span></div>';
      return;
    }
    if (!g.files.length) {
      const emptyMsg = state.git.mode === 'last-turn'
        ? '✓ No changes in last turn<br><span style="font-size:11px">AI hasn\'t touched any files in this step</span>'
        : '✓ No changes<br><span style="font-size:11px">Working tree clean</span>';
      els.gitBody.innerHTML = '<div class="git-empty">' + emptyMsg + '</div>';
      return;
    }
    els.gitBody.innerHTML = '';
    const stagedFiles = g.files.filter(f => f.staged && !f.unstaged);
    const unstagedFiles = g.files.filter(f => !f.staged || f.unstaged);
    if (g.mode === 'git') {
      if (stagedFiles.length) {
        const hdr = document.createElement('div');
        hdr.className = 'git-section-header';
        hdr.innerHTML = 'Staged <span class="git-section-count">' + stagedFiles.length + '</span>' +
          '<span style="margin-left:auto"><button class="git-stage-btn" data-action="unstage-all" type="button" title="Unstage all">− All</button></span>';
        hdr.querySelector('[data-action="unstage-all"]').addEventListener('click', () => {
          gitStageFiles(stagedFiles.map(f => f.path), false);
        });
        els.gitBody.appendChild(hdr);
        for (const f of stagedFiles) renderGitFileRow(f, true);
      }
      if (unstagedFiles.length) {
        const hdr = document.createElement('div');
        hdr.className = 'git-section-header';
        hdr.innerHTML = 'Changes <span class="git-section-count">' + unstagedFiles.length + '</span>' +
          '<span style="margin-left:auto"><button class="git-stage-btn" data-action="stage-all" type="button" title="Stage all">+ All</button></span>';
        hdr.querySelector('[data-action="stage-all"]').addEventListener('click', () => {
          gitStageFiles(unstagedFiles.map(f => f.path), true);
        });
        els.gitBody.appendChild(hdr);
        for (const f of unstagedFiles) renderGitFileRow(f, false);
      }
    } else {
      for (const f of g.files) renderGitFileRow(f, f.staged);
    }
    updateCommitBtnState();
  }

  function renderGitFileRow(f, isInStagedSection) {
    const g = state.git;
    const fileEl = document.createElement('div');
    fileEl.className = 'git-file';
    const key = (isInStagedSection ? 'S:' : 'W:') + f.path;
    if (g.expanded.has(key)) fileEl.classList.add('expanded');

    const row = document.createElement('div');
    row.className = 'git-file-row';

    const statusChar = (f.status || '?').toUpperCase();
    let statusLabel = 'Modified';
    let statusClass = 'badge-modified';
    if (statusChar === 'A' || statusChar === '?') {
      statusLabel = 'Added';
      statusClass = 'badge-added';
    } else if (statusChar === 'D') {
      statusLabel = 'Deleted';
      statusClass = 'badge-deleted';
    }

    const stat = gitStatHtml(f);
    if (g.mode === 'git') {
      const stageBtn = document.createElement('button');
      stageBtn.className = 'git-stage-btn';
      stageBtn.type = 'button';
      stageBtn.title = isInStagedSection ? 'Unstage' : 'Stage';
      stageBtn.textContent = isInStagedSection ? '−' : '+';
      stageBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        gitStageFiles([f.path], !isInStagedSection);
      });

      row.innerHTML =
        '<span class="git-file-badge ' + statusClass + '">' + statusLabel + '</span>' +
        '<span class="git-file-name" title="' + escapeHtml(f.path) + '"><bdi>' + escapeHtml(f.path) + '</bdi></span>' + stat;
      row.appendChild(stageBtn);
    } else {
      const stagedDot = f.staged ? '<span class="git-staged-dot" title="staged"></span>' : '';
      row.innerHTML =
        '<span class="git-file-badge ' + statusClass + '">' + statusLabel + '</span>' +
        '<span class="git-file-name" title="' + escapeHtml(f.path) + '"><bdi>' + escapeHtml(f.path) + '</bdi></span>' +
        stagedDot + stat;
    }
    row.addEventListener('click', () => toggleGitDiff(f, fileEl, key));
    fileEl.appendChild(row);

    const diffEl = document.createElement('div');
    diffEl.className = 'git-diff';
    diffEl.dataset.loaded = '0';
    fileEl.appendChild(diffEl);

    els.gitBody.appendChild(fileEl);
    if (g.expanded.has(key)) loadGitDiff(f, diffEl);
  }

  function updateCommitBtnState() {
    const hasStagedFiles = state.git.files.some(f => f.staged && !f.unstaged);
    const hasMessage = els.gitCommitInput.value.trim().length > 0;
    els.btnGitCommit.disabled = !hasStagedFiles || !hasMessage;
  }

  async function gitStageFiles(files, stage) {
    const url = stage ? '/api/git/stage' : '/api/git/unstage';
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cwd: state.git.cwd, files }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');
      await refreshGit(state.git.cwd);
    } catch (err) {
      showGitCommitStatus(err.message, true);
    }
  }

  async function gitCommit() {
    const message = els.gitCommitInput.value.trim();
    if (!message) return;
    els.btnGitCommit.disabled = true;
    els.btnGitCommit.textContent = 'Committing…';
    try {
      const res = await fetch('/api/git/commit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cwd: state.git.cwd, message }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'commit failed');
      els.gitCommitInput.value = '';
      showGitCommitStatus('Committed successfully', false);
      await refreshGit(state.git.cwd);
    } catch (err) {
      showGitCommitStatus(err.message, true);
    } finally {
      els.btnGitCommit.textContent = 'Commit';
      updateCommitBtnState();
    }
  }

  async function gitPush() {
    els.btnGitPush.disabled = true;
    els.btnGitPush.textContent = 'Pushing…';
    try {
      const res = await fetch('/api/git/push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cwd: state.git.cwd }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'push failed');
      showGitCommitStatus('Pushed to origin/' + (state.git.branch || 'branch'), false);
    } catch (err) {
      showGitCommitStatus(err.message, true);
    } finally {
      els.btnGitPush.disabled = false;
      els.btnGitPush.textContent = 'Push';
    }
  }

  function showGitCommitStatus(msg, isError) {
    els.gitCommitStatus.style.display = '';
    els.gitCommitStatus.textContent = msg;
    els.gitCommitStatus.className = 'git-commit-status ' + (isError ? 'error' : 'success');
    clearTimeout(showGitCommitStatus._timer);
    showGitCommitStatus._timer = setTimeout(() => {
      els.gitCommitStatus.style.display = 'none';
    }, isError ? 8000 : 4000);
  }

  function gitStatHtml(f) {
    if (f.insertions == null && f.deletions == null) return '<span class="git-file-stat" style="color:var(--muted)">bin</span>';
    const ins = f.insertions || 0, del = f.deletions || 0;
    return '<span class="git-file-stat"><span class="git-stat-add">+' + ins + '</span> <span class="git-stat-del">-' + del + '</span></span>';
  }

  function toggleGitDiff(f, fileEl, key) {
    const diffEl = fileEl.querySelector('.git-diff');
    if (fileEl.classList.contains('expanded')) {
      fileEl.classList.remove('expanded');
      state.git.expanded.delete(key);
    } else {
      fileEl.classList.add('expanded');
      state.git.expanded.add(key);
      if (diffEl.dataset.loaded === '0') loadGitDiff(f, diffEl);
    }
  }

  async function loadGitDiff(f, diffEl) {
    diffEl.dataset.loaded = '1';
    diffEl.innerHTML = '<div class="git-diff-note">Loading diff…</div>';
    try {
      const params = new URLSearchParams({ cwd: state.git.cwd, path: f.path });
      if (f.staged && !f.unstaged) params.set('staged', '1');
      if (f.untracked) params.set('untracked', '1');
      const res = await fetch('/api/git/diff?' + params.toString());
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');
      diffEl.innerHTML = renderDiffHtml(data.diff || '');
      if (data.truncated) diffEl.innerHTML += '<div class="git-diff-note">⚠ diff truncated (too large)</div>';
      if (!data.diff) diffEl.innerHTML = '<div class="git-diff-note">No textual diff.</div>';
    } catch (err) {
      diffEl.dataset.loaded = '0';
      diffEl.innerHTML = '<div class="git-diff-note">Error: ' + escapeHtml(err.message) + '</div>';
    }
  }

  function renderDiffHtml(diff) {
    const lines = diff.split('\n');
    let html = '';
    let oldLine = 0;
    let newLine = 0;
    for (const line of lines) {
      let cls = '';
      let oldDisplay = '';
      let newDisplay = '';
      let codeText = line;

      if (line.startsWith('@@')) {
        cls = 'hunk';
        const match = line.match(/^@@\s+-(\d+),?\d*\s+\+(\d+),?\d*\s+@@/);
        if (match) {
          oldLine = parseInt(match[1], 10);
          newLine = parseInt(match[2], 10);
        }
      } else if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('diff ') || line.startsWith('index ') || line.startsWith('new ') || line.startsWith('deleted ') || line.startsWith('rename ') || line.startsWith('similarity ')) {
        cls = 'meta';
      } else if (line.startsWith('+')) {
        cls = 'add';
        newDisplay = newLine++;
      } else if (line.startsWith('-')) {
        cls = 'del';
        oldDisplay = oldLine++;
      } else if (line.startsWith(' ') || !line) {
        cls = 'ctx';
        oldDisplay = oldLine++;
        newDisplay = newLine++;
      }

      html += '<div class="git-diff-line ' + cls + '">' +
              '<span class="ln-old">' + oldDisplay + '</span>' +
              '<span class="ln-new">' + newDisplay + '</span>' +
              '<span class="line-code">' + (escapeHtml(codeText) || '&nbsp;') + '</span>' +
              '</div>';
    }
    return html;
  }

  // ---------- Node selector ----------
  function renderNodeList() {
    if (!els.nodeRow || !els.nodeList) return;
    if (!state.nodes || state.nodes.length <= 1) {
      els.nodeRow.style.display = 'none';
      return;
    }
    // Use explicit 'block' (not '') so we override the `#node-row { display: none }`
    // CSS rule. Setting style.display = '' would clear the inline and fall back to CSS.
    els.nodeRow.style.display = 'block';
    els.nodeList.innerHTML = '';
    for (const node of state.nodes) {
      const isActive = node.id === state.currentNodeId;
      const isConnecting = state.nodeConnecting && node.id === state.currentNodeId;
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'node-chip' + (isActive ? ' active' : '') + (isConnecting ? ' connecting' : '');
      if (isConnecting) {
        chip.innerHTML = '<span class="spinner" style="width:8px;height:8px;border-width:1.5px;border-top-color:#fff;border-color:rgba(255,255,255,.3);"></span>' + escapeHtml(node.name);
      } else {
        chip.innerHTML = '<span class="ndot"></span>' + escapeHtml(node.name);
      }
      if (!isActive && !isConnecting) {
        chip.addEventListener('click', () => {
          send({ type: 'set_node', nodeId: node.id });
          closeSidebar();
        });
      }
      els.nodeList.appendChild(chip);
    }
  }

  function updateNodeBadge() {
    if (!els.nodeBadge) return;
    if (!state.currentNodeId || state.currentNodeId === 'local') {
      els.nodeBadge.style.display = 'none';
    } else {
      els.nodeBadge.style.display = '';
      els.nodeBadge.textContent = state.currentNodeName;
    }
  }

  // ---------- Sessions ----------
  function loadSession(id, cwd, events, permissionMode, model, active, engine) {
    state.sessionId = id;
    updateGitHeaderTitle();
    setStoredSessionId(state.currentNodeId, id);
    state.cwd = cwd || state.cwd;
    if (permissionMode) state.permissionMode = permissionMode;
    if (model) state.model = model;
    if (engine) state.engine = engine;
    els.cwdInput.value = state.cwd;
    els.permSelect.value = state.permissionMode;
    if (els.engineSelect) els.engineSelect.value = state.engine;
    if (state.engine === 'codex') {
      els.modelSelect.innerHTML = codexModelOptionsHtml(state.model || 'gpt-5-codex');
      els.modelSelect.value = state.model || 'gpt-5-codex';
    } else if (state.engine === 'kilo') {
      els.modelSelect.innerHTML = kiloModelOptionsHtml(state.model || 'kilo/kilo-auto/free');
      els.modelSelect.value = state.model || 'kilo/kilo-auto/free';
    } else if (state.engine === 'qwen') {
      els.modelSelect.innerHTML = '<option value="default">Default Model (use config)</option><option value="qwen2.5-coder:32b">Qwen 2.5 Coder 32B</option><option value="qwen2.5-coder:14b">Qwen 2.5 Coder 14B</option><option value="qwen2.5-coder:7b">Qwen 2.5 Coder 7B</option><option value="qwen2.5-coder:1.5b">Qwen 2.5 Coder 1.5B</option>';
      els.modelSelect.value = state.model || 'default';
    } else {
      els.modelSelect.innerHTML = claudeModelOptionsHtml(state.model || 'sonnet');
      els.modelSelect.value = state.model || 'sonnet';
    }
    updatePermWarn();
    updateSettingsCwd(state.cwd);
    clearMessages();
    if (!events || !events.length) {
      const e = document.createElement('div');
      e.className = 'empty-state';
      e.textContent = id ? 'Belum ada pesan di session ini.' : 'Mulai chat baru — ketik pesan di bawah.';
      els.messages.appendChild(e);
    } else {
      // replay normalized events (suppress live-only side effects like the
      // changed-files card, which would otherwise fetch current git state).
      replayingHistory = true;
      for (const evt of events) handle(evt);
      replayingHistory = false;
      // After replay, linkify all text bubbles — tool_start events that register
      // writtenFiles may come AFTER the assistant_text that mentions them.
      linkifyAllTextBubbles();
    }
    // Historical events have turn_start without matching turn_end (server-only).
    // Default: assume idle. But if server says the session has an active run,
    // keep inTurn=true so the composer shows the Stop button + live events update the bubble.
    state.aborting = false;
    state.lastAssistantBubble = null;
    state.inTurn = !!active;
    updateSendButton();
    updateHeaderTitle();
    renderSessions();
    updateEngineBadge(state.engine, state.model);  // sync composer badge with loaded session
    closeSidebar();
  }

  function renderSnippets(snippets) {
    return snippets.map(raw => {
      const div = document.createElement('div');
      div.className = 'session-snippet';
      const parts = raw.split('\x00');
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          div.appendChild(document.createTextNode(parts[i]));
        } else {
          const mark = document.createElement('mark');
          mark.textContent = parts[i];
          div.appendChild(mark);
        }
      }
      return div;
    });
  }

  function buildSessionItem(s, snippets) {
    const item = document.createElement('div');
    item.className = 'session-item' + (s.id === state.sessionId ? ' active' : '');
    const text = document.createElement('div');
    text.className = 'session-text';
    const tk = s.tokensEstimate || 0;
    const heavy = tk > 100_000 ? 'heavy' : (tk > 50_000 ? 'medium' : '');
    const tkLabel = tk > 0 ? (tk >= 1000 ? `~${Math.round(tk/1000)}k` : `~${tk}`) + ' tokens' : '';
    const costLabel = (typeof s.totalCostUsd === 'number' && s.totalCostUsd > 0)
      ? '$' + s.totalCostUsd.toFixed(s.totalCostUsd < 0.1 ? 4 : 2)
      : '';
    const weight = [costLabel, tkLabel].filter(Boolean).join(' · ');
    const isRunning = state.activeSessions.has(s.id);
    const runningDot = isRunning ? '<span class="session-running-dot" title="Running…"></span>' : '';
    text.innerHTML = `
      <div class="session-title-row">${runningDot}${escapeHtml(s.title || 'Untitled')}</div>
      <div class="session-meta">${timeAgo(s.last_used_at)} · ${shortCwd(s.cwd)}</div>
      ${weight ? `<div class="session-weight ${heavy}">${weight}</div>` : ''}
    `;
    if (snippets && snippets.length) {
      renderSnippets(snippets).forEach(el => text.appendChild(el));
    }
    text.addEventListener('click', () => {
      send({ type: 'load_session', sessionId: s.id });
    });
    const rename = document.createElement('button');
    rename.className = 'session-action rename';
    rename.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
    rename.setAttribute('aria-label', 'Rename');
    rename.title = 'Rename';
    rename.addEventListener('click', async (e) => {
      e.stopPropagation();
      const newTitle = prompt('New title:', s.title || '');
      if (!newTitle || newTitle.trim() === s.title) return;
      const res = await fetch('/api/sessions/' + s.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: newTitle.trim() }),
      });
      if (res.ok) {
        const data = await res.json();
        state.sessions = data.sessions || state.sessions;
        renderSessions();
        updateHeaderTitle();
      }
    });
    const del = document.createElement('button');
    del.className = 'session-action delete';
    del.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
    del.setAttribute('aria-label', 'Delete');
    del.title = 'Delete';
    del.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this session?')) return;
      await fetch('/api/sessions/' + s.id, { method: 'DELETE' });
      state.sessions = state.sessions.filter(x => x.id !== s.id);
      if (state.sessionId === s.id) {
        state.sessionId = null;
        clearMessages();
        updateHeaderTitle();
      }
      renderSessions();
    });
    item.appendChild(text);
    item.appendChild(rename);
    item.appendChild(del);
    return item;
  }

  function renderSessions() {
    els.sessionList.innerHTML = '';
    if (state.contentSearchMode && state.contentSearchResults !== null) {
      if (state.contentSearchLoading) {
        const e = document.createElement('div');
        e.className = 'search-loading';
        e.textContent = 'Searching…';
        els.sessionList.appendChild(e);
        return;
      }
      if (!state.contentSearchResults.length) {
        const e = document.createElement('div');
        e.style.cssText = 'padding:20px;color:var(--muted);font-size:12px;text-align:center;';
        e.textContent = 'No sessions match';
        els.sessionList.appendChild(e);
        return;
      }
      for (const s of state.contentSearchResults) {
        els.sessionList.appendChild(buildSessionItem(s, s.snippets || []));
      }
      return;
    }
    const q = state.sessionSearch.toLowerCase().trim();
    const visible = q
      ? state.sessions.filter(s => (s.title || 'Untitled').toLowerCase().includes(q))
      : state.sessions;
    if (!visible.length) {
      const e = document.createElement('div');
      e.style.cssText = 'padding:20px;color:var(--muted);font-size:12px;text-align:center;';
      e.textContent = q ? 'No sessions match' : 'No sessions yet';
      els.sessionList.appendChild(e);
      return;
    }
    for (const s of visible) {
      els.sessionList.appendChild(buildSessionItem(s, []));
    }
  }

  function updateHeaderTitle() {
    if (!state.sessionId) { els.headerTitle.textContent = 'New chat'; return; }
    const s = state.sessions.find(x => x.id === state.sessionId);
    els.headerTitle.textContent = s ? s.title : 'Chat';
  }

  function shortCwd(p) {
    if (!p) return '';
    const home = '/Users/andi';
    return p.startsWith(home) ? '~' + p.slice(home.length) : p;
  }

  function timeAgo(ts) {
    if (!ts) return '';
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  // ---------- Composer ----------
  function autoGrow() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 160) + 'px';
  }
  els.input.addEventListener('input', () => {
    autoGrow();
    updateSendButton();
  });

  function updateSendButton() {
    if (state.aborting) {
      els.btnSend.disabled = true;
      els.btnSend.classList.add('cancel');
      els.btnSend.innerHTML = '<span class="spinner" style="border-top-color:var(--on-accent);border-color:color-mix(in srgb, var(--on-accent) 30%, transparent);"></span>';
    } else if (state.inTurn) {
      els.btnSend.disabled = false;
      els.btnSend.classList.add('cancel');
      els.btnSend.textContent = '■';
    } else {
      const hasContent = els.input.value.trim() || pendingImages.length > 0;
      els.btnSend.disabled = !hasContent || !state.ws || state.ws.readyState !== WebSocket.OPEN;
      els.btnSend.classList.remove('cancel');
      els.btnSend.textContent = '➤';
    }
    if (els.btnAttach) {
      els.btnAttach.disabled = state.inTurn || state.aborting || pendingImages.length >= MAX_IMAGES;
    }
  }

  // ---------- Image attachments ----------
  const MAX_IMAGES = 4;
  // Was 2048 — lowered to 1280 to cut ~60% of vision tokens per image.
  // Claude still reads small UI text reliably at this resolution.
  const MAX_FULL_DIM = 1280;
  const MAX_THUMB_DIM = 512;
  const pendingImages = [];

  function resizeToDataURL(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read failed'));
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => reject(new Error('decode failed'));
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else { width = Math.round(width * (maxDim / height)); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function addImageFile(file) {
    if (pendingImages.length >= MAX_IMAGES) return;
    if (!file.type.startsWith('image/')) return;
    try {
      const [fullData, thumbData] = await Promise.all([

  function doSend() {
    if (state.inTurn) {
      if (state.aborting) return;
      state.aborting = true;
      updateSendButton();
      send({ type: 'abort' });
      setTimeout(() => {
        if (state.aborting) {
          state.aborting = false;
          state.inTurn = false;
          updateSendButton();
        }
      }, 5000);
      return;
    }
    const text = els.input.value;
    if (!text.trim() && pendingImages.length === 0) return;
    const payload = { type: 'prompt', text };

    // Generate/Attach tempSessionId if not in an active session
    if (!state.sessionId) {
      let tempSid = storedTempSessionId(state.currentNodeId);
      if (!tempSid) {
        tempSid = 'temp_' + Math.random().toString(36).slice(2, 10);
        setStoredTempSessionId(state.currentNodeId, tempSid);
      }
      payload.tempSessionId = tempSid;
    }

    if (pendingImages.length > 0) {
      payload.images = pendingImages.map(img => ({
        name: img.name,
        mime: img.mime,
        fullData: img.fullData,
        thumbData: img.thumbData,
      }));
    }
    send(payload);
    els.input.value = '';

    renderImagePreviews();

  let gitResizing = false, gitStartX = 0, gitStartW = 0;
  function gitResizeStart(clientX) {
    gitResizing = true; gitStartX = clientX; gitStartW = els.gitPanel.offsetWidth;
    els.gitResize.classList.add('dragging');
    document.body.style.userSelect = 'none'; document.body.style.cursor = 'col-resize';
  }
  function gitResizeMove(clientX) {
    if (!gitResizing) return;
    const w = Math.min(760, Math.max(240, gitStartW + (gitStartX - clientX)));
    setGitWidth(w);
  }
  function gitResizeEnd() {
    if (!gitResizing) return;
    gitResizing = false;
    els.gitResize.classList.remove('dragging');
    document.body.style.userSelect = ''; document.body.style.cursor = '';
    try { localStorage.setItem('git-panel-width', els.gitPanel.offsetWidth + 'px'); } catch {}
