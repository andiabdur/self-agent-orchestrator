<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1b26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Orchestrator" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<title>Self Agent Orchestrator</title>
<style>
  /* ─── Tokens ──────────────────────────────────────────────
     4 night-comfortable themes, picked for low eye-strain:
     Tokyo Night (default) · Gruvbox · Nord · Solarized Dark.
     Soft contrast, controlled saturation, no pure black/white.
     --on-accent = text color drawn on top of accent fills. */

  /* ─── Tokyo Night (default) ───────────────────────────── */
  :root {
    --bg:          #1a1b26;
    --bg-2:        #1f2335;
    --bg-3:        #292e42;
    --border:      #2f344d;
    --text:        #c0caf5;
    --text-strong: #d8e0ff;
    --text-em:     #a9b1d6;
    --muted:       #565f89;
    --accent:      #7aa2f7;
    --accent-2:    #6a8fe0;
    --on-accent:   #16161e;
    --tool:        #ff9e64;
    --tool-bg:     rgba(255,158,100,.07);
    --tool-border: rgba(255,158,100,.22);
    --code-bg:     #16161e;
    --code-fg:     #e0af68;
    --success:     #9ece6a;
    --error:       #f7768e;
    --diff-add:    #9ece6a;
    --diff-del:    #f7768e;
    --link:        #7dcfff;
    --user-bubble-text: #16161e;
  }
  /* ─── Gruvbox (warm, low blue-light) ──────────────────── */
  :root[data-theme="gruvbox"] {
    --bg:          #282828;
    --bg-2:        #32302f;
    --bg-3:        #3c3836;
    --border:      #504945;
    --text:        #ebdbb2;
    --text-strong: #fbf1c7;
    --text-em:     #d5c4a1;
    --muted:       #928374;
    --accent:      #fabd2f;
    --accent-2:    #d79921;
    --on-accent:   #282828;
    --tool:        #fe8019;
    --tool-bg:     rgba(254,128,25,.07);
    --tool-border: rgba(254,128,25,.24);
    --code-bg:     #1d2021;
    --code-fg:     #fabd2f;
    --success:     #b8bb26;
    --error:       #fb4934;
    --diff-add:    #b8bb26;
    --diff-del:    #fb4934;
    --link:        #83a598;
    --user-bubble-text: #282828;
  }
  /* ─── Nord (muted arctic, calm) ───────────────────────── */
  :root[data-theme="nord"] {
    --bg:          #2e3440;
    --bg-2:        #333b48;
    --bg-3:        #3b4252;
    --border:      #434c5e;
    --text:        #d8dee9;
    --text-strong: #eceff4;
    --text-em:     #c0c8d4;
    --muted:       #7b88a1;
    --accent:      #88c0d0;
    --accent-2:    #81a1c1;
    --on-accent:   #2e3440;
    --tool:        #d08770;
    --tool-bg:     rgba(208,135,112,.08);
    --tool-border: rgba(208,135,112,.24);
    --code-bg:     #272c36;
    --code-fg:     #ebcb8b;
    --success:     #a3be8c;
    --error:       #bf616a;
    --diff-add:    #a3be8c;
    --diff-del:    #bf616a;
    --link:        #81a1c1;
    --user-bubble-text: #2e3440;
  }
  /* ─── Solarized Dark (designed for low eye-strain) ────── */
  :root[data-theme="solarized"] {
    --bg:          #002b36;
    --bg-2:        #063844;
    --bg-3:        #073642;
    --border:      #11404d;
    --text:        #93a1a1;
    --text-strong: #cad4d4;
    --text-em:     #839496;
    --muted:       #586e75;
    --accent:      #268bd2;
    --accent-2:    #1a6fa8;
    --on-accent:   #fdf6e3;
    --tool:        #cb4b16;
    --tool-bg:     rgba(203,75,22,.08);
    --tool-border: rgba(203,75,22,.24);
    --code-bg:     #00212b;
    --code-fg:     #b58900;
    --success:     #859900;
    --error:       #dc322f;
    --diff-add:    #859900;
    --diff-del:    #dc322f;
    --link:        #2aa198;
    --user-bubble-text: #fdf6e3;
  }
  /* ─── Daylight (high-contrast light, for outdoor/sunlight) ─
     Max luminance white bg to beat glare; near-black text and
     deliberately dark secondary text + borders so nothing
     washes out under direct sun. */
  :root[data-theme="daylight"] {
    --bg:          #ffffff;
    --bg-2:        #f4f5f7;
    --bg-3:        #e7e9ed;
    --border:      #b9bdc4;
    --text:        #141414;
    --text-strong: #000000;
    --text-em:     #2e2e2e;
    --muted:       #4d4d4d;
    --accent:      #0b5cad;
    --accent-2:    #08447f;
    --on-accent:   #ffffff;
    --tool:        #9a4700;
    --tool-bg:     rgba(154,71,0,.07);
    --tool-border: rgba(154,71,0,.30);
    --code-bg:     #eceef1;
    --code-fg:     #8a3d00;
    --success:     #1a7f37;
    --error:       #cf222e;
    --diff-add:    #1a7f37;
    --diff-del:    #cf222e;
    --link:        #0954b0;
    --user-bubble-text: #ffffff;
  }

  /* ─── Reset & base ────────────────────────────────────── */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #app {
    display: flex; flex-direction: column;
    position: fixed; inset: 0;
    height: 100vh; height: 100dvh;
    transition: right .25s cubic-bezier(.4,0,.2,1), left .25s cubic-bezier(.4,0,.2,1);
  }
  #app.viewer-open { right: var(--viewer-w, 520px); }
  #app.git-open { right: var(--git-w, 360px); }
  #app.sidebar-pinned { left: var(--sidebar-w, 272px); }

  /* ─── Header ──────────────────────────────────────────── */
  #header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    padding-top: env(safe-area-inset-top);
    height: calc(48px + env(safe-area-inset-top));
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #btn-menu {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 6px; border-radius: 3px;
    display: flex; align-items: center; flex: 0 0 auto;
    font-family: inherit; transition: background .12s, color .12s;
  }
  #btn-menu:hover { background: var(--bg-3); color: var(--text); }
  #btn-menu:active { background: var(--border); }
  #header-title {
    flex: 1; min-width: 0;
    font-weight: 500; font-size: 13px; color: var(--text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #header-cwd {
    font-size: 11px; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 38%;
    background: none; border: none; cursor: pointer; padding: 2px 5px;
    border-radius: 3px; transition: background .12s, color .12s;
    text-align: left;
  }
  #header-cwd:hover { background: var(--bg-3); color: var(--text); }
  #theme-toggle {
    background: none; border: none; color: var(--muted);
    width: 32px; height: 32px; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 0; border-radius: 3px;
    transition: background .12s, color .12s;
  }
  #theme-toggle:hover { background: var(--bg-3); color: var(--text); }
  #btn-terminal {
    background: none; border: none; color: var(--muted);
    width: 32px; height: 32px; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 0; border-radius: 3px;
    transition: background .12s, color .12s;
  }
  #btn-terminal:hover { background: var(--bg-3); color: var(--text); }
  #btn-terminal.active { color: var(--accent); }
  #btn-git {
    background: none; border: none; color: var(--muted);
    width: 32px; height: 32px; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 0; border-radius: 3px;
    transition: background .12s, color .12s;
  }
  #btn-git:hover { background: var(--bg-3); color: var(--text); }
  #btn-git.active { color: var(--accent); }
  #conn-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
    transition: background .3s;
  }
  #conn-dot.connected { background: var(--success); }
  #conn-dot.disconnected { background: var(--error); }

  /* ─── Messages ────────────────────────────────────────── */
  #messages {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-user {
    align-self: flex-end; max-width: 80%;
    background: var(--accent); color: var(--user-bubble-text);
    padding: 9px 14px; border-radius: 3px;
    font-size: 14px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg-assistant {
    align-self: flex-start; max-width: 96%;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg-text {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 16px;
    word-wrap: break-word;
    font-size: 14px;
    line-height: 1.65;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .msg-text > *:first-child { margin-top: 0; }
  .msg-text > *:last-child { margin-bottom: 0; }
  .msg-text p { margin: 0 0 10px 0; }
  .msg-text h1, .msg-text h2, .msg-text h3, .msg-text h4 {
    margin: 16px 0 6px 0; line-height: 1.2;
    font-weight: 600; color: var(--text-strong);
  }
  .msg-text h1 { font-size: 18px; }
  .msg-text h2 { font-size: 16px; }
  .msg-text h3 {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; font-weight: 500;
  }
  .msg-text h4 { font-size: 13px; }
  .msg-text strong { color: var(--text-strong); font-weight: 600; }
  .msg-text em { color: var(--text-em); font-style: italic; }
  .msg-text ul, .msg-text ol { margin: 6px 0 10px 0; padding-left: 20px; }
  .msg-text li { margin: 3px 0; }
  .msg-text li > p { margin: 0; }
  .msg-text code {
    background: var(--code-bg);
    padding: 1px 5px; border-radius: 2px;
    font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--code-fg);
  }
  .msg-text pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 11px 13px; border-radius: 3px;
    margin: 10px 0; overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px; line-height: 1.55;
    -webkit-overflow-scrolling: touch;
  }
  .msg-text pre code { background: none; padding: 0; color: var(--text); font-size: inherit; }
  .msg-text hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .msg-text blockquote {
    margin: 10px 0; padding: 4px 14px;
    border-left: 2px solid var(--border); color: var(--muted);
  }
  .msg-text a { color: var(--link); text-decoration: none; }
  .msg-text a:hover { text-decoration: underline; }
  .msg-text table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .msg-text th, .msg-text td { border: 1px solid var(--border); padding: 6px 10px; }
  .msg-text th { background: var(--bg-3); font-weight: 500; text-align: left; }
  .msg-text::-webkit-scrollbar { height: 6px; }
  .msg-text::-webkit-scrollbar-track { background: transparent; }
  .msg-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ─── Tool cards ──────────────────────────────────────── */
  .tool {
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-left: 2px solid var(--tool);
    border-radius: 3px;
    overflow: hidden;
  }
  .tool-header {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .tool.expanded .tool-header { border-bottom: 1px solid var(--tool-border); }
  .tool-icon {
    flex: 0 0 auto; display: inline-flex; align-items: center;
    color: var(--tool);
  }
  .tool-icon svg { display: block; }
  .msg-thinking {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 14px; font-size: 13px;
    color: var(--muted); font-style: italic;
    border-left: 2px solid var(--border);
  }
  .msg-thinking .thinking-icon {
    flex: 0 0 auto; color: var(--accent);
    margin-top: 3px;
  }
  .msg-thinking .thinking-icon svg { display: block; }
  .msg-thinking .thinking-text { flex: 1; min-width: 0; }
  .tool-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 500;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--tool); flex: 0 0 auto;
  }
  .tool-summary {
    color: var(--muted); flex: 1; min-width: 0;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tool-status {
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    color: var(--muted); flex: 0 0 auto; letter-spacing: .03em;
    display: inline-flex; align-items: center;
  }
  .tool-status svg { display: block; }
  .tool-status.running { color: var(--tool); }
  .tool-status.done { color: var(--success); }
  .tool-status.error { color: var(--error); }
  .tool-chevron { transition: transform .15s; color: var(--muted); font-size: 10px; }
  .tool.expanded .tool-chevron { transform: rotate(90deg); }
  .tool-body { display: none; padding: 10px 12px; }
  .tool.expanded .tool-body { display: block; }
  .tool-section { margin-bottom: 10px; }
  .tool-section:last-child { margin-bottom: 0; }
  .tool-section-label {
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 5px; font-weight: 500;
  }
  .tool pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 8px 10px; border-radius: 2px;
    margin: 0; overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; line-height: 1.5;
    white-space: pre; max-height: 360px; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tool pre.wrap { white-space: pre-wrap; word-wrap: break-word; }
  .diff-add { color: var(--diff-add); }
  .diff-del { color: var(--diff-del); }

  /* ─── Spinner ─────────────────────────────────────────── */
  .spinner {
    display: inline-block;
    width: 11px; height: 11px;
    border: 2px solid var(--border); border-top-color: var(--tool);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Turn summary ────────────────────────────────────── */
  .turn-summary {
    align-self: center; color: var(--muted);
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg-2);
    letter-spacing: .03em;
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 3px 9px; max-width: 92%;
  }
  .turn-summary .ts-item { white-space: nowrap; display: inline-flex; gap: 3px; align-items: baseline; }
  .turn-summary .ts-item b { color: var(--text-em); font-weight: 600; }
  .turn-summary .ts-cost { color: var(--accent); font-weight: 600; }
  .turn-summary .ts-cost b { color: var(--accent); }

  /* ─── Changed-files card (end of turn) ────────────────── */
  .changes-card {
    align-self: stretch; max-width: 92%; width: 100%;
    margin: 2px auto 0;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg-2); overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
  }
  .changes-card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; font-size: 12px; color: var(--text);
  }
  .changes-card-head .cc-count { font-weight: 600; color: var(--text-strong); }
  .changes-card-head .cc-add { color: #2ea043; font-weight: 600; }
  .changes-card-head .cc-del { color: #f85149; font-weight: 600; }
  .changes-card-list { border-top: 1px solid var(--border); }
  .cc-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
  }
  .cc-row:last-child { border-bottom: none; }
  .cc-row:hover { background: var(--bg-3); }
  .cc-name {
    flex: 1; min-width: 0; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl; text-align: left; color: var(--muted);
  }
  .cc-name bdi { direction: ltr; unicode-bidi: bidi-override; }
  .cc-name b { color: var(--text-strong); font-weight: 600; }
  .cc-stat { flex-shrink: 0; font-size: 11px; }
  .cc-stat .cc-add { color: #2ea043; }
  .cc-stat .cc-del { color: #f85149; }
  .cc-chevron { flex-shrink: 0; color: var(--muted); display: flex; }
  .cc-chevron svg { transition: transform .15s; }
  .cc-diff {
    display: none; overflow-x: auto;
    background: var(--bg); border-bottom: 1px solid var(--border);
    font-size: 11px; line-height: 1.5;
  }
  .cc-row.expanded + .cc-diff { display: block; }
  .cc-diff .git-diff-line { white-space: pre; padding: 0 12px; }
  .cc-diff-note { padding: 7px 12px; color: var(--muted); font-size: 11px; }

  /* ─── Empty state ─────────────────────────────────────── */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center; gap: 6px;
  }
  .empty-state-label {
    font-size: 11px; font-weight: 500; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    font-family: 'IBM Plex Mono', monospace;
  }
  .empty-state-hint {
    font-size: 13px; color: var(--muted);
  }

  /* ─── Thinking indicator (between user send & first response) ─── */
  .thinking-indicator {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    max-width: 95%;
  }
  .thinking-dots {
    display: inline-flex; gap: 4px; flex: 0 0 auto;
  }
  .thinking-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: thinking-pulse 1.4s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes thinking-pulse {
    0%, 60%, 100% { opacity: 0.2; transform: scale(0.85); }
    30%          { opacity: 1;   transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .thinking-dots span { animation: none; opacity: 0.6; }
  }

  /* ─── Composer ────────────────────────────────────────── */
  #composer {
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .composer-row {
    display: flex; align-items: flex-end; gap: 8px;
  }
  #image-previews {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 0 2px;
  }
  #image-previews:empty { display: none; }
  .image-preview {
    position: relative; width: 56px; height: 56px;
    border-radius: 3px; overflow: hidden;
    border: 1px solid var(--border); background: var(--bg-2);
    flex: 0 0 auto;
  }
  .image-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .image-preview .remove {
    position: absolute; top: 2px; right: 2px;
    background: rgba(0,0,0,.75); color: #fff;
    width: 18px; height: 18px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1;
  }
  .image-preview .remove:hover { background: var(--error); }
  #btn-attach {
    background: var(--bg-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 3px;
    width: 40px; height: 40px; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 0; font-family: inherit;
    transition: color .12s, border-color .12s;
  }
  #btn-attach:hover { color: var(--text); border-color: var(--text-em); }
  #btn-attach:disabled { opacity: 0.4; cursor: not-allowed; }
  #btn-attach svg { display: block; }

  /* Images inside user message bubble */
  .msg-user-images {
    display: grid; gap: 4px; margin-bottom: 6px;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  }
  .msg-user-images:empty { display: none; }
  .msg-user-images img {
    width: 100%; max-height: 200px;
    object-fit: cover; border-radius: 3px;
    display: block; cursor: zoom-in;
    background: rgba(0,0,0,.2);
  }
  .msg-user-text { white-space: pre-wrap; word-wrap: break-word; }

  /* Lightbox for full image view */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    z-index: 200; display: none;
    align-items: center; justify-content: center;
    padding: 20px; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #input {
    flex: 1; resize: none;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px;
    padding: 9px 12px; font-size: 14px;
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 40px; max-height: 160px;
    line-height: 1.4; outline: none;
    transition: border-color .15s;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }
  #btn-send {
    background: var(--accent); color: var(--on-accent); border: none;
    width: 40px; height: 40px; border-radius: 3px;
    font-size: 15px; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    transition: background .12s;
  }
  #btn-send:hover:not(:disabled) { background: var(--accent-2); }
  #btn-send:disabled { background: var(--bg-3); color: var(--muted); cursor: not-allowed; }
  #btn-send.cancel { background: var(--error); }

  /* ─── Sidebar ─────────────────────────────────────────── */
  #sidebar-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 50; display: none;
  }
  #sidebar-bg.open { display: block; }
  #sidebar {
    position: fixed; top: 0; left: -300px; bottom: 0;
    width: 272px; max-width: 84vw;
    background: var(--bg); border-right: 1px solid var(--border);
    z-index: 51;
    transition: left .22s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #sidebar.open { left: 0; }
  .sidebar-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 12px;
    height: 48px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 10px; font-weight: 500; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    font-family: 'IBM Plex Mono', monospace;
  }
  #btn-close-sidebar {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px 6px; border-radius: 2px;
    transition: background .12s, color .12s;
  }
  #btn-close-sidebar:hover { background: var(--bg-3); color: var(--text); }
  #btn-sidebar-pin {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); cursor: pointer;
    padding: 3px 5px; margin-right: 4px;
    display: none; align-items: center;
    transition: background .12s, color .12s, border-color .12s;
  }
  #btn-sidebar-pin.visible { display: inline-flex; }
  #btn-sidebar-pin svg { display: block; }
  #btn-sidebar-pin:hover { background: var(--bg-3); color: var(--text); }
  #btn-sidebar-pin.pinned { color: var(--accent); border-color: var(--accent); }

  /* ─── Git panel (right) — mirrors #viewer: pushes layout, resizable ── */
  #git-panel {
    position: fixed; top: 0; right: calc(-1 * var(--gw, 360px)); bottom: 0;
    width: var(--gw, min(360px, 60vw));
    background: var(--bg); border-left: 1px solid var(--border);
    z-index: 44; display: flex; flex-direction: column;
    transition: right .25s cubic-bezier(.4,0,.2,1);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #git-panel.open { right: 0; }
  @media (max-width: 700px) {
    #git-panel { width: 100%; right: -100vw; }
    #git-panel.open { right: 0; }
    #app.git-open { right: 0; }
    #git-resize { display: none; }
  }
  #git-resize {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 6px; cursor: col-resize;
    background: transparent; transition: background .15s; z-index: 1;
  }
  #git-resize:hover, #git-resize.dragging { background: var(--accent); }
  .git-panel-header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .git-panel-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  .git-panel-row-bottom {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  .git-panel-header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .git-select {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-size: 12px;
    padding: 3px 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .git-select:focus {
    border-color: var(--accent);
    outline: none;
  }
  .git-view-toggles {
    display: flex;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .git-pill-btn {
    background: var(--bg);
    border: none;
    color: var(--muted);
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .git-pill-btn:hover:not(:disabled) {
    background: var(--bg-3);
    color: var(--text);
  }
  .git-pill-btn.active {
    background: var(--bg-3);
    color: var(--text);
    font-weight: 600;
  }
  .git-pill-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .git-panel-title {
    font-size: 11px; font-weight: 600; color: var(--text-strong);
    text-transform: uppercase; letter-spacing: .08em;
    font-family: 'IBM Plex Mono', monospace; flex: 1;
  }
  .git-panel-btn {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); cursor: pointer; padding: 3px 5px;
    display: inline-flex; align-items: center;
    transition: background .12s, color .12s, border-color .12s;
  }
  .git-panel-btn:hover { background: var(--bg-3); color: var(--text); }
  .git-panel-btn svg { display: block; }
  .git-panel-btn.spinning svg { animation: git-spin .8s linear infinite; }
  @keyframes git-spin { to { transform: rotate(360deg); } }
  #btn-close-git {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px 6px; border-radius: 2px;
    transition: background .12s, color .12s;
  }
  #btn-close-git:hover { background: var(--bg-3); color: var(--text); }
  #git-branch-row {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; font-size: 12px; color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
  }
  #git-branch-row svg { color: var(--muted); flex-shrink: 0; }
  #git-branch-name {
    font-weight: 600; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  #git-branch-cwd {
    color: var(--muted); font-size: 10px; margin-left: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 45%; text-align: right;
  }
  #git-body { flex: 1; overflow-y: auto; min-height: 0; }
  .git-empty {
    padding: 28px 16px; text-align: center; color: var(--muted);
    font-size: 12px; line-height: 1.6;
  }
  .git-file {
    border-bottom: 1px solid var(--border);
  }
  .git-file-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; cursor: pointer;
    transition: background .12s;
  }
  .git-file-row:hover { background: var(--bg-2); }
  .git-file-badge {
    flex-shrink: 0;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    border-radius: 3px;
    padding: 2px 5px;
    text-transform: uppercase;
  }
  .git-file-badge.badge-added {
    background: rgba(46, 160, 67, 0.15);
    color: #2ea043;
  }
  .git-file-badge.badge-modified {
    background: rgba(214, 166, 25, 0.15);
    color: #d6a619;
  }
  .git-file-badge.badge-deleted {
    background: rgba(248, 81, 73, 0.15);
    color: #f85149;
  }
  .git-file-name {
    flex: 1; min-width: 0; font-size: 12px; color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl; text-align: left;
  }
  .git-file-name bdi { direction: ltr; unicode-bidi: bidi-override; }
  .git-file-stat {
    flex-shrink: 0; font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .git-stat-add { color: #2ea043; }
  .git-stat-del { color: #f85149; }
  .git-staged-dot {
    flex-shrink: 0; width: 6px; height: 6px; border-radius: 50%;
    background: #2ea043;
  }
  .git-commit-area {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
  }
  .git-commit-input {
    width: 100%; box-sizing: border-box; min-height: 60px; max-height: 120px;
    resize: vertical; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; padding: 8px 10px; line-height: 1.4;
  }
  .git-commit-input::placeholder { color: var(--muted); }
  .git-commit-input:focus { border-color: var(--accent); outline: none; }
  .git-commit-actions {
    display: flex; gap: 6px; align-items: center;
  }
  .git-commit-btn {
    flex: 1; padding: 6px 12px; border: none; border-radius: 4px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    transition: background .12s, opacity .12s;
  }
  .git-commit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .git-btn-commit {
    background: var(--accent); color: var(--on-accent);
  }
  .git-btn-commit:hover:not(:disabled) { filter: brightness(1.1); }
  .git-btn-push {
    background: var(--bg-3); color: var(--text); border: 1px solid var(--border);
  }
  .git-btn-push:hover:not(:disabled) { background: var(--border); }
  .git-commit-status {
    font-size: 11px; line-height: 1.4; padding: 0 2px;
    max-height: 60px; overflow-y: auto; word-break: break-word;
  }
  .git-commit-status.success { color: var(--success); }
  .git-commit-status.error { color: var(--error); }
  .git-stage-cb {
    flex-shrink: 0; width: 14px; height: 14px; cursor: pointer;
    accent-color: var(--accent);
  }
  .git-stage-actions {
    display: flex; align-items: center; gap: 4px; margin-left: auto;
    padding-right: 2px;
  }
  .git-stage-btn {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); cursor: pointer; padding: 1px 4px;
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    transition: background .12s, color .12s;
  }
  .git-stage-btn:hover { background: var(--bg-3); color: var(--text); }
  .git-section-header {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .git-section-count {
    background: var(--bg-3); border-radius: 8px; padding: 1px 6px;
    font-size: 9px; min-width: 16px; text-align: center;
  }
  .git-diff {
    display: none; overflow-x: auto;
    background: var(--bg-2); border-top: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    line-height: 1.5;
  }
  .git-file.expanded .git-diff { display: block; }
  .git-diff-line {
    display: flex;
    align-items: stretch;
    width: 100%;
    border-bottom: 1px solid transparent;
  }
  .git-diff-line .ln-old, .git-diff-line .ln-new {
    width: 32px;
    min-width: 32px;
    text-align: right;
    padding-right: 6px;
    color: var(--muted);
    font-size: 9px;
    user-select: none;
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .git-diff-line .line-code {
    flex: 1;
    padding-left: 8px;
    white-space: pre-wrap;
    word-break: break-all;
    display: flex;
    align-items: center;
  }
  .git-diff-line.add { background: rgba(46,160,67,.1); }
  .git-diff-line.add .line-code { color: #56d364; }
  .git-diff-line.add .ln-old, .git-diff-line.add .ln-new { background: rgba(46,160,67,.05); }
  .git-diff-line.del { background: rgba(248,81,73,.1); }
  .git-diff-line.del .line-code { color: #f85149; }
  .git-diff-line.del .ln-old, .git-diff-line.del .ln-new { background: rgba(248,81,73,.05); }
  .git-diff-line.hunk { background: var(--bg-3); }
  .git-diff-line.hunk .line-code { color: #58a6ff; font-weight: 600; }
  .git-diff-line.meta { color: var(--muted); }
  .git-diff-line.meta .ln-old, .git-diff-line.meta .ln-new { background: transparent; }
  .git-diff-note { padding: 8px 12px; color: var(--muted); font-size: 11px; }
  .cwd-row {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .cwd-label {
    font-size: 10px; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase;
    letter-spacing: .07em; font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
  }
  .cwd-input-row { display: flex; gap: 6px; }
  #cwd-input {
    flex: 1; min-width: 0;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 6px 8px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; outline: none;
    transition: border-color .15s;
  }
  #cwd-input:focus { border-color: var(--accent); }
  #btn-browse {
    background: var(--bg-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 0 10px; cursor: pointer;
    display: flex; align-items: center;
    transition: background .12s, color .12s;
  }
  #btn-browse:hover { background: var(--bg-3); color: var(--text); }
  #model-select, #perm-select {
    width: 100%;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 7px 8px; font-size: 12.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    outline: none; cursor: pointer;
    transition: border-color .15s;
  }
  #model-select:focus, #perm-select:focus { border-color: var(--accent); }
  #perm-warn {
    font-size: 11px; color: var(--muted); margin-top: 6px;
    line-height: 1.45; font-family: 'IBM Plex Mono', monospace;
  }
  /* ─── Session controls (search + new) ──────────────────── */
  #session-controls {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .session-search-wrap {
    flex: 1; position: relative; display: flex; align-items: center;
  }
  .session-search-icon {
    position: absolute; left: 8px; color: var(--muted); pointer-events: none;
    display: flex; align-items: center;
  }
  #session-search {
    width: 100%; background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 8px 6px 28px;
    font-size: 12px; font-family: 'IBM Plex Sans', sans-serif;
    outline: none; transition: border-color .15s;
  }
  #session-search:focus { border-color: var(--accent); }
  #session-search::placeholder { color: var(--muted); }
  #btn-search-mode {
    position: absolute; right: 6px;
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 2px 4px; border-radius: 3px;
    display: flex; align-items: center;
    transition: color .15s, background .15s;
    flex-shrink: 0;
  }
  #btn-search-mode:hover { color: var(--text); background: var(--bg-3); }
  #btn-search-mode.active { color: var(--accent); }
  #session-search.content-mode { padding-right: 28px; }
  .session-snippet {
    font-size: 11px; color: var(--muted); margin-top: 3px;
    line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .session-snippet mark {
    background: transparent; color: var(--accent); font-weight: 600;
  }
  .search-loading {
    font-size: 11px; color: var(--muted);
    padding: 12px 14px; text-align: center;
  }
  #btn-new {
    background: var(--accent); color: var(--on-accent);
    border: none; border-radius: 4px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
    white-space: nowrap; flex-shrink: 0;
    transition: opacity .12s;
  }
  #btn-new:hover { opacity: 0.85; }
  #btn-new:active { opacity: 0.7; }

  /* ─── Settings panel (tab) ───────────────────────────────── */
  #settings-view {
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 0 16px;
  }
  .settings-section {
    padding: 14px 14px 0;
  }
  .settings-section-title {
    font-size: 9.5px; font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); font-weight: 600; margin-bottom: 8px;
  }
  .settings-card {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; margin-bottom: 8px;
  }
  .settings-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    min-height: 48px;
  }
  .settings-row:last-child { border-bottom: none; }
  /* Stacked variant: icon+label on top, full-width control below — keeps long
     option labels (e.g. "Claude Sonnet 4.6") readable in the narrow sidebar. */
  .settings-row.col { flex-direction: column; align-items: stretch; gap: 9px; }
  .settings-row-head { display: flex; align-items: center; gap: 10px; }
  .settings-row.col .settings-select { width: 100%; min-width: 0; }
  .settings-row-icon {
    color: var(--muted); flex-shrink: 0;
    display: flex; align-items: center;
  }
  .settings-row-label {
    flex: 1; font-size: 13px; color: var(--text);
    font-weight: 500;
  }
  .settings-row-sub {
    font-size: 11px; color: var(--muted); margin-top: 1px;
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100%;
  }
  .settings-row-label-wrap { flex: 1; min-width: 0; }
  .settings-select {
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 7px 10px; font-size: 12.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    outline: none; cursor: pointer; min-width: 130px;
    transition: border-color .15s; flex-shrink: 0;
  }
  .settings-select:focus { border-color: var(--accent); }
  .settings-cwd-btn {
    width: 100%; background: none; border: none; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; min-height: 56px; text-align: left;
    transition: background .12s;
  }
  .settings-cwd-btn:hover { background: var(--bg-3); }
  .settings-cwd-chevron { margin-left: auto; color: var(--muted); flex-shrink: 0; }
  .settings-action-btn {
    width: 100%; background: none; border: none; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; min-height: 48px; text-align: left;
    font-size: 13px; font-family: 'IBM Plex Sans', sans-serif;
    color: var(--text); transition: background .12s;
  }
  .settings-action-btn:hover { background: var(--bg-3); }
  .settings-action-btn.danger { color: var(--error); }
  .settings-action-btn.danger:hover { background: rgba(255,131,137,.06); }
  #perm-warn-card {
    font-size: 11px; color: var(--muted); padding: 8px 14px 10px;
    font-family: 'IBM Plex Mono', monospace; line-height: 1.45;
    display: none;
  }
  #perm-warn-card.visible { display: block; }

  /* ─── Engine popover ────────────────────────────────────── */
  #composer-meta { position: relative; }
  #engine-badge {
    cursor: pointer; font-family: inherit; font-size: inherit;
    appearance: none; -webkit-appearance: none;
  }
  #engine-badge:hover { opacity: 0.85; }
  .badge-chevron { margin-left: 2px; transition: transform .15s; flex-shrink: 0; }
  #engine-badge[aria-expanded="true"] .badge-chevron { transform: rotate(180deg); }
  #engine-popover {
    position: absolute; bottom: calc(100% + 6px); left: 0;
    min-width: 210px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.28);
    z-index: 200; overflow: visible;
  }
  #engine-popover[hidden] { display: none; }
  /* Scrollable model list when there are many models */
  #popover-model-section {
    max-height: min(55vh, 280px);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .popover-section { padding: 6px 0; }
  .popover-section + .popover-section { border-top: 1px solid var(--border); }
  .popover-label {
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .07em; padding: 4px 12px 3px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .popover-opt {
    display: flex; align-items: center; gap: 8px;
    width: 100%; background: none; border: none;
    color: var(--muted); cursor: pointer;
    padding: 7px 12px; font-size: 12.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    text-align: left; white-space: nowrap;
    transition: background .1s, color .1s;
  }
  .popover-opt:hover { background: var(--bg-2); color: var(--text); }
  .popover-opt.active { color: var(--text-strong); font-weight: 500; }
  .opt-dot {
    width: 7px; height: 7px; border-radius: 50%;
    border: 1.5px solid var(--muted); flex-shrink: 0;
    transition: background .1s, border-color .1s;
  }
  .popover-opt.active .opt-dot { background: var(--accent); border-color: var(--accent); }

  /* ─── Folder picker ───────────────────────────────────── */
  #picker-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    z-index: 100; display: none;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  #picker-bg.open { display: flex; }
  #picker {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; width: 100%; max-width: 480px;
    max-height: 80vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .picker-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; height: 44px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .picker-title { font-weight: 500; font-size: 13px; }
  #picker-close {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px 6px; border-radius: 2px;
    transition: background .12s, color .12s;
    opacity: 1;
  }
  #picker-close:hover { background: var(--bg-3); color: var(--text); }
  .picker-path {
    padding: 8px 14px; background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; color: var(--muted);
    word-break: break-all; flex-shrink: 0;
  }
   .picker-list {
     flex: 1; overflow-y: auto; padding: 6px;
     -webkit-overflow-scrolling: touch;
   }
   #picker-search {
     width: 100%;
     padding: 6px 9px;
     background: var(--bg);
     color: var(--text);
     border: 1px solid var(--border);
     border-radius: 2px;
     font-size: 12.5px;
     font-family: 'IBM Plex Mono', monospace;
     outline: none;
   }
   #picker-search:focus {
     border-color: var(--accent);
   }
   .picker-item {
    padding: 10px 12px; border-radius: 2px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
    transition: background .1s, color .1s;
    color: var(--text);
  }
  .picker-item:hover { background: var(--bg-2); }
  .picker-item:active { background: var(--bg-3); }
  .picker-item .picker-icon {
    color: var(--tool); flex: 0 0 auto; display: block;
  }
  .picker-item .picker-label {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .picker-item .picker-chevron {
    color: var(--muted); flex: 0 0 auto; opacity: 0.5;
    transition: opacity .1s, transform .1s;
  }
  .picker-item:hover .picker-chevron { opacity: 1; transform: translateX(2px); }
  .picker-item.up { color: var(--muted); }
  .picker-item.up .picker-icon { color: var(--muted); }
  .picker-item.up:hover { color: var(--text); }
  .picker-item.up:hover .picker-icon { color: var(--text); }
  .picker-empty {
    padding: 20px; text-align: center;
    color: var(--muted); font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .picker-footer {
    padding: 10px 14px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
    flex-shrink: 0;
  }
  .picker-footer button {
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
    transition: background .12s;
  }
  .picker-footer button:hover { background: var(--bg-3); }
  .picker-footer button.primary {
    background: var(--accent); color: var(--on-accent); border-color: var(--accent);
  }
  .picker-footer button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  #picker-create-row {
    display: none; padding: 8px 14px; gap: 6px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #picker-create-row.open { display: flex; }
  #picker-create-input {
    flex: 1; min-width: 0;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 2px;
    padding: 6px 9px; font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace; outline: none;
  }
  #picker-create-input::placeholder { color: var(--muted); }
  #picker-newfolder {
    margin-right: auto;
  }

  /* ─── Session list ────────────────────────────────────── */
  .sidebar-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    flex-shrink: 0; padding: 0 8px; gap: 2px;
  }
  .sidebar-tab {
    flex: 1; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer; padding: 9px 4px 7px;
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase; letter-spacing: .08em; font-weight: 500;
    transition: color .12s, border-color .12s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .sidebar-tab svg { display: block; }
  .sidebar-tab .sidebar-tab-label { line-height: 1; }
  .sidebar-tab:hover { color: var(--text); }
  .sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .sidebar-view { display: none; flex-direction: column; }
  .sidebar-view.active { display: flex; flex: 1; overflow: hidden; min-height: 0; }
  .session-list {
    flex: 1; overflow-y: auto; padding: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .session-item {
    padding: 8px 10px; border-radius: 2px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 2px;
    transition: background .1s;
  }
  .session-item:hover { background: var(--bg-2); }
  .session-item.active { background: var(--bg-3); }
  .session-text { flex: 1; min-width: 0; }
  .session-title-row {
    font-size: 13px; font-weight: 400; color: var(--text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session-weight {
    margin-top: 3px; font-size: 10.5px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted); letter-spacing: .02em;
  }
  .session-weight.medium { color: var(--tool); }
  .session-weight.heavy  { color: var(--error); }
  .session-meta {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .session-action {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 6px; font-size: 0;
    opacity: 0.7; border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: opacity .12s, background .12s, color .12s;
    flex: 0 0 auto;
  }
  .session-action svg { display: block; }
  .session-item:hover .session-action,
  .session-item.active .session-action { opacity: 1; }
  .session-action:hover { background: var(--bg-3); opacity: 1; }
  .session-action.delete:hover { color: var(--error); }
  .session-action.rename:hover { color: var(--accent); }

  /* ─── Node chips ──────────────────────────────────────── */
  #node-row { display: none; }
  .node-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .node-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-2); color: var(--muted);
    font-size: 11.5px; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    transition: background .12s, color .12s, border-color .12s;
    white-space: nowrap; line-height: 1;
  }
  .node-chip:hover { background: var(--bg-3); color: var(--text); }
  .node-chip.active {
    background: var(--accent); color: var(--on-accent);
    border-color: var(--accent);
  }
  .node-chip.active:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .node-chip.active { cursor: default; }
  .node-chip.connecting { opacity: 0.65; pointer-events: none; }
  .node-chip .ndot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
  }
  .node-chip.active .ndot { background: rgba(255,255,255,.75); }
  #node-badge {
    display: none;
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    color: var(--accent);
    background: rgba(15,98,254,.1);
    border: 1px solid rgba(15,98,254,.22);
    padding: 2px 8px; border-radius: 10px;
    white-space: nowrap; flex: 0 0 auto;
    letter-spacing: .03em;
  }

  /* ─── File list ───────────────────────────────────────── */
  .file-path-row {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .file-path-label {
    font-size: 10px; color: var(--muted); margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: .07em; font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
  }
  .file-path-value {
    font-size: 11px; color: var(--text-em);
    font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-list {
    flex: 1; overflow-y: auto; padding: 4px 6px;
    -webkit-overflow-scrolling: touch;
  }
  .file-item {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px; border-radius: 2px; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    transition: background .1s;
  }
  .file-item:hover { background: var(--bg-2); }
  .file-item:active { background: var(--bg-3); }
  .file-item .fi-icon {
    flex: 0 0 auto; display: flex; align-items: center;
    color: var(--muted);
  }
  .file-item.dir .fi-icon { color: var(--tool); }
  .file-item .fi-name {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-item .fi-size {
    flex: 0 0 auto; font-size: 10px; color: var(--muted); white-space: nowrap;
  }
  .file-item .fi-dl {
    flex: 0 0 auto; display: none; background: none; border: none;
    color: var(--muted); cursor: pointer; padding: 2px; border-radius: 2px;
    font-size: 0; line-height: 1;
  }
  .file-item .fi-dl svg { display: block; }
  .file-item:hover .fi-dl { display: block; }
  .file-item .fi-dl:hover { background: var(--bg-3); color: var(--accent); }
  .file-empty {
    padding: 20px; text-align: center; color: var(--muted);
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
  }
   .file-loading {
     padding: 20px; text-align: center; display: flex;
     align-items: center; justify-content: center; gap: 8px;
     color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace;
   }

   /* File creation & rename */
   #btn-newfile {
     background: var(--bg-2); color: var(--muted);
     border: 1px solid var(--border); border-radius: 2px;
     padding: 4px 9px; font-size: 12.5px; cursor: pointer;
     font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
     margin-left: 8px; white-space: nowrap;
     transition: background .12s, color .12s;
   }
   #btn-newfile:hover { background: var(--bg-3); color: var(--text); }

   .file-create-row {
     display: flex; gap: 6px; padding: 8px 10px;
     background: var(--bg-2); border-bottom: 1px solid var(--border);
   }
   .file-create-row input {
     flex: 1; min-width: 0;
     background: var(--bg); color: var(--text);
     border: 1px solid var(--border); border-radius: 2px;
     padding: 6px 9px; font-size: 12.5px;
     font-family: 'IBM Plex Mono', monospace; outline: none;
   }
   .file-create-row input:focus { border-color: var(--accent); }
   .file-create-row button {
     background: var(--bg-2); color: var(--text);
     border: 1px solid var(--border); border-radius: 2px;
     padding: 7px 14px; font-size: 13px; cursor: pointer;
     font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
     transition: background .12s;
   }
   .file-create-row button.primary {
     background: var(--accent); color: var(--on-accent); border-color: var(--accent);
   }
   .file-create-row button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }

   .file-rename-row {
     display: flex; gap: 6px; padding: 6px 8px;
     background: var(--bg-2);
   }
   .file-rename-row input {
     flex: 1; min-width: 0;
     background: var(--bg); color: var(--text);
     border: 1px solid var(--accent); border-radius: 2px;
     padding: 6px 9px; font-size: 12.5px;
     font-family: 'IBM Plex Mono', monospace; outline: none;
   }
   .file-rename-row input:focus { border-color: var(--accent); }
   .file-rename-row button {
     background: var(--bg-2); color: var(--text);
     border: 1px solid var(--border); border-radius: 2px;
     padding: 6px 12px; font-size: 12.5px; cursor: pointer;
     font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
     transition: background .12s;
   }
   .file-rename-row button.primary {
     background: var(--accent); color: var(--on-accent); border-color: var(--accent);
   }
   .file-rename-row button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }

   .file-item .fi-rename {
     flex: 0 0 auto; display: none; background: none; border: none;
     color: var(--muted); cursor: pointer; padding: 2px; border-radius: 2px;
     font-size: 0; line-height: 1;
   }
   .file-item:hover .fi-rename { display: block; }
   .file-item .fi-rename:hover { background: var(--bg-3); color: var(--accent); }

   /* On touch devices (no hover), keep them clearly visible */
  @media (pointer: coarse) {
    .session-action { opacity: 0.85; }
  }

  /* ─── Terminal panel ─────────────────────────────────── */
  #terminal-panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: var(--term-h, 45vh); min-height: 120px;
    background: var(--code-bg, #04101e);
    border-top: 1px solid var(--border);
    z-index: 60; display: none; flex-direction: column;
    box-shadow: 0 -8px 24px rgba(0,0,0,.35);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #terminal-panel.open { display: flex; }
  #terminal-resize {
    position: absolute; top: 0; left: 0; right: 0; height: 6px;
    cursor: ns-resize; z-index: 2;
  }
  #terminal-resize:hover { background: var(--accent); opacity: .5; }
  #terminal-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; flex-shrink: 0;
    background: var(--bg-2); border-bottom: 1px solid var(--border);
    font-size: 12px; user-select: none;
  }
  #terminal-title {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-strong); font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
  }
  #terminal-status { color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
  .terminal-bar-btn {
    background: none; border: 1px solid var(--border); color: var(--text-em);
    cursor: pointer; padding: 3px 9px; border-radius: 4px;
    font: inherit; font-size: 11.5px; transition: background .12s, color .12s, border-color .12s;
  }
  .terminal-bar-btn:hover { background: var(--bg-3); color: var(--text); border-color: var(--accent); }
  #terminal-close-btn { font-size: 15px; line-height: 1; padding: 2px 8px; }
  #terminal-host { flex: 1; min-height: 0; padding: 6px 8px; overflow: hidden; }
  #terminal-host .xterm { height: 100%; }

  /* ─── File viewer ────────────────────────────────────── */
  #viewer {
    position: fixed; top: 0; right: calc(-1 * var(--vw, 540px)); bottom: 0;
    width: var(--vw, min(520px, 52vw));
    background: var(--bg); border-left: 1px solid var(--border);
    z-index: 44; display: flex; flex-direction: column;
    transition: right .25s cubic-bezier(.4,0,.2,1);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #viewer.open { right: 0; }
  @media (max-width: 700px) {
    #viewer { width: 100%; right: -100vw; }
    #viewer.open { right: 0; }
    #app.viewer-open { right: 0; }
    #app.sidebar-pinned { left: 0; }
    #viewer-resize { display: none; }
  }
  #viewer.open { right: 0; }
  #viewer-header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; height: 48px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #viewer-filename {
    flex: 1; min-width: 0;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    color: var(--text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #viewer-raw-btn { /* now uses .viewer-toolbar-btn */ }
  #viewer-close {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px 6px; border-radius: 2px; flex: 0 0 auto;
    transition: background .12s, color .12s;
  }
  #viewer-close:hover { background: var(--bg-3); color: var(--text); }
  #viewer-body {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 20px 22px; font-size: 14px; line-height: 1.65;
    -webkit-overflow-scrolling: touch;
  }
  #viewer-body.md > *:first-child { margin-top: 0; }
  #viewer-body.md p { margin: 0 0 10px; }
  #viewer-body.md h1,#viewer-body.md h2,#viewer-body.md h3,#viewer-body.md h4 {
    margin: 18px 0 6px; font-weight: 600; color: var(--text-strong); line-height: 1.2;
  }
  #viewer-body.md h1 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  #viewer-body.md h2 { font-size: 16px; }
  #viewer-body.md h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  #viewer-body.md strong { color: var(--text-strong); font-weight: 600; }
  #viewer-body.md em { color: var(--text-em); font-style: italic; }
  #viewer-body.md code {
    background: var(--code-bg); padding: 1px 5px; border-radius: 2px;
    font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; color: var(--code-fg);
  }
  #viewer-body.md pre {
    background: var(--code-bg); border: 1px solid var(--border);
    padding: 11px 13px; border-radius: 3px; margin: 10px 0; overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.55;
  }
  #viewer-body.md pre code { background: none; padding: 0; color: var(--text); }
  #viewer-body.md ul,#viewer-body.md ol { margin: 6px 0 10px; padding-left: 20px; }
  #viewer-body.md li { margin: 3px 0; }
  #viewer-body.md blockquote { margin: 10px 0; padding: 4px 14px; border-left: 2px solid var(--border); color: var(--muted); }
  #viewer-body.md a { color: var(--link); text-decoration: none; }
  #viewer-body.md a:hover { text-decoration: underline; }
  #viewer-body.md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  #viewer-body.md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
  #viewer-body.md th,#viewer-body.md td { border: 1px solid var(--border); padding: 6px 10px; }
  #viewer-body.md th { background: var(--bg-3); font-weight: 500; text-align: left; }
  #viewer-body.raw {
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6;
    white-space: pre-wrap; word-wrap: break-word; color: var(--text);
  }
  #viewer-body.csv .csv-wrap { overflow-x: auto; }
  #viewer-body.csv table { border-collapse: collapse; font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; }
  #viewer-body.csv th {
    background: var(--bg-3); font-weight: 500;
    position: sticky; top: 0; z-index: 1;
  }
  #viewer-body.csv th,#viewer-body.csv td { border: 1px solid var(--border); padding: 5px 10px; white-space: nowrap; }
  #viewer-body.csv tr:nth-child(even) td { background: var(--bg-2); }
  #viewer-body.img {
    padding: 0; background: var(--bg-2);
    display: flex; align-items: center; justify-content: center;
  }
  #viewer-body.img img {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
  }
  #viewer-body.img.svg img { background: #fff; }
  #viewer-resize {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 6px; cursor: col-resize;
    background: transparent; transition: background .15s; z-index: 1;
  }
  #viewer-resize:hover, #viewer-resize.dragging { background: var(--accent); }
  #btn-pin {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); cursor: pointer;
    padding: 3px 7px; font-size: 13px;
    transition: background .12s, color .12s; line-height: 1; flex: 0 0 auto;
  }
  #btn-pin:hover { background: var(--bg-3); color: var(--text); }
  #btn-pin.pinned { color: var(--accent); border-color: var(--accent); }

  /* ─── Viewer toolbar buttons ──────────────────────────── */
  .viewer-toolbar-btn {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); cursor: pointer; padding: 3px 8px;
    font-size: 11.5px; font-family: 'IBM Plex Sans', sans-serif;
    transition: background .12s, color .12s, border-color .12s; line-height: 1.4; flex: 0 0 auto; white-space: nowrap;
  }
  .viewer-toolbar-btn:hover { background: var(--bg-3); color: var(--text); }
  .viewer-toolbar-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(0,0,0,.04); }
  .viewer-toolbar-btn.danger { color: var(--error); border-color: var(--error); }
  .viewer-toolbar-btn.primary { color: var(--accent); border-color: var(--accent); }
  .viewer-toolbar-btn.primary:hover { background: var(--accent); color: var(--on-accent); }

  /* ─── Viewer edit mode ────────────────────────────────── */
  #viewer-editor {
    flex: 1; width: 100%; min-height: 0;
    background: var(--bg); color: var(--text);
    border: none; outline: none; resize: none;
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6;
    padding: 14px 16px;
    tab-size: 2;
  }
  #viewer-editor:focus { background: var(--bg-2); }
  #viewer-body.editing { display: none; }

  /* ─── Viewer HTML preview ─────────────────────────────── */
  #viewer-iframe {
    flex: 1; width: 100%; border: none; background: #fff;
  }

  /* ─── Session running indicator ──────────────────────── */
  @keyframes pulse-dot {
    0%,100% { opacity: 1; } 50% { opacity: 0.3; }
  }
  .session-running-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--success);
    flex-shrink: 0; margin-right: 4px;
    animation: pulse-dot 1.4s ease-in-out infinite;
  }
  .session-title-row { display: flex; align-items: center; gap: 0; }

  /* ─── File manager hidden toggle ─────────────────────── */
  #btn-show-hidden {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); cursor: pointer; padding: 2px 7px; font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    transition: color .12s, border-color .12s; flex-shrink: 0;
  }
  #btn-show-hidden:hover { color: var(--text); }
  #btn-show-hidden.active { color: var(--accent); border-color: var(--accent); }

  .msg-text code.file-link {
    cursor: pointer;
    text-decoration: underline; text-decoration-style: dotted;
    text-decoration-color: var(--tool);
  }
  .msg-text code.file-link:hover { background: var(--tool-bg); }

  .tool-view-btn {
    font-size: 10.5px; font-family: 'IBM Plex Mono', monospace;
    color: var(--accent); background: rgba(15,98,254,.08);
    border: 1px solid rgba(15,98,254,.2); border-radius: 2px;
    padding: 2px 7px; cursor: pointer; flex: 0 0 auto;
    transition: background .12s; white-space: nowrap; line-height: 1.4;
  }
  .tool-view-btn:hover { background: rgba(15,98,254,.18); }

  /* ─── Reduced motion ──────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ─── Engine indicator badge ─────────────────────────── */
  #composer-meta {
    display: flex; align-items: center; gap: 6px;
    min-height: 20px;
  }
  .engine-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--bg-2);
    flex: 0 0 auto;
    max-width: 100%;
    overflow: hidden;
  }
  .engine-badge.claude { border-color: var(--accent); color: var(--accent); }
  .engine-badge.qwen { border-color: #3b82f6; color: #3b82f6; }
  .engine-badge.codex { border-color: #10a37f; color: #10a37f; } /* OpenAI green */
  .engine-badge.kilo { border-color: #f59e0b; color: #f59e0b; } /* amber */
  .engine-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .engine-label { text-transform: capitalize; white-space: nowrap; }
  .engine-model { opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .engine-model::before { content: '· '; }
  @media (max-width: 480px) {
    .engine-model { max-width: 120px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button id="btn-menu" type="button" aria-label="Open menu">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
        <rect y="0" width="16" height="1.5" rx="0.75"/>
        <rect y="5.25" width="16" height="1.5" rx="0.75"/>
        <rect y="10.5" width="16" height="1.5" rx="0.75"/>
      </svg>
    </button>
    <div id="header-title">New chat</div>
    <button id="header-cwd" type="button" title="Change working directory" aria-label="Working directory"></button>
    <div id="node-badge"></div>
    <button id="btn-terminal" type="button" title="Terminal" aria-label="Open terminal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
    </button>
    <button id="btn-git" type="button" title="Git" aria-label="Open git panel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
    </button>
    <button id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
      <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <div id="conn-dot" title="Connection status"></div>
  </div>

  <div id="messages">
    <div class="empty-state">
      <div class="empty-state-label">New conversation</div>
      <div class="empty-state-hint">Type a message below to begin.</div>
    </div>
  </div>

  <div id="composer">
    <div id="composer-meta">
      <button id="engine-badge" class="engine-badge claude" title="Click to change engine or model" aria-expanded="false" type="button">
        <span class="engine-dot"></span>
        <span class="engine-label">Claude Code</span>
        <span class="engine-model" id="engine-model-label">Claude Sonnet 4.6</span>
        <svg class="badge-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 1l4 4 4-4"/>
        </svg>
      </button>
      <div id="engine-popover" hidden>
        <div class="popover-section">
          <div class="popover-label">Engine</div>
          <button class="popover-opt active" data-engine="claude" type="button">
            <span class="opt-dot"></span>Claude Code
          </button>
          <button class="popover-opt" data-engine="qwen" type="button">
            <span class="opt-dot"></span>Qwen Code
          </button>
          <button class="popover-opt" data-engine="codex" type="button">
            <span class="opt-dot"></span>Codex
          </button>
          <button class="popover-opt" data-engine="kilo" type="button">
            <span class="opt-dot"></span>Kilo Code
          </button>
        </div>
        <div class="popover-section" id="popover-model-section">
          <div class="popover-label">Model</div>
        </div>
      </div>
    </div>
    <div id="image-previews"></div>
    <div class="composer-row">
      <button id="btn-attach" type="button" title="Attach image" aria-label="Attach image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input type="file" id="file-input" accept="image/*" multiple hidden />
      <textarea id="input" rows="1" placeholder="Type a message…"></textarea>
      <button id="btn-send" type="button" disabled>➤</button>
    </div>
  </div>

  <div id="lightbox"><img alt="" /></div>
</div>

<div id="picker-bg">
  <div id="picker">
    <div class="picker-header">
      <div class="picker-title">Choose folder</div>
      <button id="picker-close" type="button">×</button>
    </div>
     <div class="picker-path" id="picker-path"></div>
     <div class="picker-search" style="padding:8px 10px; border-bottom:1px solid var(--border);">
       <input type="text" id="picker-search" placeholder="Search folders…" />
     </div>
     <div class="picker-list" id="picker-list"></div>
     <div id="picker-create-row">
      <input id="picker-create-input" type="text" placeholder="Folder name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button id="picker-create-confirm" type="button" class="primary">Create</button>
      <button id="picker-create-cancel" type="button">Cancel</button>
    </div>
    <div class="picker-footer">
      <button id="picker-newfolder" type="button">+ New Folder</button>
      <button id="picker-cancel" type="button">Cancel</button>
      <button id="picker-select" type="button" class="primary">Select this folder</button>
    </div>
  </div>
</div>
<div id="sidebar-bg"></div>
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">Sessions</div>
    <button id="btn-sidebar-pin" type="button" title="Pin sidebar"></button>
    <button id="btn-close-sidebar" type="button">×</button>
  </div>
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" data-tab="session" title="Sessions">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="sidebar-tab-label">Sessions</span>
    </button>
    <button class="sidebar-tab" data-tab="file" title="Files">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
      </svg>
      <span class="sidebar-tab-label">Files</span>
    </button>
    <button class="sidebar-tab" data-tab="settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <span class="sidebar-tab-label">Settings</span>
    </button>
  </div>
  <div id="session-view" class="sidebar-view active">
    <!-- Search + New -->
    <div id="session-controls">
      <div class="session-search-wrap">
        <span class="session-search-icon" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
        <input id="session-search" type="text" placeholder="Search sessions…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search sessions" />
        <button id="btn-search-mode" type="button" title="Toggle: search inside conversations" aria-pressed="false">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
          </svg>
        </button>
      </div>
      <button id="btn-new" type="button">+ New</button>
    </div>

    <!-- Node row (hidden unless multi-node) -->
    <div id="node-row" class="cwd-row">
      <div class="cwd-label">Machine</div>
      <div id="node-list" class="node-chips"></div>
    </div>

    <!-- Session list — takes all remaining space -->
    <div class="session-list" id="session-list"></div>

    <!-- Collapsible settings -->
  </div>
  <div id="file-view" class="sidebar-view">
    <div class="file-path-row">
      <div class="file-path-label">Current directory</div>
      <button type="button" id="btn-show-hidden" title="Show hidden files">.*</button>
      <button type="button" id="btn-newfile" class="file-action-btn" title="Create new file">+ New</button>
      <div class="file-path-value" id="file-path-text"></div>
    </div>
    <div class="file-create-row" id="file-create-row" style="display:none;">
      <input type="text" id="file-create-input" placeholder="Filename" />
      <button type="button" id="file-create-confirm" class="primary">Create</button>
      <button type="button" id="file-create-cancel">Cancel</button>
    </div>
    <div class="file-list" id="file-list"></div>
  </div>
  <div id="settings-view" class="sidebar-view">
    <!-- Workspace -->
    <div class="settings-section">
      <div class="settings-section-title">Workspace</div>
      <div class="settings-card">
        <button class="settings-cwd-btn" id="btn-cwd-pick" type="button" title="Change working directory">
          <span class="settings-row-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
          </span>
          <span class="settings-row-label-wrap">
            <span class="settings-row-label">Working directory</span>
            <span class="settings-row-sub" id="settings-cwd-display">—</span>
          </span>
          <svg class="settings-cwd-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <!-- hidden input kept for compat with existing JS that reads/writes cwdInput.value -->
        <input id="cwd-input" type="text" style="display:none" autocomplete="off" />
        <button id="btn-browse" type="button" style="display:none"></button>
      </div>
    </div>

    <!-- Agent -->
    <div class="settings-section">
      <div class="settings-section-title">Agent</div>
      <div class="settings-card">
        <div class="settings-row col">
          <span class="settings-row-head">
            <span class="settings-row-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </span>
            <span class="settings-row-label">Engine</span>
          </span>
          <select id="engine-select" class="settings-select">
            <option value="claude">Claude Code</option>
            <option value="qwen">Qwen Code</option>
            <option value="codex">Codex</option>
            <option value="kilo">Kilo Code</option>
          </select>
        </div>
        <div class="settings-row col">
          <span class="settings-row-head">
