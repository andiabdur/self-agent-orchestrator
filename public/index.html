  const ICON_FOLDER = '<svg class="picker-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>';
  const ICON_UP = '<svg class="picker-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>';
  const ICON_CHEVRON = '<svg class="picker-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

   async function pickerLoad(p) {
     picker.search.value = '';
     picker.list.innerHTML = '<div class="picker-empty">Loading…</div>';
     try {
      const res = await fetch('/api/dirs?path=' + encodeURIComponent(p || ''));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');
      picker.currentPath = data.path;
      picker.path.textContent = data.path;
      picker.list.innerHTML = '';
      if (data.parent) {
        const up = document.createElement('div');
        up.className = 'picker-item up';
        up.innerHTML = ICON_UP + '<span class="picker-label">Parent directory</span>';
        up.addEventListener('click', () => pickerLoad(data.parent));
        picker.list.appendChild(up);
      }
      if (!data.entries.length) {
        const e = document.createElement('div');
        e.className = 'picker-empty';
        e.textContent = '(no subfolders)';
        picker.list.appendChild(e);
      }
      for (const name of data.entries) {
        const it = document.createElement('div');
        it.className = 'picker-item';
        const label = document.createElement('span');
        label.className = 'picker-label';
        label.textContent = name;
        it.innerHTML = ICON_FOLDER;
        it.appendChild(label);
        it.insertAdjacentHTML('beforeend', ICON_CHEVRON);
        it.addEventListener('click', () => {
          const next = data.path.endsWith('/') ? data.path + name : data.path + '/' + name;
          pickerLoad(next);
        });
        picker.list.appendChild(it);
      }
    } catch (err) {
      picker.list.innerHTML = '<div class="picker-empty" style="color:var(--error);">' + escapeHtml(err.message) + '</div>';
     }
   }

   function filterPicker() {
     const q = picker.search.value.trim().toLowerCase();
     const items = picker.list.querySelectorAll('.picker-item');
     items.forEach(item => {
       if (item.classList.contains('up')) {
         item.style.display = '';
         return;
       }
       const label = item.querySelector('.picker-label');
       if (!label) return;
       if (label.textContent.toLowerCase().includes(q)) {
         item.style.display = '';
       } else {
         item.style.display = 'none';
       }
     });
   }

   function openPicker() {
     picker.bg.classList.add('open');
     picker.search.focus();

        state.contentSearchLoading = false;

    if (!btn) return;
    e.stopPropagation();
    const eng = btn.dataset.engine;
    if (eng === state.engine) { closePopover(); return; }
    state.engine = eng;
    els.engineSelect.value = eng;
    send({ type: 'set_engine', engine: eng });
    syncPopoverState();
  });
  // Close popover on outside click
  document.addEventListener('click', () => {
    if (!els.enginePopover.hidden) closePopover();
  });
  // Close popover on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !els.enginePopover.hidden) closePopover();
  });

  // ---------- Terminal (PTY over /term) ----------
  (function initTerminal() {
    const btn = document.getElementById('btn-terminal');
    const panel = document.getElementById('terminal-panel');
    const host = document.getElementById('terminal-host');
    const statusEl = document.getElementById('terminal-status');
    const resizeHandle = document.getElementById('terminal-resize');
    if (!btn || !panel || !host) return;

    let term = null, fitAddon = null, sock = null, isOpen = false;

    function xtermTheme() {
      const css = getComputedStyle(document.documentElement);
      const v = (n, d) => (css.getPropertyValue(n).trim() || d);
      return {
        background: v('--code-bg', '#04101e'),
        foreground: v('--text', '#b0cce0'),
        cursor: v('--accent', '#38bdf8'),
        cursorAccent: v('--code-bg', '#04101e'),
        selectionBackground: 'rgba(56,189,248,.30)',
      };
    }

    function setStatus(s) { if (statusEl) statusEl.textContent = s; }

    function fitAndResize() {
      if (!term || !fitAddon) return;
      try { fitAddon.fit(); } catch {}
      if (sock && sock.readyState === WebSocket.OPEN) {
        sock.send(JSON.stringify({ t: 'r', cols: term.cols, rows: term.rows }));
      }
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      sock = new WebSocket(proto + '//' + location.host + '/term');
      setStatus('connecting…');
      sock.onopen = () => { setStatus('connected'); fitAndResize(); term && term.focus(); };
      sock.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.t === 'o') term.write(msg.d);
        else if (msg.t === 'x') { term.write(`\r\n\x1b[90m[process exited${msg.code != null ? ' (' + msg.code + ')' : ''}]\x1b[0m\r\n`); setStatus('exited'); }
      };
      sock.onclose = () => { setStatus('disconnected'); sock = null; };
      sock.onerror = () => { setStatus('error'); };
    }

    function ensureTerm() {
      if (term || !window.Terminal) return !!term;
      term = new window.Terminal({
        cursorBlink: true,
        fontFamily: "'IBM Plex Mono', ui-monospace, Menlo, monospace",
        fontSize: 13,
        theme: xtermTheme(),
        scrollback: 5000,
        allowProposedApi: true,
      });
      const FitCtor = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);
      if (FitCtor) { fitAddon = new FitCtor(); term.loadAddon(fitAddon); }
      term.open(host);
      term.onData((d) => { if (sock && sock.readyState === WebSocket.OPEN) sock.send(JSON.stringify({ t: 'i', d })); });
      return true;
    }

    function openTerminal() {
      if (!window.Terminal) { alert('Terminal gagal dimuat (xterm.js tidak tersedia).'); return; }
      isOpen = true;
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
      btn.classList.add('active');
      ensureTerm();
      if (!sock) connect();
      requestAnimationFrame(() => { fitAndResize(); term && term.focus(); });
    }

    function closeTerminal() {
      isOpen = false;
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      btn.classList.remove('active');
      if (sock) { try { sock.close(); } catch {} sock = null; }
      if (term) { try { term.dispose(); } catch {} term = null; fitAddon = null; }
    }

    btn.addEventListener('click', () => { isOpen ? closeTerminal() : openTerminal(); });
    document.getElementById('terminal-close-btn').addEventListener('click', closeTerminal);
    document.getElementById('terminal-clear-btn').addEventListener('click', () => { term && term.clear(); term && term.focus(); });
    document.getElementById('terminal-restart-btn').addEventListener('click', () => {
      if (sock) { try { sock.close(); } catch {} sock = null; }
      if (term) term.reset();
      connect();
    });

    // Resize drag (adjust panel height)
    if (resizeHandle) {
      let dragging = false;
      const onMove = (e) => {
        if (!dragging) return;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        const h = Math.min(window.innerHeight * 0.85, Math.max(120, window.innerHeight - y));
        document.documentElement.style.setProperty('--term-h', h + 'px');
        fitAndResize();
      };
      const stop = () => { dragging = false; document.body.style.userSelect = ''; };
      const start = (e) => { dragging = true; document.body.style.userSelect = 'none'; e.preventDefault(); };
      resizeHandle.addEventListener('mousedown', start);
      resizeHandle.addEventListener('touchstart', start, { passive: false });
      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('mouseup', stop);
      window.addEventListener('touchend', stop);
    }

    window.addEventListener('resize', () => { if (isOpen) fitAndResize(); });
  })();

  // ---------- Visual viewport (mobile keyboard) ----------
  if (window.visualViewport) {
    const apply = () => {
      const vv = window.visualViewport;
      $('#app').style.height = vv.height + 'px';
    };
    window.visualViewport.addEventListener('resize', apply);
    window.visualViewport.addEventListener('scroll', apply);
    apply();
  }

  // ---------- Utils ----------
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // ---------- Claude model labels (single source: server `claudeModels`) ----------
  function claudeModelLabel(id) {
    const m = (state.claudeModels || []).find(x => x.id === id);
    return m ? m.label : (id || '');
  }
  const CODEX_MODELS_UI = [
    { id: 'gpt-5-codex', label: 'GPT-5 Codex' },
    { id: 'gpt-5',       label: 'GPT-5' },
    { id: 'o4-mini',     label: 'o4-mini' },
  ];
  function codexModelOptionsHtml(selected) {
    return CODEX_MODELS_UI.map(m =>
      `<option value="${m.id}"${m.id === selected ? ' selected' : ''}>${escapeHtml(m.label)}</option>`).join('');
  }

  const KILO_MODELS_UI = [
    { id: 'kilo/kilo-auto/free',                         label: 'Kilo Auto (Free)' },
    { id: 'kilo/poolside/laguna-m.1:free',               label: 'Laguna M.1 (Free)' },
    { id: 'kilo/stepfun/step-3.7-flash:free',            label: 'Step 3.7 Flash (Free)' },
    { id: 'kilo/nvidia/nemotron-3.5-content-safety:free',label: 'Nemotron 3.5 Safety (Free)' },
    { id: 'kilo/cohere/north-mini-code:free',            label: 'North Mini Code (Free)' },
    { id: 'kilo/nvidia/nemotron-3-ultra-550b-a55b:free', label: 'Nemotron 3 Ultra (Free)' },
  ];
  function kiloModelOptionsHtml(selected) {
    return KILO_MODELS_UI.map(m =>
      `<option value="${m.id}"${m.id === selected ? ' selected' : ''}>${escapeHtml(m.label)}</option>`).join('');
  }

  function claudeModelOptionsHtml(selected) {
    return (state.claudeModels || []).map(m =>
      `<option value="${m.id}"${m.id === selected ? ' selected' : ''}>${escapeHtml(m.label)}${m.custom ? ' ⚡' : ''}</option>`).join('');
  }

  function updateEngineBadge(engine, model) {
    const badge = document.getElementById('engine-badge');
    if (!badge) return;
    badge.className = 'engine-badge ' + engine;
    const label = badge.querySelector('.engine-label');
    const modelSpan = document.getElementById('engine-model-label');
    if (label) {
      if (engine === 'qwen') label.textContent = 'Qwen Code';
      else if (engine === 'codex') label.textContent = 'Codex';
      else if (engine === 'kilo') label.textContent = 'Kilo Code';
      else label.textContent = 'Claude Code';
    }
    if (modelSpan) {
      if (engine === 'claude') {
        modelSpan.textContent = claudeModelLabel(model);
      } else if (engine === 'codex') {
        const found = CODEX_MODELS_UI.find(x => x.id === model);
        modelSpan.textContent = found ? found.label : (model || '');
      } else if (engine === 'kilo') {
        const found = KILO_MODELS_UI.find(x => x.id === model);
        modelSpan.textContent = found ? found.label : (model || '');
      } else {
        modelSpan.textContent = model === 'default' ? 'default' : (model || '');
      }
    }
    if (els.enginePopover && !els.enginePopover.hidden) syncPopoverState();
  }

  // ---------- Theme ----------
  // Tokyo Night: moon + stars
  const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  // Gruvbox: mountain (warm/earthy)
  const ICON_MTN  = '<path d="m8 3 4 8 5-5 5 15H2L8 3z"/>';
  // Nord: snowflake
  const ICON_SNOW = '<line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="4.93" y2="19.07"/>';
  // Solarized: sun
  const ICON_SUN  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  // Daylight: bright filled sun (high-contrast / outdoor)
  const ICON_DAY  = '<circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>';

  const THEME_CYCLE = ['tokyonight', 'gruvbox', 'nord', 'solarized', 'daylight'];
  const THEME_META  = {
    tokyonight: { bg: '#1a1b26', icon: ICON_MOON, title: 'Tokyo Night' },
    gruvbox:    { bg: '#282828', icon: ICON_MTN,  title: 'Gruvbox' },
    nord:       { bg: '#2e3440', icon: ICON_SNOW, title: 'Nord' },
    solarized:  { bg: '#002b36', icon: ICON_SUN,  title: 'Solarized' },
    daylight:   { bg: '#ffffff', icon: ICON_DAY,  title: 'Daylight' },
  };

  function setTheme(theme) {
    const t = THEME_META[theme] ? theme : 'tokyonight';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('theme', t); } catch {}
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', THEME_META[t].bg);
    const m = THEME_META[t];
    els.themeIcon.innerHTML = m.icon;
    els.themeToggle.title = 'Theme: ' + m.title + ' (click to cycle)';
  }
  let savedTheme = 'tokyonight';
  try { savedTheme = localStorage.getItem('theme') || 'tokyonight'; } catch {}
  setTheme(savedTheme);
  els.themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || 'tokyonight';
    const idx = THEME_CYCLE.indexOf(cur);
    setTheme(THEME_CYCLE[(idx + 1) % THEME_CYCLE.length]);
  });

  // ---------- Service Worker (PWA) ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW register failed:', err));
    });
  }

  // ---------- License & Auth check ----------
  function checkAuth() {
    fetch('/api/auth/check')
      .then(r => r.json())
      .then(d => {
        if (!d.authenticated) window.location.href = '/login.html';
      })
      .catch(() => {
        window.location.href = '/login.html';
      });
  }

  function protectLicense() {
    const b = "YnkgYW5kaWFiZHVyLg==";
    const currentYear = new Date().getFullYear();
    const txt = "Copyright © " + currentYear + " " + atob(b);
    
    const footer = document.createElement('div');
    footer.id = 'app-license-footer';
    footer.style.cssText = 'text-align:center;font-size:10px;color:var(--muted);opacity:0.75;font-family:monospace;pointer-events:none;user-select:none;-webkit-user-select:none;font-weight:500;margin-top:4px;';
    footer.textContent = txt;
    
    const container = document.getElementById('sidebar-footer-row') || document.body;
    container.appendChild(footer);

    const lock = () => {
      document.documentElement.innerHTML = '<div style="background:#0a0a0a;color:#ff8389;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;text-align:center;padding:20px;z-index:100000;position:fixed;inset:0;"><h1 style="font-size:20px;letter-spacing:0.05em;margin:0;">LICENSE VIOLATION</h1><p style="font-size:12px;color:#a8a8a8;margin:0;">Copyright notice has been altered or deleted. Application locked.</p></div>';
      throw new Error("License tampered");
    };

    const checker = () => {
      const el = document.getElementById('app-license-footer');
      if (!el || el.textContent !== txt || !container.contains(el)) {
        lock();
        return;
      }
      const s = window.getComputedStyle(el);
      if (s.display === 'none' || s.visibility === 'hidden' || parseFloat(s.opacity) < 0.05 || parseInt(s.fontSize) < 5) {
        lock();
      }
    };

    const obs = new MutationObserver((mutations) => {
      for (const m of mutations) {
        if (m.type === 'childList' || m.type === 'attributes' || m.type === 'characterData') {
          checker();
        }
      }
    });

    obs.observe(footer, { attributes: true, childList: true, characterData: true, subtree: true });
    obs.observe(container, { childList: true });

    setInterval(checker, 1000);
  }

  // ---------- Start ----------
  checkAuth();
  protectLicense();
  connect();
})();
</script>
