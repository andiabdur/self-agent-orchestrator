<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Orchestrator" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<title>Self Agent Orchestrator</title>
<style>
  /* ─── Tokens ──────────────────────────────────────────── */
  :root {
    --bg:          #111111;
    --bg-2:        #1a1a1a;
    --bg-3:        #242424;
    --border:      #2e2e2e;
    --text:        #d4d4d4;
    --text-strong: #ededed;
    --text-em:     #b8b8b8;
    --muted:       #5e5e5e;
    --accent:      #0f62fe;
    --accent-2:    #0353e9;
    --tool:        #e88c2f;
    --tool-bg:     rgba(232,140,47,.06);
    --tool-border: rgba(232,140,47,.22);
    --code-bg:     #161616;
    --code-fg:     #ffb784;
    --success:     #42be65;
    --error:       #ff8389;
    --diff-add:    #42be65;
    --diff-del:    #ff8389;
    --link:        #78a9ff;
    --user-bubble-text: #ffffff;
  }
  :root[data-theme="light"] {
    --bg:          #f8f8f8;
    --bg-2:        #eeeeee;
    --bg-3:        #e2e2e2;
    --border:      #c6c6c6;
    --text:        #1a1a1a;
    --text-strong: #000000;
    --text-em:     #404040;
    --muted:       #767676;
    --accent:      #0f62fe;
    --accent-2:    #0353e9;
    --tool:        #a84400;
    --tool-bg:     rgba(168,68,0,.05);
    --tool-border: rgba(168,68,0,.18);
    --code-bg:     #e8e8e8;
    --code-fg:     #7c3900;
    --success:     #198038;
    --error:       #da1e28;
    --diff-add:    #198038;
    --diff-del:    #da1e28;
    --link:        #0043ce;
    --user-bubble-text: #ffffff;
  }

  /* ─── Reset & base ────────────────────────────────────── */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #app {
    display: flex; flex-direction: column;
    position: fixed; inset: 0;
    height: 100vh; height: 100dvh;
    transition: right .25s cubic-bezier(.4,0,.2,1), left .25s cubic-bezier(.4,0,.2,1);
  }
  #app.viewer-open { right: var(--viewer-w, 520px); }
  #app.sidebar-pinned { left: var(--sidebar-w, 272px); }

  /* ─── Header ──────────────────────────────────────────── */
  #header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    padding-top: env(safe-area-inset-top);
    height: calc(48px + env(safe-area-inset-top));
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #btn-menu {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 6px; border-radius: 3px;
    display: flex; align-items: center; flex: 0 0 auto;
    font-family: inherit; transition: background .12s, color .12s;
  }
  #btn-menu:hover { background: var(--bg-3); color: var(--text); }
  #btn-menu:active { background: var(--border); }
  #header-title {
    flex: 1; min-width: 0;
    font-weight: 500; font-size: 13px; color: var(--text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #header-cwd {
    font-size: 11px; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 38%;
  }
  #theme-toggle {
    background: none; border: none; color: var(--muted);
    width: 32px; height: 32px; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 0; border-radius: 3px;
    transition: background .12s, color .12s;
  }
  #theme-toggle:hover { background: var(--bg-3); color: var(--text); }
  #conn-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
    transition: background .3s;
  }
  #conn-dot.connected { background: var(--success); }
  #conn-dot.disconnected { background: var(--error); }

  /* ─── Messages ────────────────────────────────────────── */
  #messages {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-user {
    align-self: flex-end; max-width: 80%;
    background: var(--accent); color: var(--user-bubble-text);
    padding: 9px 14px; border-radius: 3px;
    font-size: 14px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg-assistant {
    align-self: flex-start; max-width: 96%;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg-text {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 16px;
    word-wrap: break-word;
    font-size: 14px;
    line-height: 1.65;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .msg-text > *:first-child { margin-top: 0; }
  .msg-text > *:last-child { margin-bottom: 0; }
  .msg-text p { margin: 0 0 10px 0; }
  .msg-text h1, .msg-text h2, .msg-text h3, .msg-text h4 {
    margin: 16px 0 6px 0; line-height: 1.2;
    font-weight: 600; color: var(--text-strong);
  }
  .msg-text h1 { font-size: 18px; }
  .msg-text h2 { font-size: 16px; }
  .msg-text h3 {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; font-weight: 500;
  }
  .msg-text h4 { font-size: 13px; }
  .msg-text strong { color: var(--text-strong); font-weight: 600; }
  .msg-text em { color: var(--text-em); font-style: italic; }
  .msg-text ul, .msg-text ol { margin: 6px 0 10px 0; padding-left: 20px; }
  .msg-text li { margin: 3px 0; }
  .msg-text li > p { margin: 0; }
  .msg-text code {
    background: var(--code-bg);
    padding: 1px 5px; border-radius: 2px;
    font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--code-fg);
  }
  .msg-text pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 11px 13px; border-radius: 3px;
    margin: 10px 0; overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px; line-height: 1.55;
    -webkit-overflow-scrolling: touch;
  }
  .msg-text pre code { background: none; padding: 0; color: var(--text); font-size: inherit; }
  .msg-text hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .msg-text blockquote {
    margin: 10px 0; padding: 4px 14px;
    border-left: 2px solid var(--border); color: var(--muted);
  }
  .msg-text a { color: var(--link); text-decoration: none; }
  .msg-text a:hover { text-decoration: underline; }
  .msg-text table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .msg-text th, .msg-text td { border: 1px solid var(--border); padding: 6px 10px; }
  .msg-text th { background: var(--bg-3); font-weight: 500; text-align: left; }
  .msg-text::-webkit-scrollbar { height: 6px; }
  .msg-text::-webkit-scrollbar-track { background: transparent; }
  .msg-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ─── Tool cards ──────────────────────────────────────── */
  .tool {
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-left: 2px solid var(--tool);
    border-radius: 3px;
    overflow: hidden;
  }
  .tool-header {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .tool.expanded .tool-header { border-bottom: 1px solid var(--tool-border); }
  .tool-icon {
    flex: 0 0 auto; display: inline-flex; align-items: center;
    color: var(--tool);
  }
  .tool-icon svg { display: block; }
  .msg-thinking {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 14px; font-size: 13px;
    color: var(--muted); font-style: italic;
    border-left: 2px solid var(--border);
  }
  .msg-thinking .thinking-icon {
    flex: 0 0 auto; color: var(--accent);
    margin-top: 3px;
  }
  .msg-thinking .thinking-icon svg { display: block; }
  .msg-thinking .thinking-text { flex: 1; min-width: 0; }
  .tool-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 500;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--tool); flex: 0 0 auto;
  }
  .tool-summary {
    color: var(--muted); flex: 1; min-width: 0;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tool-status {
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    color: var(--muted); flex: 0 0 auto; letter-spacing: .03em;
    display: inline-flex; align-items: center;
  }
  .tool-status svg { display: block; }
  .tool-status.running { color: var(--tool); }
  .tool-status.done { color: var(--success); }
  .tool-status.error { color: var(--error); }
  .tool-chevron { transition: transform .15s; color: var(--muted); font-size: 10px; }
  .tool.expanded .tool-chevron { transform: rotate(90deg); }
  .tool-body { display: none; padding: 10px 12px; }
  .tool.expanded .tool-body { display: block; }
  .tool-section { margin-bottom: 10px; }
  .tool-section:last-child { margin-bottom: 0; }
  .tool-section-label {
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 5px; font-weight: 500;
  }
  .tool pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 8px 10px; border-radius: 2px;
    margin: 0; overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; line-height: 1.5;
    white-space: pre; max-height: 360px; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tool pre.wrap { white-space: pre-wrap; word-wrap: break-word; }
  .diff-add { color: var(--diff-add); }
  .diff-del { color: var(--diff-del); }

  /* ─── Spinner ─────────────────────────────────────────── */
  .spinner {
    display: inline-block;
    width: 11px; height: 11px;
    border: 2px solid var(--border); border-top-color: var(--tool);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Turn summary ────────────────────────────────────── */
  .turn-summary {
    align-self: center; color: var(--muted);
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    padding: 3px 10px;
    border: 1px solid var(--border); border-radius: 2px;
    letter-spacing: .04em;
  }

  /* ─── Empty state ─────────────────────────────────────── */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center; gap: 6px;
  }
  .empty-state-label {
    font-size: 11px; font-weight: 500; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    font-family: 'IBM Plex Mono', monospace;
  }
  .empty-state-hint {
    font-size: 13px; color: var(--muted);
  }

  /* ─── Thinking indicator (between user send & first response) ─── */
  .thinking-indicator {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    max-width: 95%;
  }
  .thinking-dots {
    display: inline-flex; gap: 4px; flex: 0 0 auto;
  }
  .thinking-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: thinking-pulse 1.4s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes thinking-pulse {
    0%, 60%, 100% { opacity: 0.2; transform: scale(0.85); }
    30%          { opacity: 1;   transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .thinking-dots span { animation: none; opacity: 0.6; }
  }

  /* ─── Composer ────────────────────────────────────────── */
  #composer {
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .composer-row {
    display: flex; align-items: flex-end; gap: 8px;
  }
  #image-previews {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 0 2px;
  }
  #image-previews:empty { display: none; }
  .image-preview {
    position: relative; width: 56px; height: 56px;
    border-radius: 3px; overflow: hidden;
    border: 1px solid var(--border); background: var(--bg-2);
    flex: 0 0 auto;
  }
  .image-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .image-preview .remove {
    position: absolute; top: 2px; right: 2px;
    background: rgba(0,0,0,.75); color: #fff;
    width: 18px; height: 18px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1;
  }
  .image-preview .remove:hover { background: var(--error); }
  #btn-attach {
    background: var(--bg-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 3px;
    width: 40px; height: 40px; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 0; font-family: inherit;
    transition: color .12s, border-color .12s;
  }
  #btn-attach:hover { color: var(--text); border-color: var(--text-em); }
  #btn-attach:disabled { opacity: 0.4; cursor: not-allowed; }
  #btn-attach svg { display: block; }

  /* Images inside user message bubble */
  .msg-user-images {
    display: grid; gap: 4px; margin-bottom: 6px;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  }
  .msg-user-images:empty { display: none; }
  .msg-user-images img {
    width: 100%; max-height: 200px;
    object-fit: cover; border-radius: 3px;
    display: block; cursor: zoom-in;
    background: rgba(0,0,0,.2);
  }
  .msg-user-text { white-space: pre-wrap; word-wrap: break-word; }

  /* Lightbox for full image view */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    z-index: 200; display: none;
    align-items: center; justify-content: center;
    padding: 20px; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #input {
    flex: 1; resize: none;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 3px;
    padding: 9px 12px; font-size: 14px;
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 40px; max-height: 160px;
    line-height: 1.4; outline: none;
    transition: border-color .15s;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }
  #btn-send {
    background: var(--accent); color: #fff; border: none;
    width: 40px; height: 40px; border-radius: 3px;
    font-size: 15px; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    transition: background .12s;
  }
  #btn-send:hover:not(:disabled) { background: var(--accent-2); }
  #btn-send:disabled { background: var(--bg-3); color: var(--muted); cursor: not-allowed; }
  #btn-send.cancel { background: var(--error); }

  /* ─── Sidebar ─────────────────────────────────────────── */
  #sidebar-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 50; display: none;
  }
  #sidebar-bg.open { display: block; }
  #sidebar {
    position: fixed; top: 0; left: -300px; bottom: 0;
    width: 272px; max-width: 84vw;
    background: var(--bg); border-right: 1px solid var(--border);
    z-index: 51;
    transition: left .22s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #sidebar.open { left: 0; }
  .sidebar-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 12px;
    height: 48px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 10px; font-weight: 500; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    font-family: 'IBM Plex Mono', monospace;
  }
  #btn-close-sidebar {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px 6px; border-radius: 2px;
    transition: background .12s, color .12s;
  }
  #btn-close-sidebar:hover { background: var(--bg-3); color: var(--text); }
  #btn-sidebar-pin {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); cursor: pointer;
    padding: 3px 5px; margin-right: 4px;
    display: none; align-items: center;
    transition: background .12s, color .12s, border-color .12s;
  }
  #btn-sidebar-pin.visible { display: inline-flex; }
  #btn-sidebar-pin svg { display: block; }
  #btn-sidebar-pin:hover { background: var(--bg-3); color: var(--text); }
  #btn-sidebar-pin.pinned { color: var(--accent); border-color: var(--accent); }
  .cwd-row {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .cwd-label {
    font-size: 10px; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase;
    letter-spacing: .07em; font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
  }
  .cwd-input-row { display: flex; gap: 6px; }
  #cwd-input {
    flex: 1; min-width: 0;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 6px 8px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; outline: none;
    transition: border-color .15s;
  }
  #cwd-input:focus { border-color: var(--accent); }
  #btn-browse {
    background: var(--bg-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 0 10px; cursor: pointer;
    display: flex; align-items: center;
    transition: background .12s, color .12s;
  }
  #btn-browse:hover { background: var(--bg-3); color: var(--text); }
  #model-select, #perm-select {
    width: 100%;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 7px 8px; font-size: 12.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    outline: none; cursor: pointer;
    transition: border-color .15s;
  }
  #model-select:focus, #perm-select:focus { border-color: var(--accent); }
  #perm-warn {
    font-size: 11px; color: var(--muted); margin-top: 6px;
    line-height: 1.45; font-family: 'IBM Plex Mono', monospace;
  }
  #btn-new {
    width: 100%;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
    text-align: center;
    transition: background .12s;
  }
  #btn-new:hover { background: var(--bg-3); }
  #btn-new:active { background: var(--border); }

  /* ─── Folder picker ───────────────────────────────────── */
  #picker-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    z-index: 100; display: none;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  #picker-bg.open { display: flex; }
  #picker {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; width: 100%; max-width: 480px;
    max-height: 80vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .picker-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; height: 44px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .picker-title { font-weight: 500; font-size: 13px; }
  #picker-close {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px 6px; border-radius: 2px;
    transition: background .12s, color .12s;
    opacity: 1;
  }
  #picker-close:hover { background: var(--bg-3); color: var(--text); }
  .picker-path {
    padding: 8px 14px; background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; color: var(--muted);
    word-break: break-all; flex-shrink: 0;
  }
  .picker-list {
    flex: 1; overflow-y: auto; padding: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .picker-item {
    padding: 10px 12px; border-radius: 2px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
    transition: background .1s, color .1s;
    color: var(--text);
  }
  .picker-item:hover { background: var(--bg-2); }
  .picker-item:active { background: var(--bg-3); }
  .picker-item .picker-icon {
    color: var(--tool); flex: 0 0 auto; display: block;
  }
  .picker-item .picker-label {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .picker-item .picker-chevron {
    color: var(--muted); flex: 0 0 auto; opacity: 0.5;
    transition: opacity .1s, transform .1s;
  }
  .picker-item:hover .picker-chevron { opacity: 1; transform: translateX(2px); }
  .picker-item.up { color: var(--muted); }
  .picker-item.up .picker-icon { color: var(--muted); }
  .picker-item.up:hover { color: var(--text); }
  .picker-item.up:hover .picker-icon { color: var(--text); }
  .picker-empty {
    padding: 20px; text-align: center;
    color: var(--muted); font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .picker-footer {
    padding: 10px 14px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
    flex-shrink: 0;
  }
  .picker-footer button {
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 2px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 500;
    transition: background .12s;
  }
  .picker-footer button:hover { background: var(--bg-3); }
  .picker-footer button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .picker-footer button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  #picker-create-row {
    display: none; padding: 8px 14px; gap: 6px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #picker-create-row.open { display: flex; }
  #picker-create-input {
    flex: 1; min-width: 0;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 2px;
    padding: 6px 9px; font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace; outline: none;
  }
  #picker-create-input::placeholder { color: var(--muted); }
  #picker-newfolder {
    margin-right: auto;
  }

  /* ─── Session list ────────────────────────────────────── */
  .sidebar-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    flex-shrink: 0; padding: 0 8px; gap: 2px;
  }
  .sidebar-tab {
    flex: 1; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer; padding: 10px 4px 8px;
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase; letter-spacing: .08em; font-weight: 500;
    transition: color .12s, border-color .12s;
    text-align: center;
  }
  .sidebar-tab:hover { color: var(--text); }
  .sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .sidebar-view { display: none; flex-direction: column; }
  .sidebar-view.active { display: flex; flex: 1; overflow: hidden; min-height: 0; }
  .session-list {
    flex: 1; overflow-y: auto; padding: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .session-item {
    padding: 8px 10px; border-radius: 2px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 2px;
    transition: background .1s;
  }
  .session-item:hover { background: var(--bg-2); }
  .session-item.active { background: var(--bg-3); }
  .session-text { flex: 1; min-width: 0; }
  .session-title-row {
    font-size: 13px; font-weight: 400; color: var(--text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session-weight {
    margin-top: 3px; font-size: 10.5px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted); letter-spacing: .02em;
  }
  .session-weight.medium { color: var(--tool); }
  .session-weight.heavy  { color: var(--error); }
  .session-meta {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .session-action {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 6px; font-size: 0;
    opacity: 0.7; border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: opacity .12s, background .12s, color .12s;
    flex: 0 0 auto;
  }
  .session-action svg { display: block; }
  .session-item:hover .session-action,
  .session-item.active .session-action { opacity: 1; }
  .session-action:hover { background: var(--bg-3); opacity: 1; }
  .session-action.delete:hover { color: var(--error); }
  .session-action.rename:hover { color: var(--accent); }

  /* ─── Node chips ──────────────────────────────────────── */
  #node-row { display: none; }
  .node-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .node-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-2); color: var(--muted);
    font-size: 11.5px; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    transition: background .12s, color .12s, border-color .12s;
    white-space: nowrap; line-height: 1;
  }
  .node-chip:hover { background: var(--bg-3); color: var(--text); }
  .node-chip.active {
    background: var(--accent); color: #fff;
    border-color: var(--accent);
  }
  .node-chip.active:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .node-chip.active { cursor: default; }
  .node-chip.connecting { opacity: 0.65; pointer-events: none; }
  .node-chip .ndot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
  }
  .node-chip.active .ndot { background: rgba(255,255,255,.75); }
  #node-badge {
    display: none;
    font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    color: var(--accent);
    background: rgba(15,98,254,.1);
    border: 1px solid rgba(15,98,254,.22);
    padding: 2px 8px; border-radius: 10px;
    white-space: nowrap; flex: 0 0 auto;
    letter-spacing: .03em;
  }

  /* ─── File list ───────────────────────────────────────── */
  .file-path-row {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .file-path-label {
    font-size: 10px; color: var(--muted); margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: .07em; font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
  }
  .file-path-value {
    font-size: 11px; color: var(--text-em);
    font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-list {
    flex: 1; overflow-y: auto; padding: 4px 6px;
    -webkit-overflow-scrolling: touch;
  }
  .file-item {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px; border-radius: 2px; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    transition: background .1s;
  }
  .file-item:hover { background: var(--bg-2); }
  .file-item:active { background: var(--bg-3); }
  .file-item .fi-icon {
    flex: 0 0 auto; display: flex; align-items: center;
    color: var(--muted);
  }
  .file-item.dir .fi-icon { color: var(--tool); }
  .file-item .fi-name {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-item .fi-size {
    flex: 0 0 auto; font-size: 10px; color: var(--muted); white-space: nowrap;
  }
  .file-item .fi-dl {
    flex: 0 0 auto; display: none; background: none; border: none;
    color: var(--muted); cursor: pointer; padding: 2px; border-radius: 2px;
    font-size: 0; line-height: 1;
  }
  .file-item .fi-dl svg { display: block; }
  .file-item:hover .fi-dl { display: block; }
  .file-item .fi-dl:hover { background: var(--bg-3); color: var(--accent); }
  .file-empty {
    padding: 20px; text-align: center; color: var(--muted);
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
  }
  .file-loading {
    padding: 20px; text-align: center; display: flex;
    align-items: center; justify-content: center; gap: 8px;
    color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace;
  }

  /* On touch devices (no hover), keep them clearly visible */
  @media (pointer: coarse) {
    .session-action { opacity: 0.85; }
  }

  /* ─── File viewer ────────────────────────────────────── */
  #viewer {
    position: fixed; top: 0; right: calc(-1 * var(--vw, 540px)); bottom: 0;
    width: var(--vw, min(520px, 52vw));
    background: var(--bg); border-left: 1px solid var(--border);
    z-index: 44; display: flex; flex-direction: column;
    transition: right .25s cubic-bezier(.4,0,.2,1);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #viewer.open { right: 0; }
  @media (max-width: 700px) {
    #viewer { width: 100%; right: -100vw; }
    #viewer.open { right: 0; }
    #app.viewer-open { right: 0; }
    #app.sidebar-pinned { left: 0; }
    #viewer-resize { display: none; }
  }
  #viewer.open { right: 0; }
  #viewer-header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; height: 48px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #viewer-filename {
    flex: 1; min-width: 0;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    color: var(--text-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #viewer-raw-btn {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); cursor: pointer; padding: 3px 9px;
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    transition: background .12s, color .12s; white-space: nowrap; flex: 0 0 auto;
  }
  #viewer-raw-btn:hover { background: var(--bg-3); color: var(--text); }
  #viewer-close {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px 6px; border-radius: 2px; flex: 0 0 auto;
    transition: background .12s, color .12s;
  }
  #viewer-close:hover { background: var(--bg-3); color: var(--text); }
  #viewer-body {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 20px 22px; font-size: 14px; line-height: 1.65;
    -webkit-overflow-scrolling: touch;
  }
  #viewer-body.md > *:first-child { margin-top: 0; }
  #viewer-body.md p { margin: 0 0 10px; }
  #viewer-body.md h1,#viewer-body.md h2,#viewer-body.md h3,#viewer-body.md h4 {
    margin: 18px 0 6px; font-weight: 600; color: var(--text-strong); line-height: 1.2;
  }
  #viewer-body.md h1 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  #viewer-body.md h2 { font-size: 16px; }
  #viewer-body.md h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  #viewer-body.md strong { color: var(--text-strong); font-weight: 600; }
  #viewer-body.md em { color: var(--text-em); font-style: italic; }
  #viewer-body.md code {
    background: var(--code-bg); padding: 1px 5px; border-radius: 2px;
    font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; color: var(--code-fg);
  }
  #viewer-body.md pre {
    background: var(--code-bg); border: 1px solid var(--border);
    padding: 11px 13px; border-radius: 3px; margin: 10px 0; overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.55;
  }
  #viewer-body.md pre code { background: none; padding: 0; color: var(--text); }
  #viewer-body.md ul,#viewer-body.md ol { margin: 6px 0 10px; padding-left: 20px; }
  #viewer-body.md li { margin: 3px 0; }
  #viewer-body.md blockquote { margin: 10px 0; padding: 4px 14px; border-left: 2px solid var(--border); color: var(--muted); }
  #viewer-body.md a { color: var(--link); text-decoration: none; }
  #viewer-body.md a:hover { text-decoration: underline; }
  #viewer-body.md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  #viewer-body.md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
  #viewer-body.md th,#viewer-body.md td { border: 1px solid var(--border); padding: 6px 10px; }
  #viewer-body.md th { background: var(--bg-3); font-weight: 500; text-align: left; }
  #viewer-body.raw {
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6;
    white-space: pre-wrap; word-wrap: break-word; color: var(--text);
  }
  #viewer-body.csv .csv-wrap { overflow-x: auto; }
  #viewer-body.csv table { border-collapse: collapse; font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; }
  #viewer-body.csv th {
    background: var(--bg-3); font-weight: 500;
    position: sticky; top: 0; z-index: 1;
  }
  #viewer-body.csv th,#viewer-body.csv td { border: 1px solid var(--border); padding: 5px 10px; white-space: nowrap; }
  #viewer-body.csv tr:nth-child(even) td { background: var(--bg-2); }
  #viewer-body.img {
    padding: 0; background: var(--bg-2);
    display: flex; align-items: center; justify-content: center;
  }
  #viewer-body.img img {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
  }
  #viewer-body.img.svg img { background: #fff; }
  #viewer-resize {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 6px; cursor: col-resize;
    background: transparent; transition: background .15s; z-index: 1;
  }
  #viewer-resize:hover, #viewer-resize.dragging { background: var(--accent); }
  #btn-pin {
    background: none; border: 1px solid var(--border); border-radius: 2px;
    color: var(--muted); cursor: pointer;
    padding: 3px 7px; font-size: 13px;
    transition: background .12s, color .12s; line-height: 1; flex: 0 0 auto;
  }
  #btn-pin:hover { background: var(--bg-3); color: var(--text); }
  #btn-pin.pinned { color: var(--accent); border-color: var(--accent); }
  .msg-text code.file-link {
    cursor: pointer;
    text-decoration: underline; text-decoration-style: dotted;
    text-decoration-color: var(--tool);
  }
  .msg-text code.file-link:hover { background: var(--tool-bg); }

  .tool-view-btn {
    font-size: 10.5px; font-family: 'IBM Plex Mono', monospace;
    color: var(--accent); background: rgba(15,98,254,.08);
    border: 1px solid rgba(15,98,254,.2); border-radius: 2px;
    padding: 2px 7px; cursor: pointer; flex: 0 0 auto;
    transition: background .12s; white-space: nowrap; line-height: 1.4;
  }
  .tool-view-btn:hover { background: rgba(15,98,254,.18); }

  /* ─── Reduced motion ──────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ─── Engine indicator badge ─────────────────────────── */
  .engine-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--bg-2);
    flex: 0 0 auto;
  }
  .engine-badge.claude { border-color: var(--accent); color: var(--accent); }
  .engine-badge.opencode { border-color: #4ade80; color: #4ade80; }
  .engine-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .engine-label { text-transform: capitalize; }
  .engine-model { opacity: 0.7; }
  .engine-model::before { content: '· '; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button id="btn-menu" type="button" aria-label="Open menu">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
        <rect y="0" width="16" height="1.5" rx="0.75"/>
        <rect y="5.25" width="16" height="1.5" rx="0.75"/>
        <rect y="10.5" width="16" height="1.5" rx="0.75"/>
      </svg>
    </button>
    <div id="header-title">New chat</div>
    <div id="header-cwd"></div>
    <div id="node-badge"></div>
    <button id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
      <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
    <div id="conn-dot" title="Connection status"></div>
  </div>

  <div id="messages">
    <div class="empty-state">
      <div class="empty-state-label">New conversation</div>
      <div class="empty-state-hint">Type a message below to begin.</div>
    </div>
  </div>

  <div id="composer">
    <div id="image-previews"></div>
    <div class="composer-row">
      <button id="btn-attach" type="button" title="Attach image" aria-label="Attach image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input type="file" id="file-input" accept="image/*" multiple hidden />
      <textarea id="input" rows="1" placeholder="Type a message…"></textarea>
      <!-- Engine indicator -->
      <div id="engine-badge" class="engine-badge claude" title="Active engine">
        <span class="engine-dot"></span>
        <span class="engine-label">Claude Code</span>
        <span class="engine-model" id="engine-model-label">sonnet</span>
      </div>
      <button id="btn-send" type="button" disabled>➤</button>
    </div>
  </div>

  <div id="lightbox"><img alt="" /></div>
</div>

<div id="picker-bg">
  <div id="picker">
    <div class="picker-header">
      <div class="picker-title">Choose folder</div>
      <button id="picker-close" type="button">×</button>
    </div>
    <div class="picker-path" id="picker-path"></div>
    <div class="picker-list" id="picker-list"></div>
    <div id="picker-create-row">
      <input id="picker-create-input" type="text" placeholder="Folder name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button id="picker-create-confirm" type="button" class="primary">Create</button>
      <button id="picker-create-cancel" type="button">Cancel</button>
    </div>
    <div class="picker-footer">
      <button id="picker-newfolder" type="button">+ New Folder</button>
      <button id="picker-cancel" type="button">Cancel</button>
      <button id="picker-select" type="button" class="primary">Select this folder</button>
    </div>
  </div>
</div>
<div id="sidebar-bg"></div>
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">Sessions</div>
    <button id="btn-sidebar-pin" type="button" title="Pin sidebar"></button>
    <button id="btn-close-sidebar" type="button">×</button>
  </div>
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" data-tab="session">Sessions</button>
    <button class="sidebar-tab" data-tab="file">Files</button>
  </div>
  <div id="session-view" class="sidebar-view active">
    <div id="node-row" class="cwd-row">
      <div class="cwd-label">Machine</div>
      <div id="node-list" class="node-chips"></div>
    </div>
    <div class="cwd-row">
      <div class="cwd-label">Working directory</div>
      <div class="cwd-input-row">
        <input id="cwd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button id="btn-browse" type="button" title="Browse folders">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="cwd-row">
      <div class="cwd-label">Model</div>
      <select id="model-select">
        <option value="sonnet">Sonnet — balanced (default)</option>
        <option value="opus">Opus — most capable</option>
        <option value="haiku">Haiku — fast &amp; cheap</option>
      </select>
    </div>
    <div class="cwd-row">
      <div class="cwd-label">Permission mode</div>
      <select id="perm-select">
        <option value="bypassPermissions">Bypass — auto-approve all</option>
        <option value="acceptEdits">Accept edits</option>
        <option value="plan">Plan — read-only</option>
      </select>
      <div id="perm-warn"></div>
    </div>
    <div class="cwd-row">
      <div class="cwd-label">Engine</div>
      <select id="engine-select">
        <option value="claude">Claude Code</option>
        <option value="opencode">OpenCode</option>
      </select>
    </div>
    <div class="cwd-row" style="display:flex;gap:8px;">
      <button id="btn-new" type="button" style="flex:1;">+ New Chat</button>
      <button id="btn-compact" type="button" title="Summarize history to reclaim context (/compact)" style="flex:0 0 auto;background:var(--bg-2);color:var(--muted);border:1px solid var(--border);padding:7px 11px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:12.5px;">⊟ Compact</button>
    </div>
    <div class="session-list" id="session-list"></div>
  </div>
  <div id="file-view" class="sidebar-view">
    <div class="file-path-row">
      <div class="file-path-label">Current directory</div>
      <div class="file-path-value" id="file-path-text"></div>
    </div>
    <div class="file-list" id="file-list"></div>
  </div>
  <div class="cwd-row" id="sidebar-footer-row" style="border-top:1px solid var(--border); padding-top:12px; margin-top:auto; flex-shrink:0; display:flex; flex-direction:column; gap:12px;">
    <button id="btn-logout" type="button" onmouseover="this.style.background='rgba(255,131,137,0.08)'" onmouseout="this.style.background='var(--bg-2)'" style="width:100%; background:var(--bg-2); color:var(--error); border:1px solid var(--border); border-radius:2px; padding:8px 12px; font-size:13px; font-weight:500; cursor:pointer; text-align:center; transition:background .12s, color .12s;">Logout</button>
  </div>
</aside>

<div id="viewer">
  <div id="viewer-resize"></div>
  <div id="viewer-header">
    <span id="viewer-filename"></span>
    <button id="btn-pin" type="button" title="Pin viewer">📌</button>
    <button id="viewer-raw-btn" type="button">Raw</button>
    <button id="viewer-close" type="button">×</button>
  </div>
  <div id="viewer-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
(() => {
  if (window.marked) {
    marked.setOptions({ breaks: true, gfm: true });
  }
  function renderMarkdown(text) {
    if (!window.marked) return escapeHtml(text);
    const html = marked.parse(text || '');
    if (window.DOMPurify) return DOMPurify.sanitize(html);
    return html;
  }
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  const els = {
    messages: $('#messages'),
    input: $('#input'),
    btnSend: $('#btn-send'),
    btnAttach: $('#btn-attach'),
    fileInput: $('#file-input'),
    imagePreviews: $('#image-previews'),
    lightbox: $('#lightbox'),
    lightboxImg: $('#lightbox img'),
    btnMenu: $('#btn-menu'),
    btnNew: $('#btn-new'),
    btnCompact: $('#btn-compact'),
    btnCloseSidebar: $('#btn-close-sidebar'),
    sidebar: $('#sidebar'),
    sidebarBg: $('#sidebar-bg'),
    sessionList: $('#session-list'),
    cwdInput: $('#cwd-input'),
    modelSelect: $('#model-select'),
    themeToggle: $('#theme-toggle'),
    themeIcon: $('#theme-icon'),
    permSelect: $('#perm-select'),
    permWarn: $('#perm-warn'),
    engineSelect: $('#engine-select'),
    headerTitle: $('#header-title'),
    headerCwd: $('#header-cwd'),
    connDot: $('#conn-dot'),
    btnLogout: $('#btn-logout'),
    nodeBadge: $('#node-badge'),
    nodeRow: $('#node-row'),
    nodeList: $('#node-list'),
  };

  const state = {
    sessionId: null,
    sessions: [],
    cwd: '',
    permissionMode: 'bypassPermissions',
    model: 'sonnet',
    engine: 'claude',
    inTurn: false,
    aborting: false,
    toolsById: new Map(),
    toolContentCache: new Map(),
    writtenFiles: new Map(),
    lastAssistantBubble: null,
    ws: null,
    nodes: [],
    currentNodeId: 'local',
    currentNodeName: 'This machine',
    nodeConnecting: false,
  };

  const PERM_WARNINGS = {
    bypassPermissions: '⚠ Auto-jalanin SEMUA tool tanpa approval. Hanya pakai di project trusted.',
    acceptEdits: 'Edit/Write auto-approved. Bash perlu approval — bakal error di mode ini headless.',
    plan: 'Read-only mode. Agen bisa explore tapi gak bisa modif file / jalanin command.',
  };
  function updatePermWarn() {
    els.permWarn.textContent = PERM_WARNINGS[state.permissionMode] || '';
  }

  // ---------- WS ----------
  let reconnectTimer = null;
  function scheduleReconnect(ms) {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, ms);
  }
  // ── Per-node storage helpers ─────────────────────────────
  // Each node has its own session list; sessionId is meaningless across nodes.
  function storedSessionId(nodeId) {
    try { return localStorage.getItem('sessionId:' + (nodeId || 'local')); } catch { return null; }
  }
  function setStoredSessionId(nodeId, sid) {
    const key = 'sessionId:' + (nodeId || 'local');
    try {
      if (sid) localStorage.setItem(key, sid);
      else localStorage.removeItem(key);
    } catch {}
  }
  function storedNodeId() {
    try { return localStorage.getItem('currentNodeId') || 'local'; } catch { return 'local'; }
  }
  function setStoredNodeId(nodeId) {
    try {
      if (nodeId && nodeId !== 'local') localStorage.setItem('currentNodeId', nodeId);
      else localStorage.removeItem('currentNodeId');
    } catch {}
  }

  // Set true while we're awaiting a remote node to connect, so the local hello
  // handler doesn't auto-load a session for 'local' before we switch over.
  let pendingNodeSwitch = null;

  function connect() {
    if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws');
    state.ws = ws;
    ws.onopen = () => {
      els.connDot.className = 'connected';
      updateSendButton();
      // If user was last on a remote node, ask the server to proxy us there.
      // The hello handler will auto-load the session for whichever node we land on.
      const lastNode = storedNodeId();
      if (lastNode && lastNode !== 'local') {
        pendingNodeSwitch = lastNode;
        send({ type: 'set_node', nodeId: lastNode });
      }
      // else: server already sent hello on connect; hello handler will auto-load.
    };
    ws.onclose = () => {
      els.connDot.className = 'disconnected';
      els.btnSend.disabled = true;
      scheduleReconnect(1500);
    };
    ws.onerror = () => { els.connDot.className = 'disconnected'; };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      handle(m);
    };
  }

  // Page Visibility — re-check WS when tab becomes visible (after phone unlock)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (!state.ws || state.ws.readyState === WebSocket.CLOSED || state.ws.readyState === WebSocket.CLOSING) {
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        connect();
      }
    }
  });

  function send(obj) {
    if (state.ws && state.ws.readyState === WebSocket.OPEN) {
      state.ws.send(JSON.stringify(obj));
    }
  }

  // ---------- Event handler ----------
  function handle(m) {
    switch (m.kind) {
      case 'hello':
        state.cwd = m.defaultCwd;
        state.permissionMode = m.defaultPerm || 'bypassPermissions';
        state.model = m.defaultModel || 'sonnet';
        state.engine = m.defaultEngine || 'claude';
        state.sessions = m.sessions || [];
        els.cwdInput.value = state.cwd;
        els.permSelect.value = state.permissionMode;
        els.modelSelect.value = state.model;
        if (els.engineSelect) els.engineSelect.value = state.engine;
        els.headerCwd.textContent = shortCwd(state.cwd);
        updatePermWarn();
        renderSessions();
        if (m.nodes) {
          state.nodes = m.nodes;
          state.currentNodeId = m.nodeId || 'local';
          state.currentNodeName = (m.nodes.find(n => n.id === (m.nodeId || 'local')) || {}).name || 'This machine';
          state.nodeConnecting = false;
          // Remove the "Connecting to X…" indicator if present.
          const ncm = document.getElementById('node-connecting-msg');
          if (ncm) ncm.remove();
        }
        renderNodeList();
        updateNodeBadge();
        updateEngineBadge(state.engine, state.model);
        // Auto-load the last-used session for whichever node we just landed on,
        // UNLESS we're still in the middle of switching to a remote node
        // (in which case the local hello is just a transient — we'll get the
        // remote's hello next and load there).
        if (!pendingNodeSwitch || pendingNodeSwitch === state.currentNodeId) {
          pendingNodeSwitch = null;
          const sid = storedSessionId(state.currentNodeId);
          if (sid) {
            send({ type: 'load_session', sessionId: sid });
          } else {
            // No saved session for this node — show clean empty state.
            state.sessionId = null;
            clearMessages();
            const e = document.createElement('div');
            e.className = 'empty-state';
            e.textContent = 'Mulai chat baru — ketik pesan di bawah.';
            els.messages.appendChild(e);
            updateHeaderTitle();
          }
        }
        refreshFileList(state.cwd);
        break;
      case 'node_connecting':
        state.currentNodeId = m.nodeId;
        state.currentNodeName = m.name;
        state.nodeConnecting = true;
        renderNodeList();
        clearMessages();
        { const ce = document.createElement('div'); ce.className = 'empty-state'; ce.id = 'node-connecting-msg'; ce.innerHTML = '<div style="display:flex;align-items:center;gap:8px;justify-content:center;"><span class="spinner"></span>Connecting to ' + escapeHtml(m.name) + '…</div>'; els.messages.appendChild(ce); }
        break;
      case 'node_set':
        state.currentNodeId = m.nodeId;
        state.currentNodeName = m.name;
        state.nodeConnecting = false;
        setStoredNodeId(m.nodeId);
        renderNodeList();
        updateNodeBadge();
        break;
      case 'session_loaded':
        loadSession(m.sessionId, m.cwd, m.events, m.permissionMode, m.model, m.active, m.engine);
        refreshFileList(m.cwd);
        break;
      case 'session_persisted':
        state.sessionId = m.sessionId;
        setStoredSessionId(state.currentNodeId, m.sessionId);
        state.sessions = m.sessions || state.sessions;
        renderSessions();
        updateHeaderTitle();
        break;
      case 'session_cleared':
        clearMessages();
        state.sessionId = null;
        setStoredSessionId(state.currentNodeId, null);
        state.inTurn = false;
        state.aborting = false;
        state.lastAssistantBubble = null;
        updateSendButton();
        updateHeaderTitle();
        renderSessions();
        renderInfoBubble(m.message);
        break;
      case 'cwd_set':
        state.cwd = m.cwd; els.cwdInput.value = m.cwd;
        els.headerCwd.textContent = shortCwd(m.cwd);
        refreshFileList(m.cwd);
        break;
      case 'permission_set':
        state.permissionMode = m.permissionMode;
        els.permSelect.value = m.permissionMode;
        updatePermWarn();
        break;
      case 'model_set':
        state.model = m.model;
        els.modelSelect.value = m.model;
        updateEngineBadge(state.engine, m.model);
        break;

      case 'engine_set':
        state.engine = m.engine;
        els.engineSelect.value = m.engine;
        // Reset model options when switching engine
        if (m.engine === 'claude') {
          els.modelSelect.innerHTML = '<option value="sonnet">Sonnet — balanced (default)</option><option value="opus">Opus — most capable</option><option value="haiku">Haiku — fast &amp; cheap</option>';
          els.modelSelect.value = state.model || 'sonnet';
        }
        updateEngineBadge(m.engine, state.model);
        break;

      case 'opencode_models':
        populateOpenCodeModels(m.models);
        updateEngineBadge(state.engine, state.model);
        break;

      case 'user_message':
        hideAndCancelThinking();
        renderUserMessage(m.text, m.images);
        // Show indicator INSTANTLY for live messages (initial wait is the
        // most painful to leave unindicated). Skip during session replay.
        if (state.inTurn || (m.timestamp && Date.now() - m.timestamp < 5000)) {
          showThinkingIndicator();
        }
        break;
      case 'turn_start':
        state.inTurn = true; updateSendButton();
        ensureAssistantBubble();
        break;
      case 'assistant_text':
        hideAndCancelThinking();
        renderAssistantText(m.text);
        scheduleThinkingIndicator();  // claude may pause then continue (next tool / text)
        break;
      case 'tool_start':
        hideAndCancelThinking();      // tool card has its own spinner — no overlap
        renderToolStart(m);
        break;
      case 'tool_result':
        hideAndCancelThinking();
        renderToolResult(m);
        scheduleThinkingIndicator();  // claude reads result, decides next step
        break;
      case 'thinking':
        hideAndCancelThinking();
        renderThinking(m.text);
        scheduleThinkingIndicator();
        break;
      case 'turn_complete':
        hideAndCancelThinking();
        renderTurnSummary(m);
        break;
      case 'aborting':
        hideAndCancelThinking();
        state.aborting = true;
        updateSendButton();
        break;
      case 'turn_end':
        hideAndCancelThinking();
        state.inTurn = false;
        state.aborting = false;
        state.lastAssistantBubble = null;
        updateSendButton();
        break;
      case 'error':
        hideAndCancelThinking();
        renderError(m.message);
        break;
    }
    scrollToBottom();
  }

  // ---------- Renderers ----------
  function clearMessages() {
    els.messages.innerHTML = '';
    state.toolsById.clear();
    state.toolContentCache.clear();
    state.writtenFiles.clear();
    state.lastAssistantBubble = null;
    hideAndCancelThinking();
  }

  // Thinking indicator: shown when claude is processing with no visible output.
  // - Instant after user_message (initial wait)
  // - Delayed (400ms) after assistant_text / tool_result / thinking so quick
  //   gaps between events don't cause flicker, but real pauses are visible.
  // Tool execution itself is NOT covered here — the tool card has its own spinner.
  const THINKING_DELAY_MS = 400;
  let thinkingTimer = null;

  function showThinkingIndicator() {
    cancelThinkingTimer();
    hideThinkingIndicator();
    const el = document.createElement('div');
    el.className = 'thinking-indicator';
    el.id = 'thinking-indicator';
    el.innerHTML =
      '<span class="thinking-dots"><span></span><span></span><span></span></span>' +
      '<span class="thinking-label">Claude lagi mikir…</span>';
    els.messages.appendChild(el);
    scrollToBottom();
  }
  function hideThinkingIndicator() {
    const el = document.getElementById('thinking-indicator');
    if (el) el.remove();
  }
  function scheduleThinkingIndicator() {
    cancelThinkingTimer();
    if (!state.inTurn) return;
    thinkingTimer = setTimeout(() => {
      thinkingTimer = null;
      if (state.inTurn) showThinkingIndicator();
    }, THINKING_DELAY_MS);
  }
  function cancelThinkingTimer() {
    if (thinkingTimer) { clearTimeout(thinkingTimer); thinkingTimer = null; }
  }
  function hideAndCancelThinking() {
    cancelThinkingTimer();
    hideThinkingIndicator();
  }

  function renderUserMessage(text, images) {
    removeEmptyState();
    const el = document.createElement('div');
    el.className = 'msg-user';
    if (images && images.length) {
      const wrap = document.createElement('div');
      wrap.className = 'msg-user-images';
      for (const img of images) {
        const i = document.createElement('img');
        // Prefer embedded thumb (multi-node safe); fall back to /api/uploads endpoint
        i.src = img.thumbData || ('/api/uploads/' + encodeURIComponent(img.filename || ''));
        i.alt = img.name || '';
        i.loading = 'lazy';
        i.addEventListener('click', () => {
          // Full-res: try /api/uploads first (works locally), fall back to thumb
          const full = img.filename ? '/api/uploads/' + encodeURIComponent(img.filename) : i.src;
          openLightbox(full);
        });
        wrap.appendChild(i);
      }
      el.appendChild(wrap);
    }
    if (text && text.trim()) {
      const t = document.createElement('div');
      t.className = 'msg-user-text';
      t.textContent = text;
      el.appendChild(t);
    }
    els.messages.appendChild(el);
    state.lastAssistantBubble = null;
  }

  function ensureAssistantBubble() {
    if (state.lastAssistantBubble) return state.lastAssistantBubble;
    const el = document.createElement('div');
    el.className = 'msg-assistant';
    els.messages.appendChild(el);
    state.lastAssistantBubble = el;
    return el;
  }

  function renderAssistantText(text) {
    if (!text || !text.trim()) return;
    const bubble = ensureAssistantBubble();
    const el = document.createElement('div');
    el.className = 'msg-text';
    el.innerHTML = renderMarkdown(text);
    linkifyFileRefs(el);
    bubble.appendChild(el);
  }

  function linkifyFileRefs(container) {
    const codes = container.querySelectorAll('code');
    for (const code of codes) {
      const raw = code.textContent.trim();
      if (!raw || raw.includes('\n')) continue;
      const base = raw.split(/[/\\]/).pop();
      if (!base || !isViewableFile(base)) continue;
      const fullPath = state.writtenFiles.get(base) || state.writtenFiles.get(raw);
      if (!fullPath) continue;
      code.classList.add('file-link');
      code.title = fullPath;
      code.addEventListener('click', (e) => {
        e.stopPropagation();
        openFileViewer(fullPath, null);
      });
    }
  }

  function linkifyAllTextBubbles() {
    const texts = els.messages.querySelectorAll('.msg-text');
    for (const t of texts) linkifyFileRefs(t);
  }

  // ── Tool icons (Lucide-style SVG, stroke 1.5) ─────────────
  const SVG = (paths, w=15, h=15) =>
    '<svg width="'+w+'" height="'+h+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+paths+'</svg>';
  const TOOL_ICONS = {
    Bash:        SVG('<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>'),
    Read:        SVG('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>'),
    Edit:        SVG('<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"/>'),
    Write:       SVG('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>'),
    Glob:        SVG('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'),
    Grep:        SVG('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><path d="M8 11h6"/>'),
    WebFetch:    SVG('<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'),
    WebSearch:   SVG('<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'),
    TodoWrite:   SVG('<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'),
    Task:        SVG('<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="10"/>'),
    NotebookEdit:SVG('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'),
  };
  const ICON_TOOL_DEFAULT = SVG('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>');
  const ICON_SPARKLE = SVG('<path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M19 14l.5 1.5L21 16l-1.5.5L19 18l-.5-1.5L17 16l1.5-.5L19 14z"/>', 13, 13);

  function renderThinking(text) {
    if (!text || !text.trim()) return;
    const bubble = ensureAssistantBubble();
    const el = document.createElement('div');
    el.className = 'msg-thinking';
    el.innerHTML = '<span class="thinking-icon">' + ICON_SPARKLE + '</span><span class="thinking-text"></span>';
    el.querySelector('.thinking-text').textContent = text;
    bubble.appendChild(el);
  }

  function toolIcon(name) {
    return TOOL_ICONS[name] || ICON_TOOL_DEFAULT;
  }

  function toolSummary(name, input) {
    if (!input) return '';
    if (name === 'Bash') return input.command || '';
    if (name === 'Read') return input.file_path || '';
    if (name === 'Edit') return input.file_path || '';
    if (name === 'Write') return input.file_path || '';
    if (name === 'Glob') return input.pattern || '';
    if (name === 'Grep') return input.pattern || '';
    if (name === 'WebFetch') return input.url || '';
    if (name === 'WebSearch') return input.query || '';
    if (typeof input === 'object') {
      const k = Object.keys(input)[0];
      const v = input[k];
      return typeof v === 'string' ? v.slice(0, 100) : JSON.stringify(input).slice(0, 100);
    }
    return String(input).slice(0, 100);
  }

  function renderToolStart(m) {
    const bubble = ensureAssistantBubble();
    const el = document.createElement('div');
    el.className = 'tool';
    el.dataset.toolId = m.id;
    const summary = toolSummary(m.name, m.input);
    el.innerHTML = `
      <div class="tool-header">
        <span class="tool-chevron">▶</span>
        <span class="tool-icon">${toolIcon(m.name)}</span>
        <span class="tool-name">${escapeHtml(m.name)}</span>
        <span class="tool-summary"></span>
        <span class="tool-status running"><span class="spinner"></span></span>
      </div>
      <div class="tool-body"></div>
    `;
    el.querySelector('.tool-summary').textContent = summary;
    el.querySelector('.tool-header').addEventListener('click', () => el.classList.toggle('expanded'));

    const body = el.querySelector('.tool-body');
    body.appendChild(renderToolInput(m.name, m.input));

    bubble.appendChild(el);
    state.toolsById.set(m.id, el);
    // Store file path for View button; cache Write content so viewer works instantly
    const fp = m.input?.file_path || '';
    if (fp) el.dataset.toolFile = fp;
    if (m.name === 'Write' && fp && isViewableFile(fp) && m.input?.content != null) {
      state.toolContentCache.set(m.id, m.input.content);
    }
    // Register written/edited files so assistant text can link to them
    if ((m.name === 'Write' || m.name === 'Edit') && fp) {
      const base = fp.split(/[/\\]/).pop();
      if (base) state.writtenFiles.set(base, fp);
    }
